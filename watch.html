<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY WATCH LIVE</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;overflow:hidden}#videoWrap{position:fixed;inset:0;background:#111}#remoteVideo{width:100%;height:100%;object-fit:cover}#offline{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;z-index:20;text-align:center;padding:20px}.liveBadge{background:red;padding:6px 12px;border-radius:15px;font-weight:bold;font-size:12px}.bottomBar{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}.comments{max-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}.comment{background:rgba(0,0,0,.6);padding:8px 12px;border-radius:18px;font-size:13px}.controls{display:flex;gap:8px}.input{flex:1;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:12px;border-radius:25px}.sendBtn{background:#ff0050;border:none;color:#fff;padding:12px 20px;border-radius:25px;font-weight:bold}.joinBtn{background:#ff0000;color:#fff;border:none;padding:12px 25px;border-radius:25px;font-weight:bold}</style></head><body>
<div id="videoWrap"><video id="remoteVideo" autoplay playsinline></video></div><div id="offline"><h2>🔴 DORNNY LIVE MARKET</h2><p id="statusMsg">Checking if seller is live...</p><button class="joinBtn" onclick="joinLive()">Join Live Market</button><button onclick="location.href='index.html'" style="background:rgba(255,255,255,.2);color:#fff;border:none;padding:10px 20px;border-radius:20px;margin-top:10px">← Market</button></div>
<div style="position:fixed;top:0;left:0;right:0;z-index:10;padding:12px;display:flex;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)"><span class="liveBadge">🔴 LIVE MARKET</span><span id="sellerStatus">Waiting</span></div>
<div class="bottomBar"><div id="comments" class="comments"></div><div class="controls"><input id="chatInput" class="input" placeholder="Ask price, order..."><button class="sendBtn" onclick="sendChat()">Send</button></div></div>
<script>const ROOM_ID='dornny-store-live-danny-2026';let peer,conn;function joinLive(){document.getElementById('statusMsg').textContent='Connecting...';peer=new Peer();peer.on('open',id=>{conn=peer.connect(ROOM_ID);conn.on('open',()=>{document.getElementById('offline').style.display='none'});conn.on('data',d=>{if(d.type==='chat')addComment(d.user,d.text)});});peer.on('call',call=>{call.answer();call.on('stream',s=>{document.getElementById('remoteVideo').srcObject=s;document.getElementById('offline').style.display='none'})});peer.on('error',e=>{document.getElementById('statusMsg').textContent='Seller not live yet, try again'})}function addComment(u,t){const b=document.getElementById('comments'),d=document.createElement('div');d.className='comment';d.innerHTML='<b>'+u+':</b> '+t;b.appendChild(d);b.scrollTop=b.scrollHeight}function sendChat(){const i=document.getElementById('chatInput');if(!i.value.trim()||!conn)return;addComment('You',i.value);conn.send({type:'chat',user:'Buyer',text:i.value});i.value=''}document.getElementById('chatInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendChat()})</script></body></html>
