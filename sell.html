<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell - Dornny's Market</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow">
<h2 class="text-2xl font-bold mb-4">Sell Your Item</h2>
<input id="name" placeholder="Product Name" class="w-full p-3 border rounded mb-3">
<input id="price" type="number" placeholder="Price GHS" class="w-full p-3 border rounded mb-3">
<input id="category" placeholder="Category" class="w-full p-3 border rounded mb-3">
<input id="whatsapp" placeholder="Your WhatsApp e.g. 0244..." class="w-full p-3 border rounded mb-3">
<textarea id="desc" placeholder="Description" class="w-full p-3 border rounded mb-3"></textarea>
<input id="image" type="file" accept="image/*" class="w-full p-3 border rounded mb-3">
<img id="preview" class="hidden w-full h-48 object-cover rounded mb-3">
<button id="submitBtn" class="w-full bg-black text-white p-3 rounded-xl font-bold">Upload Product</button>
<p id="status" class="text-center mt-3"></p>
<a href="/" class="block text-center mt-4 text-sm underline">Back to Market</a>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBpZzAyVZegord63vYH_zkX2weSv2Ds6BA",
  authDomain: "dornnysmarket.firebaseapp.com",
  projectId: "dornnysmarket",
  storageBucket: "dornnysmarket.firebasestorage.app",
  messagingSenderId: "726307073658",
  appId: "1:726307073658:web:957d1225916799d9fa95c3",
  measurementId: "G-WYVEH8VG5V"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let base64Image = "";
document.getElementById('image').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{ base64Image = ev.target.result; document.getElementById('preview').src=base64Image; document.getElementById('preview').classList.remove('hidden'); };
  reader.readAsDataURL(file);
});
document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const name=document.getElementById('name').value.trim();
  const price=document.getElementById('price').value.trim();
  const category=document.getElementById('category').value.trim();
  const whatsapp=document.getElementById('whatsapp').value.trim();
  const desc=document.getElementById('desc').value.trim();
  const status=document.getElementById('status');
  if(!name||!price||!whatsapp||!base64Image){status.innerText="Fill all fields + image"; return;}
  status.innerText="Uploading..."; document.getElementById('submitBtn').disabled=true;
  try{
    await addDoc(collection(db,"products"),{name,price:Number(price),category,whatsapp,desc,image:base64Image,createdAt:serverTimestamp(),approved:true});
    status.innerText="✅ Uploaded! Redirecting..."; setTimeout(()=>{window.location.href="/";},2000);
  }catch(err){ status.innerText="Error: "+err.message; document.getElementById('submitBtn').disabled=false; }
});
</script>
</body>
</html>
