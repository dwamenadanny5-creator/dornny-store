<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload - Dornny Market</title><style>body{font-family:Arial;background:#f5f5f5;padding:15px}.card{background:white;padding:20px;border-radius:20px;max-width:400px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,0.1)}input,select{width:100%;padding:15px;margin:8px 0;border-radius:12px;border:1px solid #ddd;background:#f0f0f0;font-size:16px;box-sizing:border-box}button{border:none;cursor:pointer}.blackBtn{background:black;color:white;padding:15px 25px;border-radius:30px;width:80%;font-weight:bold;display:block;margin:15px auto}.greenBtn{background:#00b050;color:white;padding:18px;border-radius:30px;width:100%;font-weight:bold;font-size:18px;margin-top:20px}</style></head><body><div class="card"><h2 style="text-align:center;margin:0">Upload Product</h2><p style="text-align:center;color:#00b050;font-weight:bold;margin:5px">✅ Slide Images Enabled - Compressed</p><input id="pname" placeholder="Product name e.g. Akoti"><input id="pdesc" placeholder="Type e.g. Club top"><input id="pprice" type="number" placeholder="Price e.g. 80"><select id="pcat"><option>Fashion</option><option>Boys top</option><option>Shoes</option><option>Electronics</option></select><div style="border:2px dashed #ccc;border-radius:15px;padding:15px;text-align:center;margin-top:15px"><p>📸 Choose up to 5 Images (slide left/right)</p><button class="blackBtn" onclick="openGallery()">Select Images from Gallery</button><input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleFiles(this)"><div id="preview" style="display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px"></div><p id="count" style="color:#555;font-size:13px">No images selected</p></div><button class="greenBtn" id="upBtn" onclick="uploadProduct()">UPLOAD TO MARKET</button><a href="index.html" style="display:block;text-align:center;color:red;text-decoration:none;margin-top:15px;font-weight:bold">← Back to Shop</a></div><script>let selectedBase64=[];function openGallery(){document.getElementById('imageInput').click();}function compressImage(file,callback){const reader=new FileReader();reader.onload=function(e){const img=new Image();img.onload=function(){const canvas=document.createElement('canvas');const MAX=500;let w=img.width,h=img.height;if(w>h){if(w>MAX){h*=MAX/w;w=MAX;}}else{if(h>MAX){w*=MAX/h;h=MAX;}}canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);callback(canvas.toDataURL('image/jpeg',0.6));};img.src=e.target.result;};reader.readAsDataURL(file);}function handleFiles(input){const files=Array.from(input.files).slice(0,5);selectedBase64=[];const preview=document.getElementById('preview');preview.innerHTML='';document.getElementById('count').innerText='Compressing '+files.length+' images...';let done=0;files.forEach((file,i)=>{compressImage(file,(base64)=>{selectedBase64[i]=base64;preview.innerHTML+=`<img src="${base64}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin:4px;border:2px solid #000">`;done++;if(done===files.length){document.getElementById('count').innerText=files.length+' images selected ✅ - Now click UPLOAD (compressed)';}});});}function uploadProduct(){const btn=document.getElementById('upBtn');const name=document.getElementById('pname').value.trim();const desc=document.getElementById('pdesc').value.trim()||"Club top";const price=document.getElementById('pprice').value.trim();const cat=document.getElementById('pcat').value;if(!name||!price){alert("Please fill name and price");return;}if(selectedBase64.length===0||selectedBase64.includes(undefined)){alert("Wait for images to compress...");return;}btn.innerText="UPLOADING...";try{let products=JSON.parse(localStorage.getItem('dornnyProducts')||localStorage.getItem('products')||'[]');const newProduct={id:Date.now(),name:name,desc:desc,price:price,category:cat,images:selectedBase64,image:selectedBase64[0]};products.unshift(newProduct);localStorage.setItem('dornnyProducts',JSON.stringify(products));localStorage.setItem('products',JSON.stringify(products));alert("✅ SUCCESS! "+name+" added to market!");window.location.href='index.html';}catch(e){alert("Images still too big! Try only 3 images or smaller photos. Error: "+e.message);btn.innerText="UPLOAD TO MARKET";}}</script></body></html>
