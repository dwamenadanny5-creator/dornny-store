<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell - Dornny's Market</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#121212] text-white pb-10">
<header class="bg-black p-4 flex justify-between sticky top-0 z-20"><a href="./index.html" class="font-black">← DORNNY'S MARKET</a><span class="text-xs bg-[#2a2a2a] px-3 py-1 rounded-full">Sell</span></header>
<div class="max-w-md mx-auto p-4">
<h2 class="font-black text-xl mt-2">Add Product - 3 Images Slide</h2><p class="text-xs text-gray-400 mt-1">Images will slide left/right on product page</p>

<div class="mt-5 bg-[#1e1e1e] p-4 rounded-2xl">
<label class="text-xs font-bold">Product Name *</label><input id="name" class="w-full mt-1 p-3 rounded-xl bg-[#2a2a2a] border-0 text-sm" placeholder="e.g. Sneakers - Daby Shop">

<label class="text-xs font-bold mt-4 block">Category *</label><select id="category" class="w-full mt-1 p-3 rounded-xl bg-[#2a2a2a] border-0 text-sm"><option value="">Select</option><option>Men</option><option>Women</option><option>Kids</option><option>Shoes</option><option>Pets</option><option>Jewelry</option><option>Furniture</option><option>Office</option><option>Bags</option><option>Food</option><option>Phones</option><option>Beauty</option><option>Other</option></select>

<label class="text-xs font-bold mt-4 block">Price (GH₵) *</label><input id="price" type="number" class="w-full mt-1 p-3 rounded-xl bg-[#2a2a2a] border-0 text-sm" placeholder="80">

<label class="text-xs font-bold mt-4 block">Shop Name</label><input id="shop" class="w-full mt-1 p-3 rounded-xl bg-[#2a2a2a] border-0 text-sm" placeholder="Daby shop">

<label class="text-xs font-bold mt-4 block">WhatsApp (0xxxxxxxxx)</label><input id="wa" class="w-full mt-1 p-3 rounded-xl bg-[#2a2a2a] border-0 text-sm" placeholder="0550000000">

<div class="mt-5 border-t border-[#333] pt-4">
<p class="font-bold text-sm">📸 Product Images - 3 for Sliding</p><p class="text-[11px] text-gray-500">Upload 3 different angles - buyer can swipe left/right</p>

<label class="text-xs mt-3 block">Image 1 * (Main)</label><input id="img1" type="file" accept="image/*" class="w-full mt-1 text-xs"><img id="prev1" class="w-full h-32 object-cover rounded-xl mt-2 hidden bg-[#2a2a2a]">

<label class="text-xs mt-3 block">Image 2 (Swipe 2)</label><input id="img2" type="file" accept="image/*" class="w-full mt-1 text-xs"><img id="prev2" class="w-full h-32 object-cover rounded-xl mt-2 hidden bg-[#2a2a2a]">

<label class="text-xs mt-3 block">Image 3 (Swipe 3)</label><input id="img3" type="file" accept="image/*" class="w-full mt-1 text-xs"><img id="prev3" class="w-full h-32 object-cover rounded-xl mt-2 hidden bg-[#2a2a2a]">
</div>

<button id="postBtn" onclick="post()" class="w-full mt-6 bg-white text-black py-3.5 rounded-full font-black">Post Product with Slide</button>
<p id="status" class="text-xs text-center mt-3 text-gray-400"></p>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBpZzAyVZegord63vYH_zkX2weSv2Ds6BA",authDomain:"dornnysmarket.firebaseapp.com",projectId:"dornnysmarket",storageBucket:"dornnysmarket.firebasestorage.app",messagingSenderId:"726307073658",appId:"1:726307073658:web:957d1225916799d9fa95c3"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let b64_1="",b64_2="",b64_3="";

function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

document.getElementById('img1').addEventListener('change',async e=>{if(!e.target.files[0])return;b64_1=await toB64(e.target.files[0]);document.getElementById('prev1').src=b64_1;document.getElementById('prev1').classList.remove('hidden');});
document.getElementById('img2').addEventListener('change',async e=>{if(!e.target.files[0])return;b64_2=await toB64(e.target.files[0]);document.getElementById('prev2').src=b64_2;document.getElementById('prev2').classList.remove('hidden');});
document.getElementById('img3').addEventListener('change',async e=>{if(!e.target.files[0])return;b64_3=await toB64(e.target.files[0]);document.getElementById('prev3').src=b64_3;document.getElementById('prev3').classList.remove('hidden');});

window.post=async function(){
const name=document.getElementById('name').value.trim();const cat=document.getElementById('category').value;const price=document.getElementById('price').value.trim();const shop=document.getElementById('shop').value.trim();const wa=document.getElementById('wa').value.trim();
if(!name||!cat||!price||!b64_1){alert('Need Name, Category, Price and Image 1');return;}
document.getElementById('postBtn').innerText='Posting...';document.getElementById('postBtn').disabled=true;document.getElementById('status').innerText='Uploading product...';
try{
let imgs=[b64_1];if(b64_2)imgs.push(b64_2);if(b64_3)imgs.push(b64_3);
await addDoc(collection(db,"products"),{name,category:cat,price,shop:shop||'Dornny Shop',whatsapp:wa||'',image:b64_1,images:imgs,createdAt:serverTimestamp()});
document.getElementById('status').innerText='✅ Posted! Images will slide on market';alert('Product posted! Go to market to see slide');window.location.href='./index.html';
}catch(e){document.getElementById('status').innerText='Error: '+e.message;document.getElementById('postBtn').innerText='Post Product with Slide';document.getElementById('postBtn').disabled=false;}
}
</script></body></html>
