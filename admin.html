<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Dornny's Market</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<h1 class="text-2xl font-bold mb-4">Admin Panel - Dornny's Market</h1>
<div id="products" class="grid grid-cols-1 md:grid-cols-3 gap-4">Loading...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBpZzAyVZegord63vYH_zkX2weSv2Ds6BA",
  authDomain: "dornnysmarket.firebaseapp.com",
  projectId: "dornnysmarket",
  storageBucket: "dornnysmarket.firebasestorage.app",
  messagingSenderId: "726307073658",
  appId: "1:726307073658:web:957d1225916799d9fa95c3",
  measurementId: "G-WYVEH8VG5V"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function load(){
  const snap = await getDocs(collection(db, "products"));
  const container = document.getElementById('products');
  if(snap.empty){ container.innerHTML="No products"; return; }
  container.innerHTML="";
  snap.forEach(d=>{
    const p = d.data();
    const div = document.createElement('div');
    div.className="bg-white p-3 rounded shadow";
    div.innerHTML=`<img src="${p.image}" class="w-full h-40 object-cover rounded"><h3 class="font-bold mt-2">${p.name}</h3><p>GHS ${p.price} - ${p.whatsapp}</p><button class="bg-red-600 text-white px-3 py-1 rounded mt-2 w-full">Delete</button>`;
    div.querySelector('button').onclick=async()=>{
      if(confirm('Delete '+p.name+'?')){ await deleteDoc(doc(db,"products",d.id)); div.remove(); }
    };
    container.appendChild(div);
  });
}
load();
</script>
</body>
</html>
