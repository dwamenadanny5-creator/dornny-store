<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dornny Store</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding-bottom:80px}header{padding:15px;background:#111;display:flex;justify-content:space-between;position:sticky;top:0}#products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.prod{background:#1a1a1a;border-radius:12px;padding:10px}.prod img{width:100%;height:140px;object-fit:cover;border-radius:8px}.btn{background:#fff;color:#000;border:none;padding:8px;border-radius:8px;font-weight:bold;width:100%;margin-top:6px}#mePage{padding:20px}nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #222}nav a{color:#888;text-decoration:none;font-size:13px;text-align:center}#cartModal{display:none;position:fixed;inset:0;background:#000;z-index:20;padding:15px;overflow:auto}#search{width:100%;padding:12px;border-radius:10px;border:none;background:#222;color:#fff;margin:10px 0}.cat-bar{display:flex;gap:8px;overflow:auto;padding:0 10px 10px}.cat-bar button{background:#222;color:#fff;border:none;padding:6px 12px;border-radius:20px}</style>
</head>
<body>
<header><b>DORNNY STORE</b><span id="cartCount" style="background:#fff;color:#000;padding:3px 8px;border-radius:50%">0</span></header>
<input id="search" placeholder="Search..." oninput="filterSearch(this.value)">
<div class="cat-bar"><button onclick="filterCat('all')">All</button><button onclick="filterCat('shoes')">Shoes</button><button onclick="filterCat('clothes')">Clothes</button></div>
<section id="products"></section>
<div id="cartModal"><h2>Cart <span style="float:right" onclick="document.getElementById('cartModal').style.display='none';document.getElementById('products').style.display='grid'">✕</span></h2><div id="cartItems"></div><div style="margin-top:20px"><b>Total: GHS <span id="cartTotal">0</span></b><button class="btn" style="background:#25D366;color:#fff;margin-top:10px" onclick="checkoutWhatsApp()">Checkout WhatsApp</button><button class="btn" style="background:#333;color:#fff;margin-top:8px" onclick="clearCart()">Clear</button></div></div>
<div id="mePage" style="display:none"><h2>My Account</h2><div style="background:#111;padding:15px;border-radius:12px;margin-top:10px"><button id="googleLoginBtn" class="btn" style="padding:12px">Login with Google</button><div id="userInfo"></div></div></div>
<nav><a href="#" onclick="showHome(event)">🏠<br>Home</a><a href="#" onclick="showCart(event)">🛒<br>Cart</a><a href="#" id="meTab" onclick="showMe(event)">👤<br>Me</a></nav>
<script>
const firebaseConfig={apiKey:"AIzaSyDummy",authDomain:"dornny-store.firebaseapp.com",projectId:"dornny-store"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let allProducts=[];let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function load(){db.collection('products').onSnapshot(snap=>{allProducts=[];snap.forEach(doc=>{allProducts.push({id:doc.id,...doc.data()})});renderProducts(allProducts);});}
function renderProducts(list){const con=document.getElementById('products');con.innerHTML='';list.forEach(p=>{con.innerHTML+=`<div class="prod"><img src="${p.image||'https://via.placeholder.com/200'}"><p style="font-size:13px;margin-top:6px">${p.name}</p><b>GHS ${p.price}</b><button class="btn" onclick="addToCart('${p.id}')">Add to Cart</button></div>`;});}
window.addToCart=function(id){let it=allProducts.find(p=>p.id==id);let f=cart.find(c=>c.id==id);if(f)f.qty++;else cart.push({...it,qty:1});localStorage.setItem('cart',JSON.stringify(cart));badge();alert('Added');}
function badge(){document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);}
function renderCart(){const con=document.getElementById('cartItems');let total=0;con.innerHTML='';cart.forEach(it=>{total+=it.price*it.qty;con.innerHTML+=`<div style="display:flex;justify-content:space-between;background:#111;padding:10px;border-radius:10px;margin-bottom:8px"><span>${it.name} x${it.qty}</span><span>GHS ${it.price*it.qty} <button onclick="rem('${it.id}')" style="background:#333;color:#fff;border:none;padding:2px 6px;border-radius:4px">X</button></span></div>`});document.getElementById('cartTotal').textContent=total;}
window.rem=function(id){cart=cart.filter(c=>c.id!=id);localStorage.setItem('cart',JSON.stringify(cart));renderCart();badge();}
window.clearCart=function(){cart=[];localStorage.removeItem('cart');renderCart();badge();}
window.checkoutWhatsApp=function(){if(!cart.length)return alert('Cart empty');let msg='Hello Dornny, I want to order:%0A';cart.forEach(it=>{msg+=`- ${it.name} x${it.qty}=GHS ${it.price*it.qty}%0A`});window.open(`https://wa.me/233000000000?text=${msg}`,'_blank');}
window.filterCat=function(cat){if(cat=='all')renderProducts(allProducts);else renderProducts(allProducts.filter(p=>(p.category||'').toLowerCase().includes(cat)));}
window.filterSearch=function(q){renderProducts(allProducts.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())));}
window.showHome=function(e){if(e)e.preventDefault();document.getElementById('products').style.display='grid';document.getElementById('cartModal').style.display='none';document.getElementById('mePage').style.display='none';}
window.showCart=function(e){if(e)e.preventDefault();document.getElementById('products').style.display='none';document.getElementById('cartModal').style.display='block';document.getElementById('mePage').style.display='none';renderCart();}
load();badge();
const mePage=document.getElementById('mePage');const prodSec=document.getElementById('products');const cartMod=document.getElementById('cartModal');
window.showMe=function(e){if(e)e.preventDefault();if(prodSec)prodSec.style.display='none';if(cartMod)cartMod.style.display='none';if(mePage)mePage.style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('meTab')?.addEventListener('click',(e)=>{e.preventDefault();showMe();});
document.getElementById('googleLoginBtn')?.addEventListener('click',async()=>{const btn=document.getElementById('googleLoginBtn');btn.textContent='Loading...';try{const auth=firebase.auth();const provider=new firebase.auth.GoogleAuthProvider();const result=await auth.signInWithPopup(provider);const user=result.user;document.getElementById('userInfo').innerHTML=`<div style="text-align:center;background:#222;padding:20px;border-radius:15px;margin-top:10px"><img src="${user.photoURL}" width="70" style="border-radius:50%"><p style="font-weight:bold;margin-top:10px">Hi, ${user.displayName}!</p><p>${user.email}</p><p style="color:#0f0;margin-top:10px">✓ Logged in</p></div>`;btn.style.display='none';}catch(err){alert(err.message);btn.textContent='Login with Google';}});
</script></body></html>
