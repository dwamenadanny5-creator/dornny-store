<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dornny's Market</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{background:#121212;color:white}.cat-active{background:white;color:black!important}.product-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:50;display:none;align-items:end;justify-content:center}.product-modal.active{display:flex}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1e1e1e;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:40}.cart-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:60;display:none;flex-direction:column}.cart-modal.active{display:flex}.cat-scroll::-webkit-scrollbar{display:none}</style></head><body class="pb-20"><header class="bg-black text-white p-4 sticky top-0 z-20 flex justify-between items-center"><h1 class="font-black text-lg tracking-wide">DORNNY'S MARKET</h1><div class="flex gap-2"><a href="./live.html" class="bg-red-600 text-white px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1">🔴 LIVE</a><a href="./sell.html" class="bg-[#2a2a2a] text-white px-4 py-1.5 rounded-full text-sm font-bold">+ Sell</a></div></header><div class="p-3"><input id="search" placeholder="Search shoes, phones, clothes..." class="w-full p-3 rounded-full bg-[#2a2a2a] text-white placeholder-gray-400 border-0"></div><div class="flex gap-2 px-3 overflow-x-auto pb-3 text-sm cat-scroll"><button onclick="filterCat('',this)" class="cat-btn cat-active px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">All</button><button onclick="filterCat('Men',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Men</button><button onclick="filterCat('Women',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Women</button><button onclick="filterCat('Kids',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Kids</button><button onclick="filterCat('Shoes',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Shoes</button><button onclick="filterCat('Pets',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Pets</button><button onclick="filterCat('Jewelry',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Jewelry</button><button onclick="filterCat('Furniture',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Furniture</button><button onclick="filterCat('Office',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Office</button><button onclick="filterCat('Bags',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Bags</button><button onclick="filterCat('Food',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Food</button><button onclick="filterCat('Phones',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Phones</button><button onclick="filterCat('Beauty',this)" class="cat-btn px-4 py-1.5 rounded-full whitespace-nowrap bg-[#2a2a2a]">Beauty</button></div><div id="products" class="grid grid-cols-2 gap-3 p-3"><p class="col-span-full text-center py-20 text-gray-400">Loading products...</p></div><div id="modal" class="product-modal" onclick="closeModal()"><div class="bg-[#1e1e1e] rounded-t-[24px] w-full max-w-md overflow-hidden max-h-[92vh] flex flex-col" onclick="event.stopPropagation()"><div class="overflow-y-auto"><div class="w-12 h-1 bg-gray-600 rounded-full mx-auto mt-3"></div><img id="mImage" src="" class="w-full h-80 object-cover mt-3"><div class="p-5"><div class="flex justify-between items-start"><h3 id="mName" class="font-bold text-lg flex-1"></h3><button id="mFollowBtn" onclick="toggleFollow()" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold ml-2">+ Follow</button></div><p id="mCategory" class="text-sm text-gray-400"></p><p id="mPrice" class="font-black text-2xl mt-2 text-white"></p><p id="mShop" class="text-sm mt-1 text-gray-400"></p><div class="flex gap-4 mt-3 text-xs text-gray-400"><span id="mLikes" class="cursor-pointer" onclick="toggleLike()"><i class="fa-regular fa-heart"></i> <b class="text-white">0</b> likes</span><span id="mFollowers"><i class="fa-solid fa-users"></i> <b class="text-white">0</b> followers</span><span id="mRating"><i class="fa-solid fa-star text-yellow-400"></i> <b class="text-white">4.5</b> rating</span><span id="mCommentCount"><i class="fa-regular fa-comment"></i> <b class="text-white">0</b> comments</span></div><a id="mWhatsapp" href="#" target="_blank" class="block mt-4 bg-green-500 text-white text-center py-3.5 rounded-full font-bold"><i class="fa-brands fa-whatsapp"></i> Chat / Message Seller</a><button onclick="addToCart()" class="block w-full mt-2 bg-white text-black text-center py-3.5 rounded-full font-bold"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button><div class="flex gap-5 mt-5 border-b border-[#333]"><button id="tabComment" class="pb-2 border-b-2 border-white font-bold text-sm" onclick="showTab('comment')">Comments / Messages</button><button id="tabRate" class="pb-2 border-b-2 border-transparent text-gray-500 text-sm" onclick="showTab('rate')">Ratings & Likes</button></div><div id="commentSection" class="mt-3"><div id="commentList" class="flex flex-col gap-2 max-h-32 overflow-y-auto"></div><div class="flex gap-2 mt-3"><input id="commentInput" placeholder="Write comment or message..." class="flex-1 bg-[#2a2a2a] p-2.5 rounded-full text-sm border-0"><button onclick="postComment()" class="bg-white text-black w-10 h-10 rounded-full font-bold"><i class="fa-solid fa-paper-plane"></i></button></div></div><div id="rateSection" class="mt-3 hidden"><div class="text-center py-4"><div id="mRatingBig" class="text-4xl font-black">4.5</div><div class="text-yellow-400 mt-1"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i></div><div class="text-xs text-gray-500 mt-1">Tap to rate</div><div class="flex justify-center gap-1 mt-3"><button onclick="rateProduct(1)" class="text-2xl">⭐</button><button onclick="rateProduct(2)" class="text-2xl">⭐</button><button onclick="rateProduct(3)" class="text-2xl">⭐</button><button onclick="rateProduct(4)" class="text-2xl">⭐</button><button onclick="rateProduct(5)" class="text-2xl">⭐</button></div><button id="likeBtnDetail" onclick="toggleLike()" class="mt-4 bg-[#2a2a2a] px-6 py-2 rounded-full text-sm"><i class="fa-regular fa-heart"></i> Like this product</button></div></div></div></div></div></div><div id="cartModal" class="cart-modal" onclick="closeCartModal(event)"><div class="bg-[#1e1e1e] rounded-t-[24px] w-full max-w-md mt-auto max-h-[90vh] flex flex-col" onclick="event.stopPropagation()"><div class="flex justify-between items-center p-5 border-b border-[#333]"><h2 class="font-black text-lg">🛒 Cart - <span id="cartCountTitle">0 items</span></h2><button onclick="closeCart()" class="bg-[#2a2a2a] w-8 h-8 rounded-full"><i class="fa-solid fa-xmark"></i></button></div><div id="cartItems" class="flex-1 overflow-y-auto p-3 flex flex-col gap-3"></div><div class="p-5 border-t border-[#333] bg-[#121212]"><div class="flex justify-between text-lg font-bold mb-2"><span>Total to Pay:</span><span id="cartTotal" class="text-green-400">GH₵ 0</span></div><p class="text-[11px] text-gray-500 mb-3">Delivery fee not included. Buyer will see this total.</p><button onclick="checkoutWhatsApp()" class="w-full bg-green-500 text-white py-3.5 rounded-full font-bold"><i class="fa-brands fa-whatsapp"></i> Checkout - Pay via WhatsApp</button><button onclick="clearCart()" class="w-full mt-2 bg-[#2a2a2a] text-white py-3 rounded-full text-sm">Clear Cart</button></div></div></div><div class="bottom-nav"><a href="./index.html" class="flex flex-col items-center text-white"><span class="text-xl">🏠</span><span class="text-[10px]">Home</span></a><a href="#" onclick="scrollToCategories()" class="flex flex-col items-center text-gray-400"><span class="text-xl">📂</span><span class="text-[10px]">Category</span></a><a href="./live.html" class="flex flex-col items-center text-gray-400"><span class="text-xl">🔥</span><span class="text-[10px]">Trend</span></a><a href="#" onclick="openCart()" class="flex flex-col items-center text-gray-400 relative"><span class="text-xl">🛒</span><span id="cartBadge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span><span class="text-[10px]">Cart</span></a><a href="#" onclick="alert('Dornny Market - Your Shop Profile\nFollowers: '+getTotalFollowers()+'\nLikes: '+getTotalLikes())" class="flex flex-col items-center text-gray-400"><span class="text-xl">👤</span><span class="text-[10px]">Me</span></a></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";const firebaseConfig = {apiKey: "AIzaSyBpZzAyVZegord63vYH_zkX2weSv2Ds6BA",authDomain: "dornnysmarket.firebaseapp.com",projectId: "dornnysmarket",storageBucket: "dornnysmarket.firebasestorage.app",messagingSenderId: "726307073658",appId: "1:726307073658:web:957d1225916799d9fa95c3"};const app = initializeApp(firebaseConfig);const db = getFirestore(app);let allProducts = [];let currentP = null;let cart = JSON.parse(localStorage.getItem('dornny_cart')||'[]');function ensureExtras(p){if(p.likes==undefined) p.likes = Math.floor(Math.random()*100)+10;if(p.liked==undefined) p.liked = false;if(p.followers==undefined) p.followers = Math.floor(Math.random()*300)+20;if(p.following==undefined) p.following = false;if(p.rating==undefined) p.rating = (4 + Math.random()).toFixed(1);if(!p.comments) p.comments = [];return p;}async function loadProducts(){try{const q = query(collection(db, "products"), orderBy("createdAt","desc"));const snap = await getDocs(q);allProducts = [];snap.forEach(doc=>{ let d={id:doc.id,...doc.data()}; allProducts.push(ensureExtras(d)); });if(allProducts.length==0){allProducts = [ensureExtras({id:'demo1',name:"Daby Shop - Sneakers", category:"Shoes", price:"80", shop:"Daby shop", image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", whatsapp:"0550000000"})];}render(allProducts);}catch(e){ document.getElementById('products').innerHTML="<p class='col-span-full text-center py-10'>Add first product via + Sell button</p>"; }}function render(list){const container = document.getElementById('products');if(list.length==0){ container.innerHTML="<p class='col-span-full text-center py-20 text-gray-400'>No products in "+activeCat+"</p>"; return; }container.innerHTML = list.map(p=>`<div class="bg-[#1e1e1e] rounded-2xl overflow-hidden cursor-pointer" onclick='openModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'><img src="${p.image}" class="w-full h-40 object-cover"><div class="p-3"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-[11px] text-gray-400 truncate">${p.shop||'Daby shop'} • ${p.category||''}</p><p class="font-black mt-1">GH₵ ${p.price}</p><div class="flex justify-between text-[11px] text-gray-500 mt-1"><span class="${p.liked?'text-red-500':''}"><i class="fa-${p.liked?'solid':'regular'} fa-heart"></i> ${p.likes}</span><span><i class="fa-regular fa-comment"></i> ${p.comments.length}</span><span><i class="fa-solid fa-star text-yellow-400"></i> ${p.rating}</span></div></div></div>`).join('');}let activeCat='';window.openModal = (p)=>{currentP=ensureExtras(p);let found = allProducts.find(x=>x.id===p.id);if(found) currentP=found;document.getElementById('mImage').src = currentP.image;document.getElementById('mName').innerText = currentP.name;document.getElementById('mCategory').innerText = currentP.category||'';document.getElementById('mPrice').innerText = 'GH₵ ' + currentP.price;document.getElementById('mShop').innerText = currentP.shop || 'Daby shop Ghana';updateModalStats();renderComments();const waNum = (currentP.whatsapp||'').toString().replace(/^0/,'');document.getElementById('mWhatsapp').href = `https://wa.me/233${waNum}?text=Hi, I'm interested in ${encodeURIComponent(currentP.name)} - GH₵ ${currentP.price}`;document.getElementById('modal').classList.add('active');showTab('comment');}function updateModalStats(){document.getElementById('mLikes').innerHTML = `<i class="fa-${currentP.liked?'solid':'regular'} fa-heart ${currentP.liked?'text-red-500':''}"></i> <b class="text-white">${currentP.likes}</b> likes`;document.getElementById('mFollowers').innerHTML = `<i class="fa-solid fa-users"></i> <b class="text-white">${currentP.followers}</b> followers`;document.getElementById('mRating').innerHTML = `<i class="fa-solid fa-star text-yellow-400"></i> <b class="text-white">${currentP.rating}</b> rating`;document.getElementById('mCommentCount').innerHTML = `<i class="fa-regular fa-comment"></i> <b class="text-white">${currentP.comments.length}</b> comments`;document.getElementById('mRatingBig').innerText = currentP.rating;document.getElementById('mFollowBtn').innerText = currentP.following?'✓ Following':' + Follow';document.getElementById('likeBtnDetail').innerHTML = currentP.liked? '<i class="fa-solid fa-heart text-red-500"></i> Liked' : '<i class="fa-regular fa-heart"></i> Like this product';}window.closeModal = ()=>{ document.getElementById('modal').classList.remove('active'); }window.toggleLike = ()=>{currentP.liked =!currentP.liked;currentP.likes += currentP.liked?1:-1;let idx = allProducts.findIndex(x=>x.id===currentP.id);if(idx>=0) allProducts[idx]=currentP;saveProductsLocal();updateModalStats();render(allProducts);}window.toggleFollow = ()=>{currentP.following =!currentP.following;currentP.followers += currentP.following?1:-1;let idx = allProducts.findIndex(x=>x.id===currentP.id);if(idx>=0) allProducts[idx]=currentP;saveProductsLocal();updateModalStats();render(allProducts);}window.showTab = (t)=>{if(t==='comment'){ document.getElementById('commentSection').classList.remove('hidden'); document.getElementById('rateSection').classList.add('hidden'); document.getElementById('tabComment').className='pb-2 border-b-2 border-white font-bold text-sm'; document.getElementById('tabRate').className='pb-2 border-b-2 border-transparent text-gray-500 text-sm'; }else { document.getElementById('commentSection').classList.add('hidden'); document.getElementById('rateSection').classList.remove('hidden'); document.getElementById('tabRate').className='pb-2 border-b-2 border-white font-bold text-sm'; document.getElementById('tabComment').className='pb-2 border-b-2 border-transparent text-gray-500 text-sm'; }}function renderComments(){const list = document.getElementById('commentList');if(!currentP.comments.length){ list.innerHTML='<p class="text-xs text-gray-500 py-2">No comments/messages yet. Be first!</p>'; return; }list.innerHTML = currentP.comments.map(c=>`<div class="bg-[#2a2a2a] p-2.5 rounded-2xl text-xs"><div class="flex justify-between"><b>${c.user}</b><span class="text-[10px] text-gray-500">${c.time||'now'}</span></div><div class="mt-1">${c.text}</div></div>`).join('');}window.postComment = ()=>{const inp = document.getElementById('commentInput');if(!inp.value.trim()) return;currentP.comments.push({user:'You',text:inp.value.trim(),time:'now'});inp.value='';let idx = allProducts.findIndex(x=>x.id===currentP.id);if(idx>=0) allProducts[idx]=currentP;saveProductsLocal();updateModalStats();renderComments();render(allProducts);}window.rateProduct = (n)=>{currentP.rating = ((parseFloat(currentP.rating)+n)/2).toFixed(1);let idx = allProducts.findIndex(x=>x.id===currentP.id);if(idx>=0) allProducts[idx]=currentP;saveProductsLocal();updateModalStats();render(allProducts);alert('Thanks! You rated '+n+' stars ⭐ New rating: '+currentP.rating);}function saveProductsLocal(){localStorage.setItem('dornny_extras', JSON.stringify(allProducts.map(p=>({id:p.id,likes:p.likes,liked:p.liked,followers:p.followers,following:p.following,rating:p.rating,comments:p.comments}))));}window.addToCart = ()=>{let exist = cart.find(c=>c.id===currentP.id);if(exist) exist.qty++;else cart.push({id:currentP.id,name:currentP.name,price:parseFloat(currentP.price),image:currentP.image,shop:currentP.shop,qty:1});localStorage.setItem('dornny_cart',JSON.stringify(cart));localStorage.setItem('cartCount', cart.reduce((s,i)=>s+i.qty,0));updateCartBadge();alert(currentP.name+' added to cart! Total: GH₵ '+getCartTotal());closeModal();openCart();}function getCartTotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }function updateCartBadge(){const totalQty = cart.reduce((s,i)=>s+i.qty,0);const badge = document.getElementById('cartBadge');document.getElementById('cartCountTitle').innerText = totalQty+' items';if(totalQty>0){ badge.innerText=totalQty; badge.classList.remove('hidden'); badge.classList.add('flex'); } else { badge.classList.add('hidden'); }}window.openCart = ()=>{document.getElementById('cartModal').classList.add('active');renderCart();}window.closeCart = ()=>{ document.getElementById('cartModal').classList.remove('active'); }window.closeCartModal = (e)=>{ if(e.target.id==='cartModal') closeCart(); }function renderCart(){const container = document.getElementById('cartItems');if(!cart.length){ container.innerHTML='<div class="text-center py-16 text-gray-500"><div class="text-5xl mb-3">🛒</div><p>Cart empty</p><p class="text-xs mt-1">Add items - buyer will see total GH₵ here</p></div>'; document.getElementById('cartTotal').innerText='GH₵ 0'; return; }container.innerHTML = cart.map(item=>`<div class="flex gap-3 bg-[#2a2a2a] p-3 rounded-2xl"><img src="${item.image}" class="w-14 h-14 rounded-xl object-cover"><div class="flex-1"><p class="text-sm font-bold truncate">${item.name}</p><p class="text-[11px] text-gray-400">${item.shop}</p><p class="font-black mt-1">GH₵ ${item.price}</p><div class="flex items-center gap-2 mt-2"><button onclick="changeQty('${item.id}',-1)" class="bg-black w-7 h-7 rounded-full text-xs">-</button><span class="text-sm">${item.qty}</span><button onclick="changeQty('${item.id}',1)" class="bg-black w-7 h-7 rounded-full text-xs">+</button><button onclick="removeItem('${item.id}')" class="ml-auto text-gray-500"><i class="fa-solid fa-trash text-xs"></i></button></div></div></div>`).join('');document.getElementById('cartTotal').innerText = 'GH₵ '+getCartTotal().toLocaleString();}window.changeQty = (id,delta)=>{let it = cart.find(c=>c.id===id); if(!it) return; it.qty+=delta; if(it.qty<=0) cart=cart.filter(c=>c.id!==id);localStorage.setItem('dornny_cart',JSON.stringify(cart)); updateCartBadge(); renderCart();}window.removeItem = (id)=>{ cart=cart.filter(c=>c.id!==id); localStorage.setItem('dornny_cart',JSON.stringify(cart)); updateCartBadge(); renderCart(); }window.clearCart = ()=>{ if(confirm('Clear cart?')){ cart=[]; localStorage.setItem('dornny_cart',JSON.stringify(cart)); updateCartBadge(); renderCart(); } }window.checkoutWhatsApp = ()=>{if(!cart.length) return alert('Cart empty');let total = getCartTotal();let msg = `Hello Dornny's Market!%0AI want to order:%0A`;cart.forEach(i=>{ msg+=`- ${i.name} x${i.qty} = GH₵ ${i.price*i.qty}%0A`; });msg+=`%0A*Total to Pay: GH₵ ${total}*%0A`;window.open(`https://wa.me/233000000000?text=${msg}`,'_blank');}window.scrollToCategories = ()=>{ window.scrollTo({top:80,behavior:'smooth'}); }window.getTotalFollowers = ()=>{ return allProducts.reduce((s,p)=>s+(p.followers||0),0); }window.getTotalLikes = ()=>{ return allProducts.reduce((s,p)=>s+(p.likes||0),0); }window.filterCat = (cat,btn)=>{document.querySelectorAll('.cat-btn').forEach(b=>{ b.classList.remove('cat-active','bg-white','text-black'); b.classList.add('bg-[#2a2a2a]'); });if(btn){ btn.classList.add('cat-active'); btn.classList.remove('bg-[#2a2a2a]'); }if(!cat) render(allProducts);else render(allProducts.filter(p=> (p.category||'').toLowerCase().includes(cat.toLowerCase())));}document.getElementById('search').addEventListener('input', e=>{const val = e.target.value.toLowerCase();const filtered = allProducts.filter(p=> p.name.toLowerCase().includes(val) || (p.category||'').toLowerCase().includes(val));render(filtered);});const savedExtras = JSON.parse(localStorage.getItem('dornny_extras')||'[]');function mergeExtras(){savedExtras.forEach(ex=>{let p = allProducts.find(x=>x.id===ex.id);if(p){ p.likes=ex.likes; p.liked=ex.liked; p.followers=ex.followers; p.following=ex.following; p.rating=ex.rating; p.comments=ex.comments; }});}loadProducts().then(()=>{ mergeExtras(); render(allProducts); updateCartBadge(); });updateCartBadge();</script></body></html>
