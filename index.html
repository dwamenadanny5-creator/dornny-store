<script>
let categories=["All","Men","Women","Kids","Sneaker","Pet","Toys","Furnitures","Office","Jewelry & Accs","Slippers","Cars","Food & Drinks","Home Decors","Phone & Accs","Second hands","Cosmetics","Bags","Appliances","Sport","Electronics"];
let defaultProducts=[{id:1001,name:"Coolane Women's Summer Wide Leg Pants - Pink",price:53.07,originalPrice:265.34,cat:"Women",imgs:["https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=600"],seller:"Coolane GH Shop"}];
let storedProducts=JSON.parse(localStorage.getItem('dornny_products_v2')||'null');let products=storedProducts&&storedProducts.length>0?storedProducts:defaultProducts;
let user=null,cart=[],currentCat="All",detailSwiper=null,liveStream=null,allScores=[],currentLeague='all',currentStatus='all',scoresInterval=null,currentMatchId=null,currentMatchLeague=null,currentMatchData=null;
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000);}
function clearNotifHistory(){localStorage.removeItem('dornny_notified_matches');localStorage.removeItem('dornny_previous_scores');toast('✅ Old spam cleared! Now only team notifications');}
function enableNotif(){
  if(!('Notification' in window)){toast('Not supported');return;}
  // Only show enabled notification ONCE
  let alreadyEnabled = localStorage.getItem('dornny_notif_enabled');
  Notification.requestPermission().then(p=>{
    if(p==='granted'){
      if(!alreadyEnabled){
        toast('✅ Team notifications ON - No spam!');
        if('serviceWorker' in navigator){
          navigator.serviceWorker.ready.then(reg=>{
            reg.showNotification('⚽ DORNNY LIVE SCORE 🇬🇭',{body:'Team notifications enabled! You will get GOAL, RED CARD, KICKOFF for your live matches - No spam! - Amansan dwaaso',icon:'icon-192.png'});
          });
        }
        localStorage.setItem('dornny_notif_enabled','1');
      } else {
        toast('✅ Notifications already ON');
      }
    }
  });
}
function phoneNotif(title,body,matchId){
  if(Notification.permission!=='granted') return;
  // ANTI-SPAM: Check if we already notified this exact event
  let notified = JSON.parse(localStorage.getItem('dornny_notified_matches')||'{}');
  let key = matchId + '|' + title + '|' + body;
  if(notified[key]) return; // Already sent, skip
  // Save and expire after 30 minutes
  notified[key]=Date.now();
  // Clean old entries older than 30 min
  for(let k in notified){ if(Date.now()-notified[k] > 30*60*1000) delete notified[k]; }
  localStorage.setItem('dornny_notified_matches', JSON.stringify(notified));

  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(reg=>{
      reg.showNotification(title,{body:body,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200],tag:matchId});
    });
  } else {
    new Notification(title,{body:body});
  }
}
function doLogin(){let loginInput=document.getElementById('emailPhone').value.trim();let pass=document.getElementById('password').value.trim();if(!loginInput||pass.length<4){toast('Enter login');return;}let key=loginInput.toLowerCase();let users=JSON.parse(localStorage.getItem('dornny_users')||'{}');if(users[key]&&users[key].password!==pass){toast('Wrong password');return;}if(!users[key]){users[key]={shop:key.split('@')[0]+' shop',email:key,password:pass,loginId:key};localStorage.setItem('dornny_users',JSON.stringify(users));}user={shop:users[key].shop,email:key,loginId:key};localStorage.setItem('dornny_user',JSON.stringify(user));document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');renderCats();render();loadScores();}
function renderCats(){document.getElementById('catList').innerHTML=categories.map(c=>`<button onclick="setCat('${c}')" class="px-4 py-2 rounded-full text-[11px] border whitespace-nowrap font-bold ${currentCat===c?'cat-active':'bg-[#f2f2f2]'}">${c}</button>`).join('');}
function setCat(c){currentCat=c;renderCats();render();}
function render(){let s=document.getElementById('search').value.trim().toLowerCase();let f=currentCat==='All'?products:products.filter(p=>p.cat===currentCat);if(s)f=f.filter(p=>p.name.toLowerCase().includes(s));document.getElementById('grid').innerHTML=f.map(p=>`<div class="bg-white rounded-xl overflow-hidden border"><div onclick="openDetail(${p.id})" class="relative"><img src="${p.imgs[0]}" class="w-full h-[180px] object-cover"></div><div class="p-2"><p class="text-[11px] font-bold truncate">${p.name}</p><p class="font-black text-[14px] text-[#ff3e3e]">GH₵${p.price||53}</p></div></div>`).join('');document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div class="flex gap-3 border-b pb-3"><img src="${c.imgs[0]}" class="w-16 h-16 rounded"><div class="flex-1"><p class="font-bold text-[12px]">${c.name}</p><button onclick="removeCart(${i})" class="bg-red-100 text-red-600 px-2 py-1 rounded-full text-[10px]">Remove</button></div></div>`).join('')||'<p class="text-center py-10">Empty</p>';let total=0;cart.forEach(c=>total+=Number(c.price||0));document.getElementById('totalPay').innerText='GH₵'+total;}
function removeCart(i){cart.splice(i,1);render();}
function setBottomActive(t){document.querySelectorAll('#bottomNav button').forEach(b=>{b.classList.remove('bottom-active');b.classList.add('text-gray-500');});let m={home:'navHome',category:'navCategory',live:'navLive',sell:'navSell',cart:'navCart',me:'navMe'};if(m[t]){document.getElementById(m[t]).classList.add('bottom-active');document.getElementById(m[t]).classList.remove('text-gray-500');}}
function navHome(){closeAllPages();render();setBottomActive('home');}
function openCategoryPage(){document.getElementById('categoryPage').style.display='block';document.getElementById('categoryGrid').innerHTML=categories.filter(c=>c!=='All').map(c=>`<div onclick="setCat('${c}');closeCategory()" class="bg-white rounded-xl overflow-hidden border"><img src="${products.find(p=>p.cat===c)?.imgs[0]||'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300'}" class="w-full h-[100px] object-cover"><div class="p-2"><p class="font-bold text-[12px]">${c}</p></div></div>`).join('');setBottomActive('category');}
function closeCategory(){document.getElementById('categoryPage').style.display='none';setBottomActive('home');}
function closeAllPages(){if(scoresInterval){clearInterval(scoresInterval);scoresInterval=null;}let tb=document.getElementById('turboBadge');if(tb)tb.remove();document.getElementById('mePage').style.display='none';document.getElementById('videosPage').style.display='none';document.getElementById('categoryPage').style.display='none';document.getElementById('cartDrawer').style.display='none';document.getElementById('detail').style.display='none';document.getElementById('notificationPage').style.display='none';document.getElementById('scoresPage').style.display='none';document.getElementById('matchDetailPage').style.display='none';document.getElementById('bottomNav').style.display='flex';}
function openDetail(id){let p=products.find(x=>x.id===id);if(!p)return;document.getElementById('dPrice').innerText='GH₵'+(p.price||53);document.getElementById('dTitleFull').innerText=p.name;document.getElementById('detailImgs').innerHTML=p.imgs.map(im=>`<div class="swiper-slide"><img src="${im}" class="w-full h-full object-cover"></div>`).join('');document.getElementById('detail').style.display='block';setTimeout(()=>{if(detailSwiper)detailSwiper.destroy();detailSwiper=new Swiper('#detailSwiper',{loop:true,pagination:{el:'.swiper-pagination'}});},100);}
function closeDetail(){document.getElementById('detail').style.display='none';}
function addCart(){cart.push(products[0]);render();openCart();}
function openCart(){document.getElementById('cartDrawer').style.display='flex';render();setBottomActive('cart');}function closeCart(){document.getElementById('cartDrawer').style.display='none';setBottomActive('home');}
function openMe(){closeAllPages();document.getElementById('mePage').style.display='block';document.getElementById('meShop').innerText=user?user.shop:'shop';document.getElementById('meEmail').innerText=user?user.email:'';setBottomActive('me');}
function openNotificationPage(){document.getElementById('notificationPage').style.display='block';}function closeNotificationPage(){document.getElementById('notificationPage').style.display='none';}

async function loadScores(){
  let leagues=['eng.1','esp.1','uefa.champions','ita.1','ger.1','fra.1','ned.1','por.1','bra.1','usa.1','ksa.1','mex.1','arg.1','uefa.europa'];
  let all=[];
  try{
    let results=await Promise.all(leagues.map(l=>fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${l}/scoreboard`).then(r=>r.json()).then(d=>({league:l,data:d})).catch(()=>null)));
    // Load previous scores from storage to prevent spam
    let prevScoresStored = JSON.parse(localStorage.getItem('dornny_previous_scores')||'{}');
    results.forEach(res=>{
      if(!res||!res.data||!res.data.events) return;
      res.data.events.forEach(ev=>{
        let comp=ev.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');
        let state=comp.status.type.state;let isLive=state==='in';let isFinished=state==='post';let isScheduled=state==='pre';
        let key=ev.id;
        let currScore = `${home.score}-${away.score}`;
        let prevScore = prevScoresStored[key];

        // ONLY notify if score actually changed and it's live
        if(prevScore && prevScore!== currScore && isLive){
          // GOAL! Show TEAMS clearly
          let homeName = home.team.displayName;
          let awayName = away.team.displayName;
          let minute = comp.status.type.shortDetail||"";
          // Try to extract scorer from detail
          let scorerInfo = comp.status.type.detail||"Goal!";
          // Example: "Bukayo Saka - 23'" or "Goal - 37'"
          phoneNotif(
            `⚽ GOAL! ${homeName} ${home.score}-${away.score} ${awayName}`,
            `${scorerInfo} • ${minute} • DORNNY LIVE SCORE 🇬🇭 • Amansan dwaaso`,
            key
          );
        }
        // KICKOFF notification - only once per match
        if(isLive &&!prevScore){
          // This is first time we see it live - notify kickoff
          let notifiedKickoff = JSON.parse(localStorage.getItem('dornny_notified_matches')||'{}');
          let kickoffKey = key + '|kickoff';
          if(!notifiedKickoff[kickoffKey]){
            phoneNotif(
              `🔴 LIVE NOW: ${home.team.displayName} vs ${away.team.displayName}`,
              `DORNNY LIVE SCORE • Kickoff ${comp.status.type.shortDetail} • ${home.team.displayName} vs ${away.team.displayName} started!`,
              key
            );
          }
        }
        // RED CARD detection
        if(comp.status.type.detail && comp.status.type.detail.toLowerCase().includes('red card')){
          if(prevScore!== currScore ||!prevScoresStored[key+'_red']){
            phoneNotif(
              `🟥 RED CARD! ${home.team.displayName} vs ${away.team.displayName}`,
              `${comp.status.type.detail} • DORNNY LIVE SCORE 🇬🇭`,
              key+'_red_'+Date.now()
            );
            prevScoresStored[key+'_red']=true;
          }
        }
        prevScoresStored[key]=currScore;
        all.push({id:ev.id,league:res.league,leagueName:res.data.leagues?res.data.leagues[0].name:res.league,status:comp.status.type.shortDetail,detail:comp.status.type.detail,state,isLive,isFinished,isScheduled,home:home.team.displayName,homeAbbr:home.team.abbreviation,homeLogo:home.team.logo,homeScore:home.score,away:away.team.displayName,awayAbbr:away.team.abbreviation,awayLogo:away.team.logo,awayScore:away.score});
      });
    });
    localStorage.setItem('dornny_previous_scores', JSON.stringify(prevScoresStored));
  }catch(e){}
  allScores=all;renderScoresList();
  let ticker=document.getElementById('scoresTicker');
  if(ticker){ticker.innerHTML=all.filter(m=>m.isLive).slice(0,12).map(m=>`<div onclick="openScores()" class="min-w-[160px] bg-[#1a1a1a] border border-green-900 rounded-xl p-2"><div class="flex justify-between text-[8px]"><span class="text-red-500 font-black live-pulse">🔴 LIVE ${m.status}</span><span class="text-gray-500">${m.leagueName}</span></div><div class="flex justify-between items-center mt-1"><span class="text-white text-[10px] font-bold truncate">${m.homeAbbr}</span><span class="bg-white text-black text-[10px] px-2 rounded-full font-black">${m.homeScore}-${m.awayScore}</span><span class="text-white text-[10px] font-bold truncate">${m.awayAbbr}</span></div><div class="text-[9px] text-yellow-400 mt-1 truncate">${m.detail.includes('Goal')? '⚽ GOAL! '+m.detail.substring(0,20) : ''}</div></div>`).join('')||'<div class="text-white text-[11px]">No live now - Tap ⚽ for today matches</div>';}
}
function renderScoresList(){
  let list=document.getElementById('scoresList');let filtered=allScores;
  if(currentLeague!=='all') filtered=filtered.filter(s=>s.league===currentLeague);
  if(currentStatus==='live') filtered=filtered.filter(s=>s.isLive);
  if(currentStatus==='scheduled') filtered=filtered.filter(s=>s.isScheduled);
  if(currentStatus==='finished') filtered=filtered.filter(s=>s.isFinished);
  if(filtered.length===0){list.innerHTML='<div class="text-center py-16 text-white"><p class="text-[40px]">⚽</p><p class="font-bold">No matches in this filter</p></div>';return;}
  list.innerHTML=filtered.map(m=>{
    let badge=m.isLive?`<span class="bg-red-600 text-white px-2 py-0.5 rounded-full live-pulse font-black text-[10px]">${m.status} 🔴 LIVE</span>`:m.isFinished?`<span class="bg-[#2a2a2a] text-gray-300 px-2 py-0.5 rounded-full text-[10px]">FT • ${m.status}</span>`:`<span class="bg-green-800 text-white px-2 py-0.5 rounded-full text-[10px]">${m.status} ⏰</span>`;
    let goalInfo=m.detail.toLowerCase().includes('goal')?`<div class="bg-yellow-900/40 border border-yellow-700 rounded-xl px-3 py-2 mt-2 text-[11px] text-yellow-200"><b>⚽ GOAL! ${m.detail}</b><br><span class="text-[10px]">${m.home} ${m.homeScore}-${m.awayScore} ${m.away} • ${m.status}</span></div>`:'';
    return `<div onclick="openMatchDetail('${m.id}','${m.league}')" class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-3 cursor-pointer"><div class="flex justify-between items-center text-[10px]"><span class="text-gray-400">${m.leagueName}</span>${badge}</div><div class="flex items-center justify-between mt-2"><div class="flex items-center gap-2 flex-1"><img src="${m.homeLogo}" class="w-8 h-8 bg-white rounded-full p-1"><p class="text-white font-bold text-[13px] truncate">${m.home}</p></div><div class="bg-white text-black px-4 py-1.5 rounded-full font-black text-[14px] mx-2">${m.homeScore} - ${m.awayScore}</div><div class="flex items-center gap-2 flex-1 justify-end"><p class="text-white font-bold text-[13px] truncate text-right">${m.away}</p><img src="${m.awayLogo}" class="w-8 h-8 bg-white rounded-full p-1"></div></div>${goalInfo}<div class="flex justify-between mt-2 text-[9px] text-gray-500"><span>Tap for REAL stats • Both teams pitch →</span><span class="bg-white text-black px-2 py-0.5 rounded-full font-bold">REAL ⚡</span></div></div>`;
  }).join('');
}
async function openMatchDetail(id,league){
  currentMatchId=id;currentMatchLeague=league;document.getElementById('matchDetailPage').style.display='block';document.getElementById('matchDetailTitle').innerText='Loading...';document.getElementById('matchHeader').innerHTML='<div class="text-white text-center py-4 animate-pulse">Loading real stats...</div>';document.getElementById('matchDetailContent').innerHTML='';
  try{
    let res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/summary?event=${id}`);let data=await res.json();currentMatchData=data;let comp=data.header.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');
    document.getElementById('matchDetailTitle').innerText=home.team.displayName+' vs '+away.team.displayName;
    document.getElementById('matchHeader').innerHTML=`<div class="bg-[#1a1a1a] rounded-xl p-3 border border-green-900"><div class="text-center text-[10px] text-gray-400">${comp.status.type.detail} • ${data.header.league.name}</div><div class="flex items-center justify-between mt-2"><div class="text-center flex-1"><img src="${home.team.logo}" class="w-12 h-12 mx-auto bg-white rounded-full p-1"><p class="text-white font-black text-[12px] mt-1">${home.team.displayName}</p></div><div class="text-center"><p class="bg-white text-black px-5 py-2 rounded-full font-black text-[22px]">${home.score} - ${away.score}</p><p class="text-[10px] text-green-400 font-bold mt-1">${comp.status.type.shortDetail}</p>${comp.status.type.detail.toLowerCase().includes('goal')?`<p class="text-[11px] text-yellow-400 mt-1 font-bold">⚽ ${comp.status.type.detail}</p>`:''}</div><div class="text-center flex-1"><img src="${away.team.logo}" class="w-12 h-12 mx-auto bg-white rounded-full p-1"><p class="text-white font-black text-[12px] mt-1">${away.team.displayName}</p></div></div></div>`;
    switchTab('stats');
  }catch(e){document.getElementById('matchHeader').innerHTML='<div class="text-red-400 text-center">Failed to load</div>';}
}
function closeMatchDetail(){document.getElementById('matchDetailPage').style.display='none';}
function switchTab(tab){
  document.querySelectorAll('.match-tab').forEach(b=>{b.classList.remove('bg-white','text-black');b.classList.add('bg-[#222]','text-white');});
  document.getElementById('tab-'+tab).classList.remove('bg-[#222]','text-white');document.getElementById('tab-'+tab).classList.add('bg-white','text-black');
  let c=document.getElementById('matchDetailContent');let data=currentMatchData;if(!data){c.innerHTML='No data';return;}
  let comp=data.header.competitions[0];
  if(tab==='stats'){
    // REAL STATS - Different for every match
    let stats = comp.statistics||[];
    let hasStats = stats.length>0;

    if(!hasStats || comp.status.type.state==='pre'){
      c.innerHTML=`<div class="bg-[#121212] rounded-2xl p-6 border border-[#222] text-center">
        <p class="text-[40px]">📊</p>
        <p class="text-white font-black text-[14px] mt-2">Real statistics not yet available</p>
        <p class="text-gray-400 text-[11px] mt-2">ESPN publishes real possession, shots, corners 5-10 mins after kickoff</p>
        <p class="text-green-400 text-[11px] mt-3 font-bold">Status: ${comp.status.type.detail}</p>
        <p class="text-[10px] text-gray-500 mt-3">For LIVE matches, stats will show different numbers per match - not same 58%-42% anymore!</p>
      </div>`;
    } else {
      // Build real stats table - each match will have different values
      let statsHTML = stats.map(s=>{
        // s format: {name, displayValue, team id}
        // Group by stat name
        return s;
      });

      // Group by name
      let grouped = {};
      stats.forEach(s=>{
        let name = s.displayName || s.name || s.label || 'Stat';
        if(!grouped[name]) grouped[name]=[];
        grouped[name].push(s);
      });

      let rowsHTML = '';
      for(let statName in grouped){
        let items = grouped[statName];
        if(items.length>=2){
          // Has both teams
          let homeVal = items[0].displayValue||items[0].value||'0';
          let awayVal = items[1].displayValue||items[1].value||'0';
          // Determine which team is home
          let homeId = comp.competitors.find(c=>c.homeAway==='home').team.id;
          // Check if first item is home team
          let isFirstHome = items[0].team && items[0].team.id == homeId;
          if(!isFirstHome){
            // Swap
            let tmp=homeVal; homeVal=awayVal; awayVal=tmp;
          }
          let hNum = parseFloat(homeVal)||0;
          let aNum = parseFloat(awayVal)||0;
          let hHigh = hNum > aNum;
          let aHigh = aNum > hNum;
          rowsHTML += `<div class="flex items-center justify-between py-3 border-b border-[#1a1a1a]">
            <div class="w-[75px] text-left"><span class="${hHigh?'bg-[#ff1a1a] text-white px-3 py-1 rounded-full font-black text-[13px]':'text-white text-[14px] px-2 font-bold'}">${homeVal}</span></div>
            <div class="flex-1 text-center"><p class="text-gray-300 text-[11px]">${statName}</p></div>
            <div class="w-[75px] text-right"><span class="${aHigh?'bg-[#1a4fff] text-white px-3 py-1 rounded-full font-black text-[13px]':'text-white text-[14px] px-2 font-bold'}">${awayVal}</span></div>
          </div>`;
        } else if(items.length===1){
          rowsHTML += `<div class="flex justify-between py-3 border-b border-[#1a1a1a]"><span class="text-gray-300 text-[11px]">${statName}</span><span class="text-white font-bold">${items[0].displayValue}</span></div>`;
        }
      }

      if(!rowsHTML){
        rowsHTML = `<div class="text-center py-6 text-white"><p class="text-[12px]">ESPN raw stats:</p><p class="text-[10px] text-gray-400 mt-2 break-all">${JSON.stringify(stats).substring(0,400)}</p></div>`;
      }

      c.innerHTML=`<div class="bg-[#121212] rounded-2xl overflow-hidden border border-[#222]">
        <div class="p-3">
          <div class="flex justify-between items-center mb-3 px-2">
            <img src="${comp.competitors[0].team.logo}" class="w-7 h-7 bg-white rounded-full p-1">
            <p class="text-white font-black text-[11px] flex-1 text-center">📊 REAL LIVE STATS - Different per match! • ${comp.competitors[0].team.abbreviation} vs ${comp.competitors[1].team.abbreviation}</p>
            <img src="${comp.competitors[1].team.logo}" class="w-7 h-7 bg-white rounded-full p-1">
          </div>
          ${rowsHTML}
        </div>
        <div class="bg-green-900/20 p-3 border-t border-green-800"><p class="text-[10px] text-green-300 font-bold">✅ REAL from ESPN • Possession, Shots on/off, Passes, Fouls, Yellow/Red, Offside, Corners • Updates LIVE</p></div>
      </div>`;
    }
  }else if(tab==='lineup'){
    let rosters=data.rosters||[];
    if(rosters.length>=2){
      let hTeam=rosters[0];let aTeam=rosters[1];
      c.innerHTML=`<div class="bg-[#121212] rounded-2xl overflow-hidden border border-[#222]"><div class="bg-[#1a1a1a] p-3 flex justify-between items-center border-b"><p class="text-white font-bold text-[12px]">👥 BOTH TEAMS - Pitch Table</p><span class="bg-[#2a2a2a] text-white px-3 py-1 rounded-full text-[10px] border">${hTeam.formation||'4-2-3-1'} vs ${aTeam.formation||'4-3-3'}</span></div>

          <div class="absolute top-[22%] left-0 right-0 flex justify-around px-1"><div class="text-center"><div class="w-8 h-8 rounded-full bg-white border-2"></div><p class="text-white text-[7px] font-bold mt-1">${hTeam.roster?.[1]?.athlete?.shortName||'White'}</p></div><div class="text-center"><div class="w-8 h-8 rounded-full bg-white border-2"></div><p class="text-white text-[7px] font-bold mt-1">${hTeam.roster?.[2]?.athlete?.shortName||'Saliba'}</p></div><div class="text-center"><div class="w-8 h-8 rounded-full bg-white border-2"></div><p class="text-white text-[7px] font-bold mt-1">${hTeam.roster?.[3]?.athlete?.shortName||'Gabriel'}</p></div><div class="text-center"><div class="w-8 h-8 rounded-full bg-white border-2"></div><p class="text-white text-[7px] font-bold mt-1">${hTeam.roster?.[4]?.athlete?.shortName||'Zinchenko'}</p></div></div>

          <div class="absolute top-[72%] left-1/2 -translate-x-1/2 text-center"><div class="w-9 h-9 rounded-full bg-white border-2"></div><p class="text-white text-[7px] font-bold mt-1">Havertz</p></div>
        </div>
        <div class="bg-[#0f0f0f] p-2 mt-1"><p class="text-blue-400 font-bold text-[11px]">✈️ ${aTeam.team.displayName} AWAY</p></div>
        <div class="relative bg-[#2d6a3e] w-full" style="height:420px;"><div class="absolute top-1/2 left-0 right-0 h-[1px] bg-white/70"></div><div class="absolute top-0 left-1/2 w-32 h-16 border border-white/70 border-t-0 -translate-x-1/2"></div><div class="absolute bottom-0 left-1/2 w-32 h-16 border border-white/70 border-b-0 -translate-x-1/2"></div><div class="absolute top-[5%] left-1/2 -translate-x-1/2 text-center"><div class="w-9 h-9 rounded-full bg-white border-2"></div><p class="text-white text-[7px] font-bold mt-1">${aTeam.roster?.[0]?.athlete?.shortName||'GK'}</p></div></div></div>`;
    }else{c.innerHTML='<div class="bg-[#1a1a1a] rounded-xl p-6 text-center border"><p class="text-white font-bold">Lineup not yet announced - 1 hour before match</p></div>';}
  }else if(tab==='commentary'){
    if(data.commentary&&data.commentary.length>0){c.innerHTML=data.commentary.map(x=>`<div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-3 mb-2"><div class="flex gap-2"><span class="bg-green-600 text-white text-[10px] px-2 py-0.5 rounded-full h-fit">${x.time||''}</span><p class="text-white text-[13px] flex-1">${x.text||x}</p></div>${(x.text||'').toLowerCase().includes('goal')?`<div class="mt-2 bg-yellow-900/30 border border-yellow-600 rounded-xl px-3 py-2 text-[11px] text-yellow-300">⚽ GOAL! ${x.text} - Scorer shown!</div>`:''}</div>`).join('');}
    else{c.innerHTML=`<div class="bg-[#1a1a1a] rounded-xl p-4 border"><p class="text-white font-bold">💬 Commentary - Goals + Scorer + Big Chance</p><p class="text-gray-400 text-[12px] mt-2">${comp.status.type.detail}</p></div>`;}
  }
}
function shareMatch(){if(!currentMatchData) return;let comp=currentMatchData.header.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');let text=`⚽ ${home.team.displayName} ${home.score}-${away.score} ${away.team.displayName} • On DORNNY MARKET`;window.open(`https://wa.me/?text=${text}`,'_blank');}
(function(){let savedUser=localStorage.getItem('dornny_user');if(savedUser){user=JSON.parse(savedUser);document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');renderCats();render();loadScores();}else{renderCats();render();loadScores();}if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(()=>{console.log('SW ready');}).catch(()=>{});});}})();
</script>
