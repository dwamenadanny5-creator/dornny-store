<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DORNNY - Ghana's Super App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
#prodSwiperWrapper{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
#prodSwiperWrapper::-webkit-scrollbar{ display:none; }
#prodSwiperWrapper div{ scroll-snap-align:center; }
.zoomed{ transform:scale(2); transition:transform 0.3s; }
</style>
</head>
<body class="bg-gray-50 pb-20">

<!-- HEADER -->
<header class="bg-black text-white p-3 sticky top-0 z-50 flex justify-between items-center">
<div class="font-black text-xl tracking-widest">DORNNY</div>
<div class="flex gap-3">
<button onclick="goLive()" class="bg-red-600 px-3 py-1 rounded-full text-sm"><i class="fa-solid fa-video"></i> LIVE</button>
<button onclick="openAddModal()" class="bg-white text-black px-3 py-1 rounded-full text-sm"><i class="fa-solid fa-plus"></i> Sell</button>
<button onclick="openCart()" class="relative"><i class="fa-solid fa-bag-shopping text-xl"></i><span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span></button>
</div>
</header>

<!-- CATEGORIES -->
<div class="p-3 flex gap-2 overflow-x-auto">
<button onclick="filterCat('All')" class="bg-black text-white px-4 py-1.5 rounded-full text-sm whitespace-nowrap">All</button>
<button onclick="filterCat('Fashion')" class="bg-white border px-4 py-1.5 rounded-full text-sm whitespace-nowrap">Fashion</button>
<button onclick="filterCat('Electronics')" class="bg-white border px-4 py-1.5 rounded-full text-sm whitespace-nowrap">Electronics</button>
<button onclick="filterCat('Shoes')" class="bg-white border px-4 py-1.5 rounded-full text-sm whitespace-nowrap">Shoes</button>
</div>

<!-- PRODUCTS GRID -->
<div id="productGrid" class="grid grid-cols-2 gap-3 p-3"></div>

<!-- PRODUCT MODAL WITH SLIDER + PINCH ZOOM -->
<div id="productModal" class="fixed inset-0 bg-white z-[60] hidden overflow-y-auto">
<div class="sticky top-0 bg-white p-2 flex justify-between items-center border-b">
<button onclick="closeProduct()" class="w-8 h-8 bg-gray-100 rounded-full"><i class="fa-solid fa-xmark"></i></button>
<span class="text-xs text-gray-500">Swipe ↔️ Pinch to zoom 🔍</span>
</div>

<!-- SWIPER -->
<div id="prodSwiperWrapper" class="w-full" style="height:50vh; background:#f3f4f6;"></div>
<div id="dots" class="flex justify-center gap-1 py-2"></div>

<div id="productDetail" class="p-4"></div>
</div>

<!-- ADD PRODUCT MODAL -->
<div id="addModal" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-end">
<div class="bg-white w-full rounded-t-3xl p-5">
<h3 class="font-black text-lg mb-3">Add New Product</h3>
<input id="newName" placeholder="Product Name" class="w-full border p-3 rounded-xl mb-2">
<input id="newPrice" type="number" placeholder="Price GH₵" class="w-full border p-3 rounded-xl mb-2">
<input id="newImg" placeholder="Image URL (https://...)" class="w-full border p-3 rounded-xl mb-2">
<input id="newImgs" placeholder="Extra Images URLs (comma separated)" class="w-full border p-3 rounded-xl mb-2">
<select id="newCat" class="w-full border p-3 rounded-xl mb-3"><option>Fashion</option><option>Electronics</option><option>Shoes</option></select>
<button onclick="addProduct()" class="w-full bg-black text-white p-3 rounded-full font-bold">Add Product</button>
<button onclick="closeAddModal()" class="w-full mt-2 text-gray-500">Cancel</button>
<p class="text-[10px] text-center text-gray-400 mt-2">Product will save on this phone + all phones after you commit. It will NEVER disappear.</p>
</div>
</div>

<!-- CART -->
<div id="cartModal" class="fixed inset-0 bg-white z-[80] hidden p-4">
<div class="flex justify-between items-center mb-4"><h2 class="font-black text-xl">Cart</h2><button onclick="closeCart()" class="w-8 h-8 bg-gray-100 rounded-full"><i class="fa-solid fa-xmark"></i></button></div>
<div id="cartItems"></div>
</div>

<script>
// === PRODUCTS WITH PERSISTENCE (NEVER DISAPPEAR) ===
const defaultProducts = [
{id:1, name:"Air Max Sneakers", price:350, img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", imgs:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500","https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500"], cat:"Shoes", seller:"Danny"},
{id:2, name:"iPhone 14 Pro", price:8500, img:"https://images.unsplash.com/photo-1678911820864-e2c567c655d7?w=500", imgs:["https://images.unsplash.com/photo-1678911820864-e2c567c655d7?w=500"], cat:"Electronics", seller:"Kwasi"},
{id:3, name:"Designer Jacket", price:250, img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500", cat:"Fashion", seller:"Danny"}
];
let products = JSON.parse(localStorage.getItem('dornny_products') || 'null') || defaultProducts;

let currentCat = 'All';
let cart = JSON.parse(localStorage.getItem('dornny_cart') || '[]');

function saveProducts(){ localStorage.setItem('dornny_products', JSON.stringify(products)); }
function saveCart(){ localStorage.setItem('dornny_cart', JSON.stringify(cart)); document.getElementById('cartCount').innerText = cart.length; }

function renderProducts(){
const grid = document.getElementById('productGrid');
const filtered = currentCat==='All'? products : products.filter(p=>p.cat===currentCat);
grid.innerHTML = filtered.map(p=>`
<div onclick="openProduct(${p.id})" class="bg-white rounded-2xl overflow-hidden shadow-sm">
<img src="${p.img}" class="w-full h-40 object-cover">
<div class="p-2"><p class="font-bold text-sm truncate">${p.name}</p><p class="text-xs text-gray-500">${p.cat}</p><p class="font-black mt-1">GH₵ ${p.price}</p></div>
</div>`).join('');
saveCart();
}
function filterCat(c){ currentCat=c; renderProducts(); }

// === PRODUCT MODAL WITH SLIDER + PINCH ZOOM ===
let startX=0, currentTranslate=0;
function openProduct(id){
const p=products.find(x=>x.id==id);
if(!p) return;
const imgs=p.imgs&&p.imgs.length?p.imgs:[p.img];
document.getElementById('prodSwiperWrapper').innerHTML=imgs.map(img=>`<div style="min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-shrink:0"><img src="${img}" class="prod-img" style="width:100%;height:100%;object-fit:contain;transition:transform 0.3s" onclick="this.classList.toggle('zoomed')"></div>`).join('');
document.getElementById('dots').innerHTML=imgs.map((_,i)=>`<div class="w-1.5 h-1.5 bg-gray-300 rounded-full"></div>`).join('');
document.getElementById('productModal').style.display='block';
document.getElementById('productDetail').innerHTML=`<div class="flex justify-between items-start"><div><h2 class="font-black text-lg">${p.name}</h2><p class="text-xs text-gray-500">${p.cat} • Sold by ${p.seller}</p></div></div><div class="flex items-center gap-2 mt-2"><span class="text-2xl font-black">GH₵ ${p.price}</span><span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">In Stock</span></div><p class="text-xs text-gray-400 mt-2">Swipe image left/right • Tap image to zoom • Pinch to zoom</p><div class="flex gap-2 mt-4"><button onclick="addToCart(${p.id})" class="flex-1 bg-black text-white px-4 py-3 rounded-full text-sm font-bold">Add to Cart</button><button class="border px-4 py-3 rounded-full text-sm"><i class="fa-regular fa-heart"></i></button><button class="border px-4 py-3 rounded-full text-sm"><i class="fab fa-whatsapp text-green-500"></i></button></div>`;
}
function closeProduct(){ document.getElementById('productModal').style.display='none'; }

// === ADD PRODUCT (NEVER DISAPPEAR) ===
function openAddModal(){ document.getElementById('addModal').style.display='flex'; }
function closeAddModal(){ document.getElementById('addModal').style.display='none'; }
function addProduct(){
const name=document.getElementById('newName').value;
const price=parseFloat(document.getElementById('newPrice').value);
const img=document.getElementById('newImg').value;
const imgsRaw=document.getElementById('newImgs').value;
const cat=document.getElementById('newCat').value;
if(!name||!price||!img) return alert('Fill name, price, image');
const extra = imgsRaw? imgsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
const newP = {id:Date.now(), name, price, img, imgs:[img,...extra], cat, seller:"You"};
products.unshift(newP);
saveProducts();
renderProducts();
closeAddModal();
alert('Product added! It will NOT disappear again. For ALL phones to see it, also add it to defaultProducts in code and commit.');
document.getElementById('newName').value=''; document.getElementById('newPrice').value=''; document.getElementById('newImg').value=''; document.getElementById('newImgs').value='';
}

// === CART ===
function addToCart(id){ cart.push(products.find(p=>p.id==id)); saveCart(); alert('Added to cart'); }
function openCart(){ document.getElementById('cartModal').style.display='block'; document.getElementById('cartItems').innerHTML = cart.map(c=>`<div class="flex gap-3 border-b py-3"><img src="${c.img}" class="w-16 h-16 object-cover rounded-xl"><div><p class="font-bold text-sm">${c.name}</p><p class="text-sm">GH₵ ${c.price}</p></div></div>`).join('') || '<p class="text-center text-gray-400 mt-10">Cart empty</p>'; }
function closeCart(){ document.getElementById('cartModal').style.display='none'; }

// === LIVE - ANY PHONE CAN JOIN ===
function goLive(){
const room = prompt("Enter Live Room Name (share this name with friends):", "DORNNY-LIVE-"+Math.floor(Math.random()*1000));
if(!room) return;
const url = "https://meet.jit.si/" + room.replace(/\s+/g,'-');
window.open(url, "_blank");
alert("LIVE started! Share this link with friends: "+url+" - Any phone can join!");
}

renderProducts();
</script>
</body>
</html>
