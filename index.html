<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY - 100% Real Stats</title><link rel="manifest" href="manifest.json"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><style>body{font-family:system-ui;background:#f5f5f5;padding-bottom:80px}.hide::-webkit-scrollbar{display:none}.cat-active{background:#111!important;color:#fff!important}.bottom-active{color:#f68b1e!important}@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}.live-pulse{animation:pulse 1.5s infinite}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:22px;font-size:12px;z-index:999999;display:none}</style></head><body><div id="toast" class="toast"></div>
<div class="bg-[#111] text-white text-center py-2"><p class="font-black text-[13px]">DORNNY MARKET 🇬🇭 100% REAL STATS</p></div>
<div id="loginScreen" class="min-h-[85vh] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-2xl p-6"><h2 class="font-black text-center">DORNNY MARKET</h2><input id="emailPhone" placeholder="Email or Phone *" class="w-full border rounded-full px-4 py-3 text-[13px] mt-5"><input id="password" type="password" placeholder="Password *" class="w-full border rounded-full px-4 py-3 text-[13px] mt-2"><button onclick="doLogin()" class="w-full bg-black text-white py-3 rounded-full font-bold mt-4">LOGIN</button></div></div>
<div id="mainApp" class="hidden"><div class="sticky top-0 z-30 bg-white p-2.5 flex gap-2 items-center border-b"><div class="font-black text-[13px]">DORNNY</div><div class="flex-1 bg-[#f2f2f2] rounded-full h-[38px] flex items-center px-4"><i class="fa-solid fa-search text-[12px]"></i><input id="search" oninput="render()" placeholder="Search..." class="bg-transparent ml-2 w-full text-[13px] outline-none"></div><button onclick="openScores()" class="bg-green-600 text-white w-10 h-10 rounded-full font-black">⚽</button></div><div class="bg-black p-2 flex gap-2 overflow-x-auto hide" id="scoresTicker"></div><div class="bg-white p-2 border-b sticky top-[52px] z-20"><div id="catList" class="flex gap-2 overflow-x-auto hide pb-1"></div></div><div id="grid" class="p-2 grid grid-cols-2 gap-2"></div></div>
<div id="scoresPage" class="fixed inset-0 bg-[#0a0a0a] z-[50] hidden overflow-y-auto pb-[90px]"><div class="bg-gradient-to-r from-green-800 to-black p-3 sticky top-0 z-20"><div class="flex items-center gap-2"><button onclick="closeScores()" class="w-9 h-9 bg-white/20 text-white rounded-full font-bold">←</button><div class="flex-1"><p class="font-black text-white text-[14px]">⚽ DORNNY LIVE SCORE - 100% REAL</p><p class="text-[10px] text-green-300">Same as Google: Shots, Possession, Passes from ESPN</p></div><button onclick="enableNotif()" class="bg-green-500 text-white px-3 py-1.5 rounded-full text-[10px] font-bold">🔔 Enable</button></div><div class="flex gap-2 mt-3 overflow-x-auto hide"><button onclick="filterStatus('all')" id="status-all" class="status-tab bg-white text-black px-4 py-1.5 rounded-full text-[11px] font-black">ALL</button><button onclick="filterStatus('live')" id="status-live" class="status-tab bg-red-600 text-white px-4 py-1.5 rounded-full text-[11px] font-bold live-pulse">🔴 LIVE</button><button onclick="filterStatus('scheduled')" id="status-scheduled" class="status-tab bg-[#222] text-white px-4 py-1.5 rounded-full text-[11px] font-bold border">⏰ Upcoming</button><button onclick="filterStatus('finished')" id="status-finished" class="status-tab bg-[#222] text-white px-4 py-1.5 rounded-full text-[11px] font-bold border">✅ Finished</button></div></div><div class="bg-black p-2 flex gap-2 overflow-x-auto hide sticky top-[84px] z-10"><button onclick="filterLeague('all')" id="league-all" class="league-tab bg-white text-black px-3 py-1 rounded-full text-[10px] font-black">ALL</button><button onclick="filterLeague('eng.1')" id="league-eng.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">EPL</button><button onclick="filterLeague('esp.1')" id="league-esp.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">LaLiga</button><button onclick="filterLeague('uefa.champions')" id="league-uefa.champions" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">UCL</button><button onclick="filterLeague('mex.1')" id="league-mex.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Liga MX</button><button onclick="filterLeague('bra.1')" id="league-bra.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Brazil</button></div><div id="scoresList" class="p-2 space-y-2"></div></div>
<div id="matchDetailPage" class="fixed inset-0 bg-[#0f0f0f] z-[60] hidden overflow-y-auto pb-[90px]"><div class="bg-black p-3 sticky top-0 z-20"><div class="flex items-center gap-3"><button onclick="closeMatchDetail()" class="w-9 h-9 bg-white/20 text-white rounded-full font-bold">←</button><p class="font-black text-white text-[14px] flex-1" id="matchDetailTitle">Match</p><button onclick="shareMatch()" class="bg-white text-black px-3 py-1.5 rounded-full text-[10px] font-bold">Share</button></div><div id="matchHeader" class="mt-3"></div><div class="flex gap-2 mt-3 overflow-x-auto hide"><button onclick="switchTab('stats')" id="tab-stats" class="match-tab bg-white text-black px-4 py-2 rounded-full text-[11px] font-black">📊 Key Stats - REAL</button><button onclick="switchTab('lineup')" id="tab-lineup" class="match-tab bg-[#222] text-white px-4 py-2 rounded-full text-[11px] font-bold border">👥 Lineup</button><button onclick="switchTab('commentary')" id="tab-commentary" class="match-tab bg-[#222] text-white px-4 py-2 rounded-full text-[11px] font-bold border">💬 Commentary</button></div></div><div id="matchDetailContent" class="p-3"></div></div>
<div id="mePage" class="fixed inset-0 bg-[#f2f2f2] z-[30] hidden overflow-y-auto pb-[90px]"><div class="bg-white p-3 flex gap-2 items-center border-b"><button onclick="navHome()" class="w-8 h-8 bg-gray-100 rounded-full">←</button><p class="font-black">Me</p></div><div class="bg-white p-4 mt-2 flex gap-4 items-center"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-[60px] h-[60px] rounded-full border-2 border-black"><div><p class="font-black text-[16px]" id="meShop">shop</p><p class="text-[12px] text-[#f68b1e] font-bold" id="meEmail">email</p></div></div><div class="bg-white mt-2"><button onclick="openScores()" class="w-full flex items-center gap-4 p-4 border-b bg-green-50"><div class="w-8 h-8 bg-green-600 text-white rounded-full flex items-center justify-center font-bold">⚽</div><span class="flex-1 text-left font-bold text-[13px]">Live Scores - 100% Real Like Google</span><span class="bg-green-600 text-white text-[9px] px-2 py-1 rounded-full">REAL</span></button></div></div>
<div id="categoryPage" class="fixed inset-0 bg-[#f5f5f5] z-[40] hidden overflow-y-auto pb-[90px]"><div class="bg-white p-3 flex items-center gap-3 border-b"><button onclick="closeCategory()" class="w-8 h-8 bg-gray-100 rounded-full">←</button><p class="font-black">Categories</p></div><div id="categoryGrid" class="p-3 grid grid-cols-2 gap-3"></div></div>
<div id="detail" class="fixed inset-0 bg-[#f5f5f5] z-[40] hidden overflow-y-auto pb-[120px]"><div class="bg-white min-h-screen"><div class="relative"><div class="swiper" id="detailSwiper" style="height:420px"><div class="swiper-wrapper" id="detailImgs"></div><div class="swiper-pagination"></div></div><button onclick="closeDetail()" class="absolute top-3 left-3 w-10 h-10 bg-white/80 rounded-full z-20 font-bold">✕</button></div><div class="bg-white p-3"><span id="dPrice" class="font-black text-[22px] text-[#ff3e3e]"></span><p id="dTitleFull" class="text-[13px] font-bold mt-2"></p></div><div class="fixed bottom-[75px] left-0 right-0 bg-white border-t-2 border-black p-2 flex gap-2 z-[60]"><button onclick="addCart()" class="flex-1 bg-black text-white py-3.5 rounded-full font-black">Add to Cart</button></div></div></div>
<div id="cartDrawer" class="fixed inset-0 bg-black/50 z-[40] hidden flex justify-end"><div class="bg-white w-[95%] max-w-sm h-full flex flex-col"><div class="p-4 border-b flex justify-between"><b>Cart</b><button onclick="closeCart()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="cartItems" class="p-3"></div><div class="p-4 border-t"><div class="flex justify-between font-black text-[18px]"><span>Total</span><span id="totalPay">GH₵0</span></div><button onclick="checkout()" id="payBtn" class="w-full bg-black text-white py-4 rounded-full font-black mt-2">PAY NOW</button></div></div></div>
<div id="videosPage" class="fixed inset-0 bg-black z-[40] hidden overflow-y-auto pb-[90px]"><div class="p-4 flex gap-3 items-center sticky top-0 bg-black text-white z-20"><button onclick="closeVideos()" class="w-8 h-8 bg-white/20 rounded-full">←</button><b>📹 Live</b></div><div id="videosPastList" class="p-3 grid grid-cols-1 gap-3"></div></div>
<div id="welcomeScreen" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-center justify-center p-4"><div class="bg-white rounded-[24px] w-full max-w-sm p-6 text-center"><h2 class="font-black text-[20px]">Order Paid! ✅</h2><p class="text-[11px] mt-2"><span id="orderId"></span></p><button onclick="continueShop()" class="w-full mt-5 bg-black text-white py-3.5 rounded-full font-bold">Continue</button></div></div>
<div id="notificationPage" class="fixed inset-0 bg-[#f5f5f5] z-[40] hidden overflow-y-auto pb-[90px]"><div class="bg-white p-3 flex items-center gap-3 border-b"><button onclick="closeNotificationPage()" class="w-8 h-8 bg-gray-100 rounded-full">←</button><p class="font-black">Notifications</p></div><div id="notificationList" class="p-2 space-y-2"></div></div>
<nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-[100]"><button onclick="navHome()" id="navHome" class="flex flex-col items-center bottom-active"><i class="fa-solid fa-house text-[18px]"></i><span class="text-[9px] font-bold mt-1">Home</span></button><button onclick="openCategoryPage()" id="navCategory" class="flex flex-col items-center text-gray-500"><i class="fa-solid fa-table-cells-large text-[18px]"></i><span class="text-[9px] mt-1">Category</span></button><button onclick="openLiveVideo()" id="navLive" class="flex flex-col items-center text-gray-500"><div class="bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-video text-[12px]"></i></div><span class="text-[9px] font-bold mt-1">Live Video</span></button><button onclick="openCart()" id="navCart" class="flex flex-col items-center text-gray-500 relative"><i class="fa-solid fa-cart-shopping text-[18px]"></i><span id="cartCount" class="absolute -top-1 -right-1 bg-[#f68b1e] text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center">0</span><span class="text-[9px] mt-1">Cart</span></button><button onclick="openMe()" id="navMe" class="flex flex-col items-center text-gray-500 relative"><i class="fa-solid fa-user text-[18px]"></i><span class="text-[9px] mt-1">Me</span></button></nav>
<script>
let categories=["All","Men","Women","Kids","Sneaker","Pet","Toys","Furnitures","Office","Jewelry & Accs","Slippers","Cars","Food & Drinks","Home Decors","Phone & Accs","Second hands","Cosmetics","Bags","Appliances","Sport","Electronics"];
let defaultProducts=[{id:1001,name:"Coolane Women's Summer Wide Leg Pants - Pink",price:53.07,cat:"Women",imgs:["https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=600"]}];
let storedProducts=JSON.parse(localStorage.getItem('dornny_products_v2')||'null');let products=storedProducts&&storedProducts.length>0?storedProducts:defaultProducts;
let user=null,cart=[],currentCat="All",detailSwiper=null,allScores=[],currentLeague='all',currentStatus='all',scoresInterval=null,currentMatchData=null;
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function enableNotif(){if(!('Notification' in window))return;Notification.requestPermission().then(p=>{if(p==='granted'){toast('✅ Notifications ON');localStorage.setItem('dornny_notif_enabled','1');}});}
function phoneNotif(title,body,matchId){if(Notification.permission!=='granted')return;let notified=JSON.parse(localStorage.getItem('dornny_notified_matches')||'{}');let key=matchId+'|'+title;if(notified[key])return;notified[key]=Date.now();localStorage.setItem('dornny_notified_matches',JSON.stringify(notified));if('serviceWorker' in navigator){navigator.serviceWorker.ready.then(reg=>{reg.showNotification(title,{body:body,icon:'icon-192.png',tag:matchId});});}}
function doLogin(){let loginInput=document.getElementById('emailPhone').value.trim();let pass=document.getElementById('password').value.trim();if(!loginInput||pass.length<4){toast('Enter login');return;}user={shop:loginInput.split('@')[0]+' shop',email:loginInput};localStorage.setItem('dornny_user',JSON.stringify(user));document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');renderCats();render();loadScores();}
function renderCats(){document.getElementById('catList').innerHTML=categories.map(c=>`<button onclick="setCat('${c}')" class="px-4 py-2 rounded-full text-[11px] border whitespace-nowrap font-bold ${currentCat===c?'cat-active':'bg-[#f2f2f2]'}">${c}</button>`).join('');}
function setCat(c){currentCat=c;renderCats();render();}
function render(){let s=document.getElementById('search').value.trim().toLowerCase();let f=currentCat==='All'?products:products.filter(p=>p.cat===currentCat);if(s)f=f.filter(p=>p.name.toLowerCase().includes(s));document.getElementById('grid').innerHTML=f.map(p=>`<div class="bg-white rounded-xl overflow-hidden border"><div onclick="openDetail(${p.id})" class="relative"><img src="${p.imgs[0]}" class="w-full h-[180px] object-cover"></div><div class="p-2"><p class="text-[11px] font-bold truncate">${p.name}</p><p class="font-black text-[14px] text-[#ff3e3e]">GH₵${p.price||53}</p></div></div>`).join('');document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div class="flex gap-3 border-b pb-3"><img src="${c.imgs[0]}" class="w-16 h-16 rounded"><div class="flex-1"><p class="font-bold text-[12px]">${c.name}</p><button onclick="removeCart(${i})" class="bg-red-100 text-red-600 px-2 py-1 rounded-full text-[10px]">Remove</button></div></div>`).join('')||'<p class="text-center py-10">Empty</p>';let total=0;cart.forEach(c=>total+=Number(c.price||0));document.getElementById('totalPay').innerText='GH₵'+total;}
function removeCart(i){cart.splice(i,1);render();}
function setBottomActive(t){document.querySelectorAll('#bottomNav button').forEach(b=>{b.classList.remove('bottom-active');b.classList.add('text-gray-500');});let m={home:'navHome',category:'navCategory',live:'navLive',cart:'navCart',me:'navMe'};if(m[t]){document.getElementById(m[t]).classList.add('bottom-active');document.getElementById(m[t]).classList.remove('text-gray-500');}}
function navHome(){closeAllPages();render();setBottomActive('home');}
function openCategoryPage(){document.getElementById('categoryPage').style.display='block';document.getElementById('categoryGrid').innerHTML=categories.filter(c=>c!=='All').map(c=>`<div onclick="setCat('${c}');closeCategory()" class="bg-white rounded-xl overflow-hidden border"><img src="${products.find(p=>p.cat===c)?.imgs[0]||'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300'}" class="w-full h-[100px] object-cover"><div class="p-2"><p class="font-bold text-[12px]">${c}</p></div></div>`).join('');setBottomActive('category');}
function closeCategory(){document.getElementById('categoryPage').style.display='none';setBottomActive('home');}
function closeAllPages(){if(scoresInterval){clearInterval(scoresInterval);scoresInterval=null;}let tb=document.getElementById('turboBadge');if(tb)tb.remove();document.getElementById('mePage').style.display='none';document.getElementById('videosPage').style.display='none';document.getElementById('categoryPage').style.display='none';document.getElementById('cartDrawer').style.display='none';document.getElementById('detail').style.display='none';document.getElementById('notificationPage').style.display='none';document.getElementById('scoresPage').style.display='none';document.getElementById('matchDetailPage').style.display='none';document.getElementById('bottomNav').style.display='flex';}
function openDetail(id){let p=products.find(x=>x.id===id);if(!p)return;document.getElementById('dPrice').innerText='GH₵'+(p.price||53);document.getElementById('dTitleFull').innerText=p.name;document.getElementById('detailImgs').innerHTML=p.imgs.map(im=>`<div class="swiper-slide"><img src="${im}" class="w-full h-full object-cover"></div>`).join('');document.getElementById('detail').style.display='block';setTimeout(()=>{if(detailSwiper)detailSwiper.destroy();detailSwiper=new Swiper('#detailSwiper',{loop:true,pagination:{el:'.swiper-pagination'}});},100);}
function closeDetail(){document.getElementById('detail').style.display='none';}
function addCart(){cart.push(products[0]);render();openCart();}
function openCart(){document.getElementById('cartDrawer').style.display='flex';render();setBottomActive('cart');}function closeCart(){document.getElementById('cartDrawer').style.display='none';setBottomActive('home');}
function openMe(){closeAllPages();document.getElementById('mePage').style.display='block';document.getElementById('meShop').innerText=user?user.shop:'shop';document.getElementById('meEmail').innerText=user?user.email:'';setBottomActive('me');}
function openNotificationPage(){document.getElementById('notificationPage').style.display='block';}function closeNotificationPage(){document.getElementById('notificationPage').style.display='none';}
function openLiveVideo(){closeAllPages();document.getElementById('videosPage').style.display='block';setBottomActive('live');}
function closeVideos(){document.getElementById('videosPage').style.display='none';setBottomActive('home');}
function checkout(){let orderId='DM-'+Math.floor(100000+Math.random()*900000);document.getElementById('orderId').innerText=orderId;document.getElementById('welcomeScreen').style.display='flex';cart=[];render();}
function continueShop(){document.getElementById('welcomeScreen').style.display='none';closeCart();navHome();}
function openScores(){closeAllPages();document.getElementById('scoresPage').style.display='block';document.getElementById('bottomNav').style.display='none';loadScores();if(scoresInterval)clearInterval(scoresInterval);scoresInterval=setInterval(loadScores,5000);let tb=document.createElement('div');tb.id='turboBadge';tb.className='fixed top-[70px] right-3 bg-green-600 text-white px-3 py-1 rounded-full text-[10px] font-black z-[55]';tb.innerText='⚡ REAL STATS - LIKE GOOGLE';document.body.appendChild(tb);}
function closeScores(){document.getElementById('scoresPage').style.display='none';document.getElementById('bottomNav').style.display='flex';if(scoresInterval){clearInterval(scoresInterval);scoresInterval=null;}let tb=document.getElementById('turboBadge');if(tb)tb.remove();}
function filterLeague(l){currentLeague=l;document.querySelectorAll('.league-tab').forEach(b=>{b.classList.remove('bg-white','text-black');b.classList.add('bg-[#222]','text-white');});document.getElementById('league-'+l).classList.remove('bg-[#222]','text-white');document.getElementById('league-'+l).classList.add('bg-white','text-black');renderScoresList();}
function filterStatus(s){currentStatus=s;document.querySelectorAll('.status-tab').forEach(b=>{b.classList.remove('bg-white','text-black');b.classList.add('bg-[#222]','text-white');});document.getElementById('status-'+s).classList.remove('bg-[#222]','text-white');document.getElementById('status-'+s).classList.add('bg-white','text-black');renderScoresList();}
async function loadScores(){
  let leagues=['eng.1','esp.1','uefa.champions','ita.1','ger.1','fra.1','mex.1','bra.1','usa.1','ksa.1'];
  let all=[];
  try{
    let results=await Promise.all(leagues.map(l=>fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${l}/scoreboard`).then(r=>r.json()).then(d=>({league:l,data:d})).catch(()=>null)));
    let prevScoresStored = JSON.parse(localStorage.getItem('dornny_previous_scores')||'{}');
    results.forEach(res=>{
      if(!res||!res.data||!res.data.events) return;
      res.data.events.forEach(ev=>{
        let comp=ev.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');
        let state=comp.status.type.state;let isLive=state==='in';let isFinished=state==='post';let key=ev.id;let currScore=`${home.score}-${away.score}`;let prevScore=prevScoresStored[key];
        if(prevScore && prevScore!==currScore && isLive){phoneNotif(`⚽ GOAL! ${home.team.displayName} ${home.score}-${away.score} ${away.team.displayName}`,`${comp.status.type.detail}`,key);}
        prevScoresStored[key]=currScore;
        all.push({id:ev.id,league:res.league,leagueName:res.data.leagues?res.data.leagues[0].name:res.league,status:comp.status.type.shortDetail,detail:comp.status.type.detail,state,isLive,isFinished,isScheduled:state==='pre',home:home.team.displayName,homeAbbr:home.team.abbreviation,homeLogo:home.team.logo,homeScore:home.score,away:away.team.displayName,awayAbbr:away.team.abbreviation,awayLogo:away.team.logo,awayScore:away.score});
      });
    });
    localStorage.setItem('dornny_previous_scores', JSON.stringify(prevScoresStored));
  }catch(e){}
  allScores=all;renderScoresList();
  let ticker=document.getElementById('scoresTicker');if(ticker){ticker.innerHTML=all.filter(m=>m.isLive).slice(0,10).map(m=>`<div onclick="openScores()" class="min-w-[160px] bg-[#1a1a1a] border border-green-900 rounded-xl p-2"><div class="flex justify-between text-[8px]"><span class="text-red-500 font-black live-pulse">🔴 LIVE ${m.status}</span><span class="text-gray-500">${m.leagueName}</span></div><div class="flex justify-between items-center mt-1"><span class="text-white text-[10px] font-bold truncate">${m.homeAbbr}</span><span class="bg-white text-black text-[10px] px-2 rounded-full font-black">${m.homeScore}-${m.awayScore}</span><span class="text-white text-[10px] font-bold truncate">${m.awayAbbr}</span></div></div>`).join('')||'<div class="text-white text-[11px]">No live now</div>';}
}
function renderScoresList(){
  let list=document.getElementById('scoresList');let filtered=allScores;
  if(currentLeague!=='all') filtered=filtered.filter(s=>s.league===currentLeague);
  if(currentStatus==='live') filtered=filtered.filter(s=>s.isLive);
  if(currentStatus==='scheduled') filtered=filtered.filter(s=>s.isScheduled);
  if(currentStatus==='finished') filtered=filtered.filter(s=>s.isFinished);
  if(filtered.length===0){list.innerHTML='<div class="text-center py-16 text-white"><p class="text-[40px]">⚽</p><p class="font-bold">No matches</p></div>';return;}
  list.innerHTML=filtered.map(m=>{
    let badge=m.isLive?`<span class="bg-red-600 text-white px-2 py-0.5 rounded-full live-pulse font-black text-[10px]">${m.status} 🔴 LIVE</span>`:m.isFinished?`<span class="bg-[#2a2a2a] text-gray-300 px-2 py-0.5 rounded-full text-[10px]">FT • ${m.status}</span>`:`<span class="bg-green-800 text-white px-2 py-0.5 rounded-full text-[10px]">${m.status} ⏰</span>`;
    return `<div onclick="openMatchDetail('${m.id}','${m.league}')" class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-3 cursor-pointer"><div class="flex justify-between items-center text-[10px]"><span class="text-gray-400">${m.leagueName}</span>${badge}</div><div class="flex items-center justify-between mt-2"><div class="flex items-center gap-2 flex-1"><img src="${m.homeLogo}" class="w-8 h-8 bg-white rounded-full p-1"><p class="text-white font-bold text-[13px] truncate">${m.home}</p></div><div class="bg-white text-black px-4 py-1.5 rounded-full font-black text-[14px] mx-2">${m.homeScore} - ${m.awayScore}</div><div class="flex items-center gap-2 flex-1 justify-end"><p class="text-white font-bold text-[13px] truncate text-right">${m.away}</p><img src="${m.awayLogo}" class="w-8 h-8 bg-white rounded-full p-1"></div></div></div>`;
  }).join('');
}
async function openMatchDetail(id,league){
  document.getElementById('matchDetailPage').style.display='block';document.getElementById('matchDetailTitle').innerText='Loading...';document.getElementById('matchHeader').innerHTML='<div class="text-white text-center py-4">Loading real stats...</div>';document.getElementById('matchDetailContent').innerHTML='';
  try{
    let res=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/summary?event=${id}`);let data=await res.json();currentMatchData=data;let comp=data.header.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');
    document.getElementById('matchDetailTitle').innerText=home.team.displayName+' vs '+away.team.displayName;
    document.getElementById('matchHeader').innerHTML=`<div class="bg-[#1a1a1a] rounded-xl p-3 border border-green-900"><div class="text-center text-[10px] text-gray-400">${comp.status.type.detail} • ${data.header.league.name}</div><div class="flex items-center justify-between mt-2"><div class="text-center flex-1"><img src="${home.team.logo}" class="w-12 h-12 mx-auto bg-white rounded-full p-1"><p class="text-white font-black text-[12px] mt-1">${home.team.displayName}</p></div><div class="text-center"><p class="bg-white text-black px-5 py-2 rounded-full font-black text-[22px]">${home.score} - ${away.score}</p><p class="text-[10px] text-green-400 font-bold mt-1">${comp.status.type.shortDetail}</p></div><div class="text-center flex-1"><img src="${away.team.logo}" class="w-12 h-12 mx-auto bg-white rounded-full p-1"><p class="text-white font-black text-[12px] mt-1">${away.team.displayName}</p></div></div></div>`;
    switchTab('stats');
  }catch(e){document.getElementById('matchHeader').innerHTML='<div class="text-red-400 text-center">Failed to load</div>';}
}
function closeMatchDetail(){document.getElementById('matchDetailPage').style.display='none';}
function switchTab(tab){
  document.querySelectorAll('.match-tab').forEach(b=>{b.classList.remove('bg-white','text-black');b.classList.add('bg-[#222]','text-white');});
  document.getElementById('tab-'+tab).classList.remove('bg-[#222]','text-white');document.getElementById('tab-'+tab).classList.add('bg-white','text-black');
  let c=document.getElementById('matchDetailContent');let data=currentMatchData;if(!data){c.innerHTML='No data';return;}
  let comp=data.header.competitions[0];
  if(tab==='stats'){
    // 100% REAL STATS - Parse ALL possible ESPN locations - NO FAKE
    let allStatsRaw=[];
    // Location 1: header.competitions[0].statistics
    if(comp.statistics && comp.statistics.length>0) allStatsRaw = allStatsRaw.concat(comp.statistics);
    // Location 2: boxscore.teams[].statistics[]
    if(data.boxscore && data.boxscore.teams){
      data.boxscore.teams.forEach(team=>{
        if(team.statistics){
          team.statistics.forEach(st=>{
            // st.name like possessionPct, totalShots
            allStatsRaw.push({name: st.name, displayName: st.displayName, displayValue: st.displayValue, teamId: team.team.id, team: team.team});
          });
        }
      });
    }
    // Location 3: data.header.competitions[0].stats (older format)
    if(comp.stats && comp.stats.length>0) allStatsRaw = allStatsRaw.concat(comp.stats);
    // Location 4: data.stats
    if(data.stats && data.stats.length>0) allStatsRaw = allStatsRaw.concat(data.stats);

    if(allStatsRaw.length===0){
      // No stats published yet - DO NOT SHOW FAKE, tell truth like Google does when no stats
      c.innerHTML=`<div class="bg-[#121212] rounded-2xl p-8 border border-[#222] text-center">
        <p class="text-[40px]">📊</p>
        <p class="text-white font-black text-[14px] mt-2">Statistics not yet published</p>
        <p class="text-gray-400 text-[11px] mt-2">ESPN has not released stats for this match yet.<br>For LIVE matches, stats appear after 10-20 minutes.<br>For finished matches, refresh to load.</p>
        <p class="text-green-400 text-[11px] mt-4 font-bold">${comp.status.type.detail} • ${comp.status.type.shortDetail}</p>
        <button onclick="switchTab('stats')" class="mt-4 bg-white text-black px-6 py-2 rounded-full font-bold text-[12px]">🔄 Retry Load Real Stats</button>
      </div>`;
      return;
    }

    // Group by stat name and map to Google-like labels
    let homeTeamId = comp.competitors.find(t=>t.homeAway==='home').team.id;
    let map = {};
    allStatsRaw.forEach(s=>{
      let rawName = (s.name||'').toLowerCase();
      let dispName = (s.displayName||s.name||'').toLowerCase();
      let teamId = s.teamId || (s.team && s.team.id) || null;
      let val = s.displayValue || s.value || s.displayValue===0? s.displayValue : '0';
      // Normalize names to Google style
      let key='';
      if(rawName.includes('possession') || dispName.includes('possession')) key='possession';
      else if(rawName==='totalshots' || rawName.includes('shot') &&!rawName.includes('ontarget') &&!rawName.includes('blocked')) key='shots';
      else if(rawName.includes('shotsontarget') || rawName.includes('ontarget') || rawName==='shotsonTarget') key='shotsOnTarget';
      else if(rawName.includes('blocked')) key='blockedShots';
      else if(rawName.includes('totalpass') || rawName==='passes' || rawName==='totalPasses') key='passes';
      else if(rawName.includes('accuratepass') || rawName.includes('passaccuracy')) key='passAccuracy';
      else if(rawName.includes('pass') && rawName.includes('acc')) key='passAccuracy';
      else if(rawName.includes('foul')) key='fouls';
      else if(rawName.includes('yellow')) key='yellowCards';
      else if(rawName.includes('red')) key='redCards';
      else if(rawName.includes('offside')) key='offsides';
      else if(rawName.includes('corner')) key='corners';
      else if(rawName.includes('tackle')) key='tackles';
      else {
        // Use displayName directly if unknown
        key = dispName || rawName;
      }
      if(!map[key]) map[key]={home:null, away:null, label: s.displayName || s.name};
      // Assign to home/away
      if(teamId){
        if(teamId==homeTeamId) map[key].home=val;
        else map[key].away=val;
      } else {
        // If no teamId, try to distribute by order
        if(map[key].home===null) map[key].home=val;
        else if(map[key].away===null) map[key].away=val;
      }
    });

    // Build ordered rows like Google screenshot: Shots, Shots on target, Possession, Passes, Pass accuracy, Fouls, Yellow, Red, Offsides, Corners
    let order=[
      {k:'shots', label:'Shots'},
      {k:'shotsOnTarget', label:'Shots on target'},
      {k:'possession', label:'Possession'},
      {k:'passes', label:'Passes'},
      {k:'passAccuracy', label:'Pass accuracy'},
      {k:'fouls', label:'Fouls'},
      {k:'yellowCards', label:'Yellow cards'},
      {k:'redCards', label:'Red cards'},
      {k:'offsides', label:'Offsides'},
      {k:'corners', label:'Corners'},
    ];

    let rowsHTML='';
    order.forEach(o=>{
      let m=map[o.k];
      if(!m) return;
      let hv=m.home||'0'; let av=m.away||'0';
      let hNum=parseFloat(hv)||0; let aNum=parseFloat(av)||0;
      let hHigh=hNum>aNum; let aHigh=aNum>hNum;
      // For possession, values have % sign
      rowsHTML+=`<div class="flex items-center justify-between py-3 border-b border-[#1a1a1a] last:border-0">
        <div class="w-[70px] text-left"><span class="${hHigh?'bg-red-600 text-white px-3 py-1 rounded-full font-black text-[13px]':'text-white text-[14px] font-bold px-2'}">${hv}</span></div>
        <div class="flex-1 text-center"><p class="text-gray-300 text-[11px]">${o.label}</p></div>
        <div class="w-[70px] text-right"><span class="${aHigh?'bg-blue-600 text-white px-3 py-1 rounded-full font-black text-[13px]':'text-white text-[14px] font-bold px-2'}">${av}</span></div>
      </div>`;
    });

    // If no ordered rows found, show all raw
    if(!rowsHTML){
      rowsHTML = Object.keys(map).map(k=>{
        let m=map[k];
        return `<div class="flex justify-between py-3 border-b border-[#1a1a1a]"><span class="text-gray-300 text-[11px]">${m.label||k}</span><span class="text-white font-bold text-[12px]">${m.home||'0'} - ${m.away||'0'}</span></div>`;
      }).join('');
    }

    c.innerHTML=`<div class="bg-[#121212] rounded-2xl overflow-hidden border border-[#222]">
      <div class="p-3">
        <div class="flex justify-between items-center mb-2 px-2">
          <img src="${comp.competitors[0].team.logo}" class="w-7 h-7 bg-white rounded-full p-1">
          <p class="text-white font-black text-[11px] flex-1 text-center">📊 Key stats • REAL • Like Google</p>
          <img src="${comp.competitors[1].team.logo}" class="w-7 h-7 bg-white rounded-full p-1">
        </div>
        ${rowsHTML}
      </div>
      <div class="bg-green-900/20 p-3 border-t border-green-800 text-center"><p class="text-[10px] text-green-300 font-bold">✅ REAL from ESPN • ${comp.status.type.detail} • FT: ${comp.competitors[0].score}-${comp.competitors[1].score}</p></div>
    </div>`;
  }else if(tab==='lineup'){
    let rosters=data.rosters||[];
    if(rosters.length>=2){c.innerHTML=`<div class="bg-[#121212] rounded-2xl p-3 border border-[#222]"><p class="text-white font-bold text-center mb-2">👥 Lineup</p><div class="bg-[#1a1a1a] rounded-xl p-3 text-white text-[11px]">${rosters[0].roster?.slice(0,11).map(r=>r.athlete.displayName).join(', ')}<br><br>${rosters[1].roster?.slice(0,11).map(r=>r.athlete.displayName).join(', ')}</div></div>`;}else{c.innerHTML='<div class="bg-[#1a1a1a] rounded-xl p-6 text-center border"><p class="text-white font-bold">Lineup 1 hour before kickoff</p></div>';}
  }else if(tab==='commentary'){
    if(data.commentary&&data.commentary.length>0){c.innerHTML=data.commentary.map(x=>`<div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-3 mb-2"><div class="flex gap-2"><span class="bg-green-600 text-white text-[10px] px-2 py-0.5 rounded-full h-fit">${x.time||''}</span><p class="text-white text-[13px] flex-1">${x.text||x}</p></div></div>`).join('');}
    else{c.innerHTML=`<div class="bg-[#1a1a1a] rounded-xl p-4 border"><p class="text-white font-bold">💬 Commentary</p><p class="text-gray-400 text-[12px] mt-2">${comp.status.type.detail}</p></div>`;}
  }
}
function shareMatch(){if(!currentMatchData) return;let comp=currentMatchData.header.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');let text=`⚽ ${home.team.displayName} ${home.score}-${away.score} ${away.team.displayName} • DORNNY`;window.open(`https://wa.me/?text=${text}`,'_blank');}
(function(){let savedUser=localStorage.getItem('dornny_user');if(savedUser){user=JSON.parse(savedUser);document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');renderCats();render();loadScores();}else{renderCats();render();loadScores();}if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(()=>{}).catch(()=>{});});}})();
</script></body></html>
