<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#fff;padding-bottom:65px}.top{padding:10px;background:#fff;position:sticky;top:0;border-bottom:1px solid #ddd;display:flex;gap:6px}.top input{flex:1;background:#eee;border:0;border-radius:20px;padding:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#ddd;padding:3px}.card{background:#fff;border-radius:8px;overflow:hidden;text-align:center;padding-bottom:8px}.imgbox{height:140px;display:flex;align-items:center;justify-content:center;font-size:40px}.page{display:none;padding:8px}.page.on{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px 0}.nav b{font-size:11px;color:#888}.nav b.on{color:#000;font-weight:900}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}.modal.on{display:flex}.box{background:#fff;width:300px;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:12px}.btn{width:92%;padding:12px;border:0;border-radius:10px;font-weight:900;margin:6px 4%;display:block}.y{background:#FFD700}.bk{background:#111;color:#fff}</style></head><body><div class="top"><input id="q" placeholder="Search..." oninput="filter()"><button onclick="filter()" style="width:44px;border-radius:50%;background:#111;color:#fff;border:0">Go</button></div><div id="shop" class="page on"><b id="tit" style="display:block;padding:8px">All - 12 items</b><div class="grid" id="grid"></div><div style="text-align:center;padding:16px"><button class="btn y" style="margin:auto;width:250px" onclick="window.open('https://wa.me/233594221108')">OPEN SHOP 50 GHS - WHATSAPP</button></div></div><div id="category" class="page"><h3>Category</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><div onclick="goCat('HOODIE')" style="background:#fff;border:1px solid #ddd;padding:20px;border-radius:10px;text-align:center">HOODIES</div><div onclick="goCat('SHOE')" style="background:#fff;border:1px solid #ddd;padding:20px;border-radius:10px;text-align:center">SHOES</div><div onclick="goCat('JEAN')" style="background:#fff;border:1px solid #ddd;padding:20px;border-radius:10px;text-align:center">JEANS</div><div onclick="goCat('')" style="background:#111;color:gold;padding:20px;border-radius:10px;text-align:center">ALL 12</div></div></div><div id="trends" class="page"><h3>Trends</h3><div id="tlist"></div></div><div id="cart" class="page"><h3>Cart (<span id="cn">0</span>)</h3><div id="clist">Empty - Add from Shop</div></div><div id="me" class="page"><h3>Me</h3><div style="background:#111;color:#fff;padding:16px;border-radius:12px;margin-top:10px;text-align:center">DORNNY MARKET<br>0594221108<br>12 Items - SHEIN Clone</div><button class="btn y" onclick="tab('shop')">SHOP NOW</button></div><div class="nav"><b id="n-shop" class="on" onclick="tab('shop')">Shop</b><b id="n-category" onclick="tab('category')">Category</b><b id="n-trends" onclick="tab('trends')">Trends</b><b id="n-cart" onclick="tab('cart')">Cart</b><b id="n-me" onclick="tab('me')">Me</b></div><div class="modal" id="mP" onclick="closeP()"><div class="box"><div id="mi" style="height:200px;display:flex;align-items:center;justify-content:center;font-size:80px;background:#f5f5f5"></div><div style="padding:10px"><h3 id="mn"></h3><p id="mp" style="font-weight:900;margin:6px 0"></p><button class="btn bk" onclick="addC()">ADD TO CART</button><button class="btn y" onclick="buyW()">BUY WHATSAPP</button><button class="btn" style="background:#eee" onclick="closeP()">Close</button></div></div></div><script>var items=[{id:1,n:"GRAY HOODIE",p:180,e:"🧥",c:"#ccc"},{id:2,n:"WHITE SNEAKERS",p:250,e:"👟",c:"#eee"},{id:3,n:"BLACK SNEAKERS",p:280,e:"👟",c:"#333"},{id:4,n:"BLUE JEANS",p:126,e:"👖",c:"#5af"},{id:5,n:"LEATHER SHOES",p:320,e:"👞",c:"#a67c52"},{id:6,n:"PINK JOGGERS",p:120,e:"🩳",c:"#f9c"},{id:7,n:"BLACK HOODIE",p:200,e:"🧥",c:"#222"},{id:8,n:"BAGGY JEANS",p:140,e:"👖",c:"#66f"},{id:9,n:"RED SNEAKERS",p:260,e:"👟",c:"#f55"},{id:10,n:"WHITE SHIRT",p:90,e:"👔",c:"#fff"},{id:11,n:"RIPPED JEANS",p:150,e:"👖",c:"#44a"},{id:12,n:"BROWN SANDALS",p:80,e:"🩴",c:"#b86"}];var cart=[],cur=null;function draw(list){var g=document.getElementById("grid");g.innerHTML="";for(var i=0;i<list.length;i++){var it=list[i];g.innerHTML+='<div class="card" onclick="openP('+it.id+')"><div class="imgbox" style="background:'+it.c+'">'+it.e+'</div><div style="padding:6px;font-size:11px">'+it.n+'<br><b>GH₵'+it.p+' FULL</b></div></div>';}document.getElementById("tit").innerText="All - "+list.length+" items";}function tab(n){var a=document.querySelectorAll(".page");for(var i=0;i<a.length;i++)a[i].classList.remove("on");var b=document.querySelectorAll(".nav b");for(var i=0;i<b.length;i++)b[i].classList.remove("on");document.getElementById(n).classList.add("on");document.getElementById("n-"+n).classList.add("on");}function goCat(k){tab("shop");if(k==""){draw(items);return;}var f=[];for(var i=0;i<items.length;i++)if(items[i].n.indexOf(k)>=0)f.push(items[i]);draw(f);}function filter(){var q=document.getElementById("q").value.toUpperCase();if(!q){draw(items);return;}var f=[];for(var i=0;i<items.length;i++)if(items[i].n.indexOf(q)>=0)f.push(items[i]);draw(f);}function openP(id){for(var i=0;i<items.length;i++)if(items[i].id==id)cur=items[i];document.getElementById("mi").innerHTML=cur.e;document.getElementById("mi").style.background=cur.c;document.getElementById("mn").innerText=cur.n;document.getElementById("mp").innerText="GH₵"+cur.p+" FULL";document.getElementById("mP").classList.add("on");}function closeP(){document.getElementById("mP").classList.remove("on");}function addC(){cart.push(cur);document.getElementById("cn").innerText=cart.length;var cl=document.getElementById("clist"),tot=0;cl.innerHTML="";for(var i=0;i<cart.length;i++){tot+=cart[i].p;cl.innerHTML+="<div style=padding:8px;border:1px solid #eee;margin:4px 0;border-radius:8px;background:#fff>"+cart[i].e+" "+cart[i].n+" - GH₵"+cart[i].p+"</div>";}cl.innerHTML+="<br><b>Total GH₵"+tot+"</b><br><button class=btn bk onclick=\"window.open('https://wa.me/233594221108?text=Order GH₵"+tot+"')\">CHECKOUT WHATSAPP</button>";closeP();tab("cart");}function buyW(){window.open("https://wa.me/233594221108?text=I want "+cur.n);}draw(items);var tl=document.getElementById("tlist");for(var i=0;i<items.length;i++){var x=items[i];tl.innerHTML+="<div style=padding:10px;border:1px solid #eee;border-radius:10px;margin:5px 0;background:#fff onclick=openP("+x.id+")>"+x.e+" "+x.n+" - GH₵"+x.p+"</div>";}</script></body></html>
