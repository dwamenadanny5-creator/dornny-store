<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORNNY MARKET</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-24">
<!-- HEADER -->
<div class="bg-white p-3 sticky top-0 z-20 shadow">
<div class="flex justify-between items-center">
<b class="text-red-600 text-xl">DORNNY MARKET</b>
<div class="flex gap-3 items-center">
<button onclick="showPage('notif')">🔔</button>
<a href="sell.html" class="bg-green-500 text-white px-4 py-1 rounded-full text-sm font-bold">+SELL</a>
</div>
</div>
<input id="search" oninput="doSearch()" placeholder="Search iPhone, dress, shoes..." class="w-full mt-2 bg-gray-100 border rounded-full px-4 py-2 text-sm outline-none">
</div>

<!-- CATEGORIES -->
<div class="flex gap-2 p-2 overflow-auto bg-white sticky top-[92px] z-10" style="scrollbar-width:none">
<button onclick="filterCat('all')" class="cat bg-black text-white px-4 py-1.5 rounded-full text-sm">All</button>
<button onclick="filterCat('fashion')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Fashion</button>
<button onclick="filterCat('phones')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Phones</button>
<button onclick="filterCat('shoes')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Shoes</button>
<button onclick="filterCat('food')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Food</button>
<button onclick="filterCat('electronics')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Electronics</button>
<button onclick="filterCat('furniture')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Furniture</button>
<button onclick="filterCat('home')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Home Deco</button>
<button onclick="filterCat('cars')" class="cat bg-gray-200 px-4 py-1.5 rounded-full text-sm">Cars</button>
</div>

<!-- PRODUCTS GRID -->
<div id="products" class="grid grid-cols-2 gap-3 p-3"></div>

<!-- PAGES -->
<div id="p-category" class="hidden p-4"><h2 class="font-bold">Categories - Click to filter</h2><div class="grid grid-cols-2 gap-3 mt-3"><div onclick="filterCat('fashion');showPage('shop')" class="bg-white p-6 rounded-xl text-center shadow">👗<br>Fashion</div><div onclick="filterCat('phones');showPage('shop')" class="bg-white p-6 rounded-xl text-center shadow">📱<br>Phones</div><div onclick="filterCat('shoes');showPage('shop')" class="bg-white p-6 rounded-xl text-center shadow">👟<br>Shoes</div><div onclick="filterCat('electronics');showPage('shop')" class="bg-white p-6 rounded-xl text-center shadow">💻<br>Electronics</div></div></div>
<div id="p-trend" class="hidden p-4"><h2 class="font-bold">🔥 Trending - Most Liked</h2><div id="trendList" class="grid grid-cols-2 gap-3 mt-3"></div></div>
<div id="p-cart" class="hidden p-4"><h2 class="font-bold">Cart (<span id="cCount">0</span>)</h2><div id="cList" class="mt-3"></div></div>
<div id="p-me" class="hidden p-4">
<h2 class="font-bold">My Profile - Register</h2>
<div class="bg-white p-4 rounded-xl mt-3 shadow"><input id="uName" placeholder="Your Name" class="w-full border p-2 rounded mb-2"><input id="uPhone" placeholder="WhatsApp 233..." class="w-full border p-2 rounded mb-2"><button onclick="doRegister()" class="bg-red-600 text-white w-full py-2 rounded-full">Save Profile</button><p id="uStatus" class="text-sm text-green-600 mt-2"></p><div id="followedList" class="mt-4 text-sm"></div></div>
</div>
<div id="p-chats" class="hidden p-4"><h2 class="font-bold">💬 Chats & Following</h2><div id="chatList" class="mt-3"></div></div>
<div id="p-notif" class="hidden p-4"><h2 class="font-bold">🔔 Notifications</h2><div class="bg-white p-3 rounded-xl mt-3 shadow text-sm">🎉 12 new products live on Dornny Market!</div></div>

<!-- PRODUCT DETAIL MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-30 flex items-end justify-center">
<div class="bg-white w-full max-w-[500px] rounded-t-2xl max-h-[92vh] overflow-auto">
<div class="p-3">
<button onclick="closeModal()" class="float-right text-xl bg-gray-100 w-8 h-8 rounded-full">✕</button>
<img id="mImg" class="w-full h-64 object-cover rounded-xl">
<h2 id="mTitle" class="font-bold text-lg mt-2"></h2>
<p id="mPrice" class="text-red-600 font-bold text-xl"></p>
<div class="flex items-center justify-between mt-1">
<p id="mShop" class="text-sm"></p>
<button id="followBtn" onclick="followSeller()" class="bg-black text-white px-4 py-1 rounded-full text-xs">+ Follow</button>
</div>
<div id="mRate" class="flex gap-1 mt-2 text-xl"></div>
<p id="mRateText" class="text-xs text-gray-500"></p>
<div class="flex gap-2 mt-3">
<button onclick="doLike()" class="flex-1 bg-gray-100 py-2 rounded-full text-sm">❤️ Like <span id="mLikes"></span></button>
<button onclick="doCart()" class="flex-1 bg-black text-white py-2 rounded-full text-sm">🛒 Add Cart</button>
</div>
<a id="mWa" href="#" target="_blank" class="bg-green-500 text-white block text-center py-3 rounded-full mt-3 font-bold">WhatsApp Buy</a>

<!-- COMMENTS & RATINGS -->
<div class="mt-5 border-t pt-3">
<h3 class="font-bold text-sm">⭐ Rate this seller</h3>
<div class="flex gap-1 mt-1 text-2xl" id="starInput">
<span onclick="setRate(1)">☆</span><span onclick="setRate(2)">☆</span><span onclick="setRate(3)">☆</span><span onclick="setRate(4)">☆</span><span onclick="setRate(5)">☆</span>
</div>
<h3 class="font-bold text-sm mt-4">💬 Comments (<span id="commentCount">0</span>)</h3>
<div id="mComments" class="mt-2 space-y-2 max-h-40 overflow-auto"></div>
<div class="flex gap-2 mt-2">
<input id="commentBox" placeholder="Comment..." class="flex-1 border rounded-full px-3 py-2 text-sm">
<button onclick="postComment()" class="bg-red-600 text-white px-5 rounded-full text-sm">Send</button>
</div>
</div>
</div>
</div>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 text-[10px] z-20">
<button onclick="showPage('shop')" class="flex flex-col items-center text-red-600"><span class="text-[20px]">🏠</span>Shop</button>
<button onclick="showPage('category')" class="flex flex-col items-center"><span class="text-[20px]">☰</span>Category</button>
<button onclick="showPage('trend')" class="flex flex-col items-center"><span class="text-[20px]">🔥</span>Trend</button>
<button onclick="showPage('cart')" class="flex flex-col items-center"><span class="text-[20px]">🛒</span>Cart <span id="cCount2">0</span></button>
<button onclick="showPage('me')" class="flex flex-col items-center"><span class="text-[20px]">👤</span>Me</button>
<button onclick="showPage('chats')" class="flex flex-col items-center"><span class="text-[20px]">💬</span>Chats</button>
</div>

<script>
let curCat='all', curItem=null, curIdx=0, tempRating=0;
let items=[
{title:"iPhone 13 Pro",price:4500,cat:"phones",img:"https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=300",shop:"Danny Phones",likes:34,rating:4.5,ratings:12},
{title:"Samsung A54",price:2200,cat:"phones",img:"https://images.unsplash.com/photo-1585060544812-6b45742d762f?w=300",shop:"Phone Hub",likes:18,rating:4.2,ratings:8},
{title:"Ladies Dress",price:250,cat:"fashion",img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=300",shop:"Ama Fashion",likes:52,rating:4.8,ratings:25},
{title:"Men Shirt",price:120,cat:"fashion",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300",shop:"Gents Wear",likes:11,rating:4.0,ratings:5},
{title:"Nike Air Shoes",price:350,cat:"shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300",shop:"Kofi Kicks",likes:67,rating:4.9,ratings:33},
{title:"Adidas Runner",price:400,cat:"shoes",img:"https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=300",shop:"Shoe GH",likes:29,rating:4.3,ratings:14},
{title:"Jollof Pack",price:50,cat:"food",img:"https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300",shop:"Mama Food",likes:91,rating:5.0,ratings:42},
{title:"HP Laptop",price:3500,cat:"electronics",img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300",shop:"Tech World",likes:22,rating:4.6,ratings:10},
{title:"Speaker JBL",price:200,cat:"electronics",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=300",shop:"Electro GH",likes:15,rating:4.1,ratings:7},
{title:"Luxury Sofa",price:1200,cat:"furniture",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=300",shop:"Home Plus",likes:9,rating:4.4,ratings:6},
{title:"Wall Decor",price:300,cat:"home",img:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=300",shop:"Decor GH",likes:17,rating:4.7,ratings:9},
{title:"Toyota Corolla",price:85000,cat:"cars",img:"https://images.unsplash.com/photo-1550355291-bbee04a92027?w=300",shop:"Dornny Autos",likes:41,rating:4.8,ratings:18}
];
let cart=JSON.parse(localStorage.getItem('dm_cart')||'[]');
let follows=JSON.parse(localStorage.getItem('dm_follows')||'[]');
let coms=JSON.parse(localStorage.getItem('dm_coms')||'{}');
let ratings=JSON.parse(localStorage.getItem('dm_ratings')||'{}');

function render(list){
let h="";
list.forEach(p=>{
let idx=items.indexOf(p);
let isFollow=follows.includes(p.shop);
h+=`<div onclick="openM(${idx})" class="bg-white rounded-xl p-2 shadow">
<img src="${p.img}" class="h-32 w-full object-cover rounded-lg">
<b class="text-sm block truncate">${p.title}</b>
<p class="text-[11px] text-gray-500">${p.shop} ${isFollow?'• Following':''}</p>
<div class="flex justify-between items-center mt-1">
<span class="text-red-600 font-bold text-sm">₵${p.price}</span>
<span class="text-[11px]">⭐${p.rating} ❤️${p.likes}</span>
</div>
</div>`;
});
document.getElementById('products').innerHTML=h||'<p class="col-span-2 text-center text-gray-400 mt-10">No items found</p>';
}

function filterCat(c){
curCat=c;
document.querySelectorAll('.cat').forEach(b=>b.className='cat bg-gray-200 px-4 py-1.5 rounded-full text-sm');
event.target.className='cat bg-black text-white px-4 py-1.5 rounded-full text-sm';
doSearch();
showPage('shop');
}
function doSearch(){
let q=document.getElementById('search').value.toLowerCase();
let f=items.filter(i=>{
let catMatch=curCat=='all'||i.cat==curCat;
let qMatch=i.title.toLowerCase().includes(q)||i.shop.toLowerCase().includes(q)||i.cat.includes(q);
return catMatch&&qMatch;
});
render(f);
}
function showPage(p){
['products','p-category','p-trend','p-cart','p-me','p-chats','p-notif'].forEach(id=>document.getElementById(id).classList.add('hidden'));
if(p=='shop')document.getElementById('products').classList.remove('hidden');
if(p=='category')document.getElementById('p-category').classList.remove('hidden');
if(p=='trend'){document.getElementById('p-trend').classList.remove('hidden');let sorted=[...items].sort((a,b)=>b.likes-a.likes);let h="";sorted.forEach(s=>{h+=`<div onclick="openM(${items.indexOf(s)})" class="bg-white rounded-xl p-2 shadow"><img src="${s.img}" class="h-24 w-full object-cover rounded"><b class="text-xs">${s.title}</b><p class="text-[11px] text-red-600">₵${s.price} ❤️${s.likes}</p></div>`});document.getElementById('trendList').innerHTML=h;}
if(p=='cart'){document.getElementById('p-cart').classList.remove('hidden');renderCart();}
if(p=='me'){document.getElementById('p-me').classList.remove('hidden');showFollows();}
if(p=='chats'){document.getElementById('p-chats').classList.remove('hidden');showChats();}
if(p=='notif')document.getElementById('p-notif').classList.remove('hidden');
}
function openM(i){
curIdx=i;curItem=items[i];
document.getElementById('mImg').src=curItem.img;
document.getElementById('mTitle').innerText=curItem.title;
document.getElementById('mPrice').innerText='₵'+curItem.price;
document.getElementById('mShop').innerText=curItem.shop+' • '+curItem.cat;
document.getElementById('mLikes').innerText=curItem.likes;
document.getElementById('mWa').href=`https://wa.me/233245123456?text=Hi ${curItem.shop}, I want ${curItem.title} for ₵${curItem.price}`;
updateFollowBtn();updateRatingStars();loadComments();
document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function doLike(){curItem.likes++;document.getElementById('mLikes').innerText=curItem.likes;doSearch();}
function doCart(){cart.push(curItem);localStorage.setItem('dm_cart',JSON.stringify(cart));updCart();alert('Added to cart');}
function updCart(){document.getElementById('cCount').innerText=cart.length;document.getElementById('cCount2').innerText=cart.length;}
function renderCart(){let h="";cart.forEach((p,i)=>{h+=`<div class="bg-white p-2 rounded-xl shadow flex gap-2 mb-2"><img src="${p.img}" class="w-16 h-16 rounded object-cover"><div class="flex-1"><b class="text-sm">${p.title}</b><p class="text-red-600 text-sm">₵${p.price}</p><p class="text-xs text-gray-500">${p.shop}</p></div><button onclick="cart.splice(${i},1);localStorage.setItem('dm_cart',JSON.stringify(cart));updCart();renderCart();" class="text-red-600 text-xs">Remove</button></div>`});if(!h)h='<p class="text-sm text-gray-400">Cart empty</p>';else h+=`<a href="https://wa.me/233245123456?text=I want to buy ${cart.length} items from Dornny Market" target="_blank" class="bg-green-500 text-white block text-center py-3 rounded-full mt-3 font-bold">WhatsApp Checkout</a>`;document.getElementById('cList').innerHTML=h;}
function followSeller(){let s=curItem.shop;if(follows.includes(s)){follows=follows.filter(x=>x!=s);}else{follows.push(s);}localStorage.setItem('dm_follows',JSON.stringify(follows));updateFollowBtn();doSearch();showFollows();showChats();}
function updateFollowBtn(){let btn=document.getElementById('followBtn');if(follows.includes(curItem.shop)){btn.innerText='✓ Following';btn.className='bg-green-500 text-white px-4 py-1 rounded-full text-xs';}else{btn.innerText='+ Follow';btn.className='bg-black text-white px-4 py-1 rounded-full text-xs';}}
function showFollows(){let h=follows.length?'Following:<br>':'';follows.forEach(f=>{h+=`<span class="bg-black text-white px-2 py-1 rounded-full text-xs mr-1 inline-block mt-1">${f}</span>`});if(!follows.length)h='Not following any seller yet';document.getElementById('followedList').innerHTML=h;}
function showChats(){let h="";follows.forEach(f=>{h+=`<div class="bg-white p-3 rounded-xl shadow mb-2"><b class="text-sm">${f}</b><p class="text-xs text-gray-500">You are following • Tap to message</p><a href="https://wa.me/233245123456?text=Hi ${f}" class="text-green-600 text-xs font-bold">Message on WhatsApp</a></div>`});if(!h)h='<p class="text-sm text-gray-400">Follow sellers to chat. Click Follow on any product.</p>';document.getElementById('chatList').innerHTML=h;}
function updateRatingStars(){let r=ratings[curItem.title]||curItem.rating;document.getElementById('mRate').innerHTML='⭐'.repeat(Math.round(r))+' '+r.toFixed(1);document.getElementById('mRateText').innerText=r.toFixed(1)+' • '+ (curItem.ratings||0) +' ratings';}
function setRate(n){tempRating=n;document.getElementById('starInput').innerHTML='';for(let i=1;i<=5;i++){document.getElementById('starInput').innerHTML+=`<span onclick="setRate(${i})" class="${i<=n?'text-yellow-400':''} cursor-pointer">${i<=n?'★':'☆'}</span>`;}ratings[curItem.title]=((ratings[curItem.title]||curItem.rating)*curItem.ratings + n)/(curItem.ratings+1);curItem.rating=ratings[curItem.title];curItem.ratings++;localStorage.setItem('dm_ratings',JSON.stringify(ratings));updateRatingStars();doSearch();}
function loadComments(){let key=curItem.title;let list=coms[key]||[];document.getElementById('commentCount').innerText=list.length;let h="";list.forEach(c=>{h+=`<div class="bg-gray-100 rounded-lg p-2 text-xs"><b>${c.name}:</b> ${c.text} <span class="text-[10px] text-gray-400">${c.time}</span></div>`});if(!h)h='<p class="text-xs text-gray-400">No comments yet. Be first to comment!</p>';document.getElementById('mComments').innerHTML=h;}
function postComment(){let t=document.getElementById('commentBox').value.trim();if(!t)return;let name=localStorage.getItem('dm_name')||'Buyer';let key=curItem.title;if(!coms[key])coms[key]=[];coms[key].push({name,text:t,time:new Date().toLocaleTimeString()});localStorage.setItem('dm_coms',JSON.stringify(coms));document.getElementById('commentBox').value='';loadComments();}
function doRegister(){let n=document.getElementById('uName').value;let p=document.getElementById('uPhone').value;if(!n)return alert('Enter name');localStorage.setItem('dm_name',n);localStorage.setItem('dm_phone',p);document.getElementById('uStatus').innerText='Saved as '+n+' ✅';}
render(items);updCart();
</script>
</body>
</html>
