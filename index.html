<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORNNY MARKET</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="bg-white p-3 flex justify-between sticky top-0 shadow z-10">
<b class="text-red-600 text-xl">DORNNY MARKET</b>
<a href="sell.html" class="bg-green-500 text-white px-4 py-1 rounded-full font-bold">+SELL</a>
</div>
<div class="flex gap-2 p-2 overflow-auto bg-white">
<button onclick="filterCat('all')" class="bg-black text-white px-4 py-1 rounded-full text-sm">All</button>
<button onclick="filterCat('fashion')" class="bg-gray-100 border px-3 py-1 rounded-full text-sm">Fashion</button>
<button onclick="filterCat('phones')" class="bg-gray-100 border px-3 py-1 rounded-full text-sm">Phones</button>
<button onclick="filterCat('shoes')" class="bg-gray-100 border px-3 py-1 rounded-full text-sm">Shoes</button>
<button onclick="filterCat('food')" class="bg-gray-100 border px-3 py-1 rounded-full text-sm">Food</button>
<button onclick="filterCat('furniture')" class="bg-gray-100 border px-3 py-1 rounded-full text-sm">Furniture</button>
<button onclick="filterCat('cars')" class="bg-gray-100 border px-3 py-1 rounded-full text-sm">Cars</button>
<button onclick="filterCat('home')" class="bg-gray-100 border px-3 py-1 rounded-full text-sm">Home Deco</button>
</div>
<div id="products" class="grid grid-cols-2 gap-3 p-3 pb-20"></div>
<script>
let demo=[
{title:"iPhone 13 Pro",price:4500,cat:"phones",img:"https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=300"},
{title:"Ladies Dress",price:250,cat:"fashion",img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=300"},
{title:"Nike Air Shoes",price:350,cat:"shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"},
{title:"Toyota Corolla",price:85000,cat:"cars",img:"https://images.unsplash.com/photo-1550355291-bbee04a92027?w=300"},
{title:"Luxury Sofa",price:1200,cat:"furniture",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=300"},
{title:"Jollof Pack",price:50,cat:"food",img:"https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300"},
{title:"Wall Decor Art",price:300,cat:"home",img:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=300"}
];
function render(list){
let h="";
list.forEach(p=>{
h+=`<div class="bg-white rounded-xl p-2 shadow"><img src="${p.img}" class="h-32 w-full object-cover rounded-lg"><b class="text-sm block mt-1">${p.title}</b><p class="text-red-600 font-bold text-sm">₵${p.price}</p><a href="https://wa.me/233245123456?text=I want ${p.title} for ₵${p.price}" class="bg-green-500 text-white text-xs block text-center py-1.5 rounded-full mt-1">WhatsApp Buy</a></div>`;
});
document.getElementById("products").innerHTML=h;
}
function filterCat(c){
if(c=='all')render(demo);
else render(demo.filter(i=>i.cat==c));
}
render(demo);
</script>
</body>
</html>
