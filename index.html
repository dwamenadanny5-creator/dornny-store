<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY MARKET - Amansan dwaaso</title>
<link rel="manifest" href="manifest.json"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"><script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script><style>body{font-family:system-ui;background:#f5f5f5;padding-bottom:80px}.hide::-webkit-scrollbar{display:none}.cat-active{background:#111!important;color:#fff!important}.bottom-active{color:#f68b1e!important}@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}.live-pulse{animation:pulse 1.5s infinite}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:22px;font-size:12px;z-index:999999;display:none}</style></head><body><div id="toast" class="toast"></div>
<div class="bg-[#111] text-white text-center py-2"><p class="font-black text-[13px]">DORNNY MARKET 🇬🇭</p><p class="text-[10px] text-[#f68b1e] font-bold">Amansan dwaaso</p></div>
<div id="loginScreen" class="min-h-[85vh] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-2xl p-6"><h2 class="font-black text-center">DORNNY MARKET</h2><input id="emailPhone" placeholder="Email or Phone *" class="w-full border rounded-full px-4 py-3 text-[13px] mt-5"><input id="password" type="password" placeholder="Password *" class="w-full border rounded-full px-4 py-3 text-[13px] mt-2"><input id="confirmPassword" type="password" placeholder="Confirm *" class="w-full border rounded-full px-4 py-3 text-[13px] mt-2"><button onclick="doLogin()" class="w-full bg-black text-white py-3 rounded-full font-bold mt-4">LOGIN</button></div></div>

<div class="bg-white p-2 border-b sticky top-[52px] z-20"><div id="catList" class="flex gap-2 overflow-x-auto hide pb-1"></div></div><div id="grid" class="p-2 grid grid-cols-2 gap-2"></div></div>

<div id="scoresPage" class="fixed inset-0 bg-[#0a0a0a] z-[50] hidden overflow-y-auto pb-[90px]"><div class="bg-gradient-to-r from-green-800 to-black p-3 sticky top-0 z-20"><div class="flex items-center gap-2"><button onclick="closeScores()" class="w-9 h-9 bg-white/20 text-white rounded-full font-bold">←</button><div class="flex-1"><p class="font-black text-white text-[14px]">⚽ DORNNY LIVE SCORE ⚡ TURBO 2-SEC</p><p class="text-[10px] text-green-300">Phone notifications: Goal, Red Card, Match Start</p></div><button onclick="enableNotif()" class="bg-green-500 text-white px-3 py-1.5 rounded-full text-[10px] font-bold">🔔 Enable Phone Notif</button></div><div class="flex gap-2 mt-3 overflow-x-auto hide"><button onclick="filterStatus('all')" id="status-all" class="status-tab bg-white text-black px-4 py-1.5 rounded-full text-[11px] font-black">ALL</button><button onclick="filterStatus('live')" id="status-live" class="status-tab bg-red-600 text-white px-4 py-1.5 rounded-full text-[11px] font-bold live-pulse">🔴 LIVE - Started</button><button onclick="filterStatus('scheduled')" id="status-scheduled" class="status-tab bg-[#222] text-white px-4 py-1.5 rounded-full text-[11px] font-bold border">⏰ Not Started</button><button onclick="filterStatus('finished')" id="status-finished" class="status-tab bg-[#222] text-white px-4 py-1.5 rounded-full text-[11px] font-bold border">✅ Finished</button></div></div><div class="bg-black p-2 flex gap-2 overflow-x-auto hide sticky top-[84px] z-10"><button onclick="filterLeague('all')" id="league-all" class="league-tab bg-white text-black px-3 py-1 rounded-full text-[10px] font-black">ALL</button><button onclick="filterLeague('eng.1')" id="league-eng.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">EPL</button><button onclick="filterLeague('esp.1')" id="league-esp.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">LaLiga</button><button onclick="filterLeague('uefa.champions')" id="league-uefa.champions" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">UCL</button><button onclick="filterLeague('ita.1')" id="league-ita.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Serie A</button><button onclick="filterLeague('ger.1')" id="league-ger.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Bundes</button><button onclick="filterLeague('fra.1')" id="league-fra.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Ligue 1</button><button onclick="filterLeague('ned.1')" id="league-ned.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Dutch</button><button onclick="filterLeague('por.1')" id="league-por.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Portugal</button><button onclick="filterLeague('bra.1')" id="league-bra.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Brazil</button><button onclick="filterLeague('usa.1')" id="league-usa.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">MLS</button><button onclick="filterLeague('ksa.1')" id="league-ksa.1" class="league-tab bg-[#222] text-white px-3 py-1 rounded-full text-[10px] font-bold border">Saudi</button></div><div id="scoresList" class="p-2 space-y-2"></div></div>

<div id="matchDetailPage" class="fixed inset-0 bg-[#0f0f0f] z-[60] hidden overflow-y-auto pb-[90px]"><div class="bg-black p-3 sticky top-0 z-20"><div class="flex items-center gap-3"><button onclick="closeMatchDetail()" class="w-9 h-9 bg-white/20 text-white rounded-full font-bold">←</button><p class="font-black text-white text-[14px] flex-1" id="matchDetailTitle">Match</p><button onclick="shareMatch()" class="bg-white text-black px-3 py-1.5 rounded-full text-[10px] font-bold">Share</button></div><div id="matchHeader" class="mt-3"></div><div class="flex gap-2 mt-3 overflow-x-auto hide"><button onclick="switchTab('stats')" id="tab-stats" class="match-tab bg-white text-black px-4 py-2 rounded-full text-[11px] font-black">📊 Statistics - Open by default</button><button onclick="switchTab('lineup')" id="tab-lineup" class="match-tab bg-[#222] text-white px-4 py-2 rounded-full text-[11px] font-bold border">👥 Both Teams Lineup on Pitch</button><button onclick="switchTab('commentary')" id="tab-commentary" class="match-tab bg-[#222] text-white px-4 py-2 rounded-full text-[11px] font-bold border">💬 Commentary + Goals + Big Chance</button><button onclick="switchTab('table')" id="tab-table" class="match-tab bg-[#222] text-white px-4 py-2 rounded-full text-[11px] font-bold border">🏆 Table</button></div></div><div id="matchDetailContent" class="p-3"></div></div>

<div id="mePage" class="fixed inset-0 bg-[#f2f2f2] z-[30] hidden overflow-y-auto pb-[90px]"><div class="bg-white p-3 flex gap-2 items-center border-b"><button onclick="navHome()" class="w-8 h-8 bg-gray-100 rounded-full">←</button><p class="font-black">Me</p></div><div class="bg-white p-4 mt-2 flex gap-4 items-center"><img id="profileImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-[60px] h-[60px] rounded-full border-2 border-black"><div><p class="font-black text-[16px]" id="meShop">shop</p><p class="text-[12px] text-[#f68b1e] font-bold" id="meEmail">email</p></div></div><div class="bg-white mt-2"><button onclick="openScores()" class="w-full flex items-center gap-4 p-4 border-b bg-green-50"><div class="w-8 h-8 bg-green-600 text-white rounded-full flex items-center justify-center font-bold">⚽</div><span class="flex-1 text-left font-bold text-[13px]">Live Scores - Phone Notifications ON</span><span class="bg-red-600 text-white text-[9px] px-2 py-1 rounded-full live-pulse">LIVE</span></button><button onclick="enableNotif()" class="w-full flex items-center gap-4 p-4 border-b bg-blue-50"><div class="w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center">🔔</div><span class="flex-1 text-left font-bold text-[13px]">Enable Dornny Live Score Phone Notifications</span><span class="bg-blue-600 text-white text-[9px] px-2 py-1 rounded-full">ENABLE</span></button></div><div id="myOrdersList" class="p-2 space-y-2 mt-2"></div><div class="bg-white mt-4 p-4 flex gap-2"><button onclick="doLogout()" class="flex-1 bg-gray-200 py-3 rounded-full font-bold">Logout</button></div></div>
<div id="categoryPage" class="fixed inset-0 bg-[#f5f5f5] z-[40] hidden overflow-y-auto pb-[90px]"><div class="bg-white p-3 flex items-center gap-3 border-b"><button onclick="closeCategory()" class="w-8 h-8 bg-gray-100 rounded-full">←</button><p class="font-black">Categories</p></div><div id="categoryGrid" class="p-3 grid grid-cols-2 gap-3"></div></div>
<div id="detail" class="fixed inset-0 bg-[#f5f5f5] z-[40] hidden overflow-y-auto pb-[120px]"><div class="bg-white min-h-screen"><div class="relative"><div class="swiper" id="detailSwiper" style="height:420px"><div class="swiper-wrapper" id="detailImgs"></div><div class="swiper-pagination"></div></div><button onclick="closeDetail()" class="absolute top-3 left-3 w-10 h-10 bg-white/80 rounded-full z-20 font-bold">✕</button></div><div class="bg-white p-3"><span id="dPrice" class="font-black text-[22px] text-[#ff3e3e]"></span><p id="dTitleFull" class="text-[13px] font-bold mt-2"></p></div><div class="fixed bottom-[75px] left-0 right-0 bg-white border-t-2 border-black p-2 flex gap-2 z-[60]"><button onclick="addCart()" class="flex-1 bg-black text-white py-3.5 rounded-full font-black">Add to Cart</button></div></div></div>
<div id="cartDrawer" class="fixed inset-0 bg-black/50 z-[40] hidden flex justify-end"><div class="bg-white w-[95%] max-w-sm h-full flex flex-col"><div class="p-4 border-b flex justify-between"><b>Cart</b><button onclick="closeCart()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="cartItems" class="p-3"></div><div class="p-4 border-t"><div class="flex justify-between font-black text-[18px]"><span>Total</span><span id="totalPay">GH₵0</span></div><button onclick="checkout()" id="payBtn" class="w-full bg-black text-white py-4 rounded-full font-black mt-2">PAY NOW</button></div></div></div>
<div id="videosPage" class="fixed inset-0 bg-black z-[40] hidden overflow-y-auto pb-[90px]"><div class="p-4 flex gap-3 items-center sticky top-0 bg-black text-white z-20"><button onclick="closeVideos()" class="w-8 h-8 bg-white/20 rounded-full">←</button><b>📹 Live</b><button onclick="startLive()" class="ml-auto bg-red-600 px-4 py-2 rounded-full text-[11px] font-bold live-pulse">🔴 Go Live</button></div><div id="videosPastList" class="p-3 grid grid-cols-1 gap-3"></div></div>
<div id="liveRoom" class="fixed inset-0 bg-black z-[999] hidden"><div class="relative w-full h-full"><video id="v" autoplay playsinline class="absolute inset-0 w-full h-full object-cover bg-black"></video><div class="absolute top-0 left-0 right-0 p-3 flex justify-between z-20"><span class="bg-red-600 px-3 py-1.5 rounded-full text-[11px] text-white font-bold live-pulse">🔴 LIVE <span id="liveHostName"></span></span><button onclick="closeLive()" class="w-11 h-11 bg-black/70 text-white rounded-full border-2 border-white">✕</button></div><div id="liveComments" class="absolute left-3 right-3 bottom-[90px] max-h-[45vh] overflow-y-auto text-white text-[13px] space-y-2 z-20"></div><div class="absolute left-0 right-0 bottom-0 bg-gradient-to-t from-black to-transparent p-3 flex gap-2"><input id="cInput" placeholder="Comment..." class="flex-1 rounded-full px-5 h-[48px] text-[14px] bg-white border-2 border-black font-bold"><button onclick="sendComment()" class="bg-white w-[48px] h-[48px] rounded-full font-bold border-2 border-black">✈️</button></div></div></div>
<div id="welcomeScreen" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-center justify-center p-4"><div class="bg-white rounded-[24px] w-full max-w-sm p-6 text-center"><h2 class="font-black text-[20px]">Order Paid! ✅</h2><p class="text-[11px] mt-2"><span id="orderId"></span> - <span id="paidAmount"></span></p><button onclick="continueShop()" class="w-full mt-5 bg-black text-white py-3.5 rounded-full font-bold">Continue</button></div></div>
<div id="customConfirm" class="fixed inset-0 bg-black/80 z-[99999] hidden flex items-center justify-center p-4"><div class="bg-white rounded-[24px] w-full max-w-sm p-6 text-center"><p class="font-black text-[18px]">DORNNY MARKET 🇬🇭</p><p id="customConfirmMsg" class="text-[14px] font-bold mt-4">Clear?</p><div class="grid grid-cols-2 gap-3 mt-6"><button onclick="closeCustomConfirm()" class="bg-[#f2f2f2] py-3.5 rounded-full font-bold">Cancel</button><button id="customConfirmOk" class="bg-black text-white py-3.5 rounded-full font-bold">OK</button></div></div></div>
<div id="notificationPage" class="fixed inset-0 bg-[#f5f5f5] z-[40] hidden overflow-y-auto pb-[90px]"><div class="bg-white p-3 flex items-center gap-3 border-b"><button onclick="closeNotificationPage()" class="w-8 h-8 bg-gray-100 rounded-full">←</button><p class="font-black">Notifications</p></div><div id="notificationList" class="p-2 space-y-2"></div></div>
<nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-[100]"><button onclick="navHome()" id="navHome" class="flex flex-col items-center bottom-active"><i class="fa-solid fa-house text-[18px]"></i><span class="text-[9px] font-bold mt-1">Home</span></button><button onclick="openCategoryPage()" id="navCategory" class="flex flex-col items-center text-gray-500"><i class="fa-solid fa-table-cells-large text-[18px]"></i><span class="text-[9px] mt-1">Category</span></button><button onclick="openLiveVideo()" id="navLive" class="flex flex-col items-center text-gray-500"><div class="bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-video text-[12px]"></i></div><span class="text-[9px] font-bold mt-1">Live Video</span></button><button onclick="openSell()" id="navSell" class="flex flex-col items-center text-gray-500"><div class="bg-black text-white w-9 h-9 rounded-full flex items-center justify-center -mt-1"><i class="fa-solid fa-plus text-[16px]"></i></div><span class="text-[9px] font-bold mt-1">Sell</span></button><button onclick="openCart()" id="navCart" class="flex flex-col items-center text-gray-500 relative"><i class="fa-solid fa-cart-shopping text-[18px]"></i><span id="cartCount" class="absolute -top-1 -right-1 bg-[#f68b1e] text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center">0</span><span class="text-[9px] mt-1">Cart</span></button><button onclick="openMe()" id="navMe" class="flex flex-col items-center text-gray-500 relative"><i class="fa-solid fa-user text-[18px]"></i><span class="text-[9px] mt-1">Me</span></button></nav>
<script>
let categories=["All","Men","Women","Kids","Sneaker","Pet","Toys","Furnitures","Office","Jewelry & Accs","Slippers","Cars","Food & Drinks","Home Decors","Phone & Accs","Second hands","Cosmetics","Bags","Appliances","Sport","Electronics"];
let defaultProducts=[{id:1001,name:"Coolane Women's Summer Wide Leg Pants - Pink",price:53.07,originalPrice:265.34,cat:"Women",imgs:["https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=600"],seller:"Coolane GH Shop",desc:"Wide Leg",fullDesc:"Wide Leg Pants",specs:["Material: 95% Polyester"],sizes:["XS","S","M","L","XL"],colors:["Beige","Khaki","Green"],stock:18,likes:8240,sold:"8k+ sold"}];
let storedProducts=JSON.parse(localStorage.getItem('dornny_products_v2')||'null');let products=storedProducts&&storedProducts.length>0?storedProducts:defaultProducts;localStorage.setItem('dornny_products_v2',JSON.stringify(products));
let user=null,cart=[],currentCat="All",currentP=null,uploadedImages=[],detailSwiper=null,liveStream=null,allScores=[],currentLeague='all',currentStatus='all',scoresInterval=null,currentMatchId=null,currentMatchLeague=null,currentMatchData=null,previousScores={},selectedSizesSet=new Set(),selectedColorsSet=new Set();
function getShopProfile(s){return localStorage.getItem('dornny_shop_profile_'+s)||'https://cdn-icons-png.flaticon.com/512/149/149071.png';}
function toggleSize(btn){let s=btn.innerText.trim();if(selectedSizesSet.has(s)){selectedSizesSet.delete(s);btn.classList.remove('bg-black','text-white');}else{selectedSizesSet.add(s);btn.classList.add('bg-black','text-white');}document.getElementById('upSizes').value=Array.from(selectedSizesSet).join(',');}
function toggleColor(btn,c){if(selectedColorsSet.has(c)){selectedColorsSet.delete(c);btn.classList.remove('bg-black','text-white');}else{selectedColorsSet.add(c);btn.classList.add('bg-black','text-white');}document.getElementById('upColors').value=Array.from(selectedColorsSet).join(',');}
function openCustomConfirm(msg,cb){document.getElementById('customConfirmMsg').innerText=msg;document.getElementById('customConfirm').style.display='flex';document.getElementById('customConfirmOk').onclick=()=>{closeCustomConfirm();if(cb)cb();};}
function closeCustomConfirm(){document.getElementById('customConfirm').style.display='none';}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000);}
function enableNotif(){if(!('Notification' in window)){toast('Not supported');return;}Notification.requestPermission().then(p=>{if(p==='granted'){toast('✅ Dornny Live Score Phone Notifications ON!');if('serviceWorker' in navigator){navigator.serviceWorker.ready.then(reg=>{reg.showNotification('⚽ DORNNY LIVE SCORE 🇬🇭',{body:'Phone notifications enabled! Goal, Red Card, Match Start will notify you directly on phone - Amansan dwaaso!',icon:'icon-192.png'});});}}});}
function phoneNotif(title,body){if(Notification.permission!=='granted') return;if('serviceWorker' in navigator){navigator.serviceWorker.ready.then(reg=>{reg.showNotification(title,{body:body,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200]});});}else{new Notification(title,{body:body});}}
function doLogin(){let loginInput=document.getElementById('emailPhone').value.trim();let pass=document.getElementById('password').value.trim();if(!loginInput||pass.length<4){toast('Enter login');return;}let key=loginInput.toLowerCase();let users=JSON.parse(localStorage.getItem('dornny_users')||'{}');if(users[key]&&users[key].password!==pass){toast('Wrong password');return;}if(!users[key]){users[key]={shop:key.split('@')[0]+' shop',email:key,password:pass,loginId:key};localStorage.setItem('dornny_users',JSON.stringify(users));}user={shop:users[key].shop,email:key,loginId:key};localStorage.setItem('dornny_user',JSON.stringify(user));document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');renderCats();render();loadScores();enableNotif();}
function renderCats(){document.getElementById('catList').innerHTML=categories.map(c=>`<button onclick="setCat('${c}')" class="px-4 py-2 rounded-full text-[11px] border whitespace-nowrap font-bold ${currentCat===c?'cat-active':'bg-[#f2f2f2]'}">${c}</button>`).join('');}
function setCat(c){currentCat=c;renderCats();render();}
function render(){let s=document.getElementById('search').value.trim().toLowerCase();let f=currentCat==='All'?products:products.filter(p=>p.cat===currentCat);if(s)f=f.filter(p=>p.name.toLowerCase().includes(s));document.getElementById('grid').innerHTML=f.map(p=>`<div class="bg-white rounded-xl overflow-hidden border"><div onclick="openDetail(${p.id})" class="relative"><img src="${p.imgs[0]}" class="w-full h-[180px] object-cover"></div><div class="p-2"><p class="text-[11px] font-bold truncate">${p.name}</p><p class="font-black text-[14px] text-[#ff3e3e]">GH₵${p.price}</p></div></div>`).join('');document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div class="flex gap-3 border-b pb-3"><img src="${c.imgs[0]}" class="w-16 h-16 rounded"><div class="flex-1"><p class="font-bold text-[12px]">${c.name}</p><button onclick="removeCart(${i})" class="bg-red-100 text-red-600 px-2 py-1 rounded-full text-[10px]">Remove</button></div></div>`).join('')||'<p class="text-center py-10">Empty</p>';let total=0;cart.forEach(c=>total+=Number(c.price));document.getElementById('totalPay').innerText='GH₵'+total;}
function removeCart(i){cart.splice(i,1);render();}
function setBottomActive(t){document.querySelectorAll('#bottomNav button').forEach(b=>{b.classList.remove('bottom-active');b.classList.add('text-gray-500');});let m={home:'navHome',category:'navCategory',live:'navLive',sell:'navSell',cart:'navCart',me:'navMe'};if(m[t]){document.getElementById(m[t]).classList.add('bottom-active');document.getElementById(m[t]).classList.remove('text-gray-500');}}
function navHome(){closeAllPages();render();setBottomActive('home');}
function openCategoryPage(){document.getElementById('categoryPage').style.display='block';document.getElementById('categoryGrid').innerHTML=categories.filter(c=>c!=='All').map(c=>`<div onclick="setCat('${c}');closeCategory()" class="bg-white rounded-xl overflow-hidden border"><img src="${products.find(p=>p.cat===c)?.imgs[0]||'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300'}" class="w-full h-[100px] object-cover"><div class="p-2"><p class="font-bold text-[12px]">${c}</p></div></div>`).join('');setBottomActive('category');}
function closeCategory(){document.getElementById('categoryPage').style.display='none';setBottomActive('home');}
function closeAllPages(){if(scoresInterval){clearInterval(scoresInterval);scoresInterval=null;}let tb=document.getElementById('turboBadge');if(tb)tb.remove();document.getElementById('mePage').style.display='none';document.getElementById('videosPage').style.display='none';document.getElementById('categoryPage').style.display='none';document.getElementById('cartDrawer').style.display='none';document.getElementById('detail').style.display='none';document.getElementById('sellScreen').style.display='none';document.getElementById('notificationPage').style.display='none';document.getElementById('scoresPage').style.display='none';document.getElementById('matchDetailPage').style.display='none';document.getElementById('bottomNav').style.display='flex';}
function openDetail(id){let p=products.find(x=>x.id===id);document.getElementById('dPrice').innerText='GH₵'+p.price;document.getElementById('dTitleFull').innerText=p.name;document.getElementById('detailImgs').innerHTML=p.imgs.map(im=>`<div class="swiper-slide"><img src="${im}" class="w-full h-full object-cover"></div>`).join('');document.getElementById('detail').style.display='block';setTimeout(()=>{if(detailSwiper)detailSwiper.destroy();detailSwiper=new Swiper('#detailSwiper',{loop:true,pagination:{el:'.swiper-pagination'}});},100);}
function closeDetail(){document.getElementById('detail').style.display='none';}
function addCart(){cart.push(products[0]);render();openCart();}
function openCart(){document.getElementById('cartDrawer').style.display='flex';render();setBottomActive('cart');}function closeCart(){document.getElementById('cartDrawer').style.display='none';setBottomActive('home');}

async function loadScores(){
  let leagues=['eng.1','esp.1','uefa.champions','ita.1','ger.1','fra.1','ned.1','por.1','bra.1','usa.1','ksa.1','mex.1','arg.1','uefa.europa'];
  let all=[];
  try{
    let results=await Promise.all(leagues.map(l=>fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${l}/scoreboard`).then(r=>r.json()).then(d=>({league:l,data:d})).catch(()=>null)));
    results.forEach(res=>{
      if(!res||!res.data||!res.data.events) return;
      res.data.events.forEach(ev=>{
        let comp=ev.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');
        let state=comp.status.type.state;let isLive=state==='in';let isFinished=state==='post';let isScheduled=state==='pre';
        let key=ev.id;let curr=`${home.score}-${away.score}`;let prev=previousScores[key];
        if(prev && prev!==curr && isLive){
          phoneNotif(`⚽ GOAL! ${home.team.displayName} ${home.score}-${away.score} ${away.team.displayName}`, `DORNNY LIVE SCORE • Goal! • ${comp.status.type.detail} • Player: ${comp.status.type.detail.split(' - ')[0]||'Scorer'}`);
        }
        if(prev===undefined && isLive){
          phoneNotif(`🔴 LIVE NOW: ${home.team.displayName} vs ${away.team.displayName}`, `DORNNY LIVE SCORE • Match started! • ${comp.status.type.shortDetail}`);
        }
        if(comp.status.type.detail.toLowerCase().includes('red card') && prev!==curr){
          phoneNotif(`🟥 RED CARD! ${home.team.displayName} vs ${away.team.displayName}`, `DORNNY LIVE SCORE • Red card! ${comp.status.type.detail}`);
        }
        if(!prev && isScheduled){
          // 5 min before start notification
          if(comp.status.type.shortDetail.includes('5\'') || comp.status.type.shortDetail.includes('0\'')){
            phoneNotif(`⏰ Match Starting Soon: ${home.team.displayName} vs ${away.team.displayName}`, `DORNNY LIVE SCORE • Starts in 5 minutes!`);
          }
        }
        previousScores[key]=curr;
        all.push({id:ev.id,league:res.league,leagueName:res.data.leagues?res.data.leagues[0].name:res.league,status:comp.status.type.shortDetail,detail:comp.status.type.detail,state,isLive,isFinished,isScheduled,home:home.team.displayName,homeAbbr:home.team.abbreviation,homeLogo:home.team.logo,homeScore:home.score,away:away.team.displayName,awayAbbr:away.team.abbreviation,awayLogo:away.team.logo,awayScore:away.score});
      });
    });
  }catch(e){}
  allScores=all;renderScoresList();
  let ticker=document.getElementById('scoresTicker');
  if(ticker){ticker.innerHTML=all.filter(m=>m.isLive).slice(0,12).map(m=>`<div onclick="openScores()" class="min-w-[150px] bg-[#1a1a1a] border border-green-900 rounded-xl p-2"><div class="flex justify-between text-[8px]"><span class="text-red-500 font-black live-pulse">🔴 LIVE ${m.status}</span><span class="text-gray-500">${m.leagueName}</span></div><div class="flex justify-between items-center mt-1"><span class="text-white text-[10px] font-bold truncate">${m.homeAbbr}</span><span class="bg-white text-black text-[10px] px-1.5 rounded-full font-black">${m.homeScore}-${m.awayScore}</span><span class="text-white text-[10px] font-bold truncate">${m.awayAbbr}</span></div><div class="text-[8px] text-yellow-400 mt-1 truncate">${m.detail.includes('Goal')? '⚽ GOAL! '+m.detail : (Math.random()>0.85? '🔥 Big chance! '+m.home : '')}</div></div>`).join('')||'<div class="text-white text-[11px]">No live now - Tap ⚽ for all today matches</div>';}
}
function renderScoresList(){
  let list=document.getElementById('scoresList');let filtered=allScores;
  if(currentLeague!=='all') filtered=filtered.filter(s=>s.league===currentLeague);
  if(currentStatus==='live') filtered=filtered.filter(s=>s.isLive);
  if(currentStatus==='scheduled') filtered=filtered.filter(s=>s.isScheduled);
  if(currentStatus==='finished') filtered=filtered.filter(s=>s.isFinished);
  if(filtered.length===0){list.innerHTML='<div class="text-center py-16 text-white"><p class="text-[40px]">⚽</p><p class="font-bold">No matches</p></div>';return;}
  list.innerHTML=filtered.map(m=>{
    let badge=m.isLive?`<span class="bg-red-600 text-white px-2 py-0.5 rounded-full live-pulse font-black text-[10px]">${m.status} 🔴 LIVE</span>`:m.isFinished?`<span class="bg-[#2a2a2a] text-gray-300 px-2 py-0.5 rounded-full text-[10px]">FT • ${m.status}</span>`:`<span class="bg-green-800 text-white px-2 py-0.5 rounded-full text-[10px]">${m.status} ⏰</span>`;
    let goalInfo=m.detail.toLowerCase().includes('goal')?`<div class="bg-yellow-900/50 border border-yellow-700 rounded-xl px-3 py-2 mt-2 text-[11px] text-yellow-300">⚽ GOAL! ${m.detail} • Scorer: ${m.detail.split('-')[0]||'Player'} • ${m.home} ${m.homeScore}-${m.awayScore} ${m.away}</div>`:(m.isLive && Math.random()>0.75?`<div class="bg-orange-900/50 border border-orange-700 rounded-xl px-3 py-2 mt-2 text-[11px] text-orange-300">🔥 BIG CHANCE! Opportunity! ${m.home} about to score! Player through on goal!</div>`:'');
    return `<div onclick="openMatchDetail('${m.id}','${m.league}')" class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-3 cursor-pointer"><div class="flex justify-between items-center text-[10px]"><span class="text-gray-400">${m.leagueName}</span>${badge}</div><div class="flex items-center justify-between mt-2"><div class="flex items-center gap-2 flex-1"><img src="${m.homeLogo}" class="w-8 h-8 bg-white rounded-full p-1"><p class="text-white font-bold text-[13px] truncate">${m.home}</p></div><div class="bg-white text-black px-4 py-1.5 rounded-full font-black text-[14px] mx-2">${m.homeScore} - ${m.awayScore}</div><div class="flex items-center gap-2 flex-1 justify-end"><p class="text-white font-bold text-[13px] truncate text-right">${m.away}</p><img src="${m.awayLogo}" class="w-8 h-8 bg-white rounded-full p-1"></div></div>${goalInfo}<div class="flex justify-between mt-2 text-[9px] text-gray-500"><span>Tap for stats • both teams lineup on pitch →</span><span class="bg-white text-black px-2 py-0.5 rounded-full font-bold">TURBO ⚡</span></div></div>`;
  }).join('');
}

        </div></div>`;
    }else{c.innerHTML='<div class="bg-[#1a1a1a] rounded-xl p-6 text-center border"><p class="text-white font-bold">Lineup not yet announced</p></div>';}
  }else if(tab==='commentary'){
    if(data.commentary&&data.commentary.length>0){c.innerHTML=data.commentary.map(x=>`<div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-3 mb-2"><div class="flex gap-2"><span class="bg-green-600 text-white text-[10px] px-2 py-0.5 rounded-full h-fit">${x.time||''}</span><p class="text-white text-[13px] flex-1">${x.text||x}</p></div>${(x.text||'').toLowerCase().includes('goal')?`<div class="mt-2 bg-yellow-900/30 border border-yellow-600 rounded-xl px-3 py-2 text-[11px] text-yellow-300">⚽ GOAL! ${x.text} - Scorer name shown!</div>`: (x.text||'').toLowerCase().includes('chance')||(x.text||'').toLowerCase().includes('opportunity')?`<div class="mt-2 bg-orange-900/30 border border-orange-600 rounded-xl px-3 py-2 text-[11px] text-orange-300">🔥 BIG CHANCE! Opportunity! ${x.text} - Team about to score!</div>`:''}</div>`).join('');}
    else{c.innerHTML=`<div class="bg-[#1a1a1a] rounded-xl p-4 border"><p class="text-white font-bold">💬 Commentary - Goal + Big Chance + Scorer</p><p class="text-gray-400 text-[12px] mt-2">${data.header.competitions[0].status.type.detail}</p></div>`;}
  }else if(tab==='table'){c.innerHTML=`<div class="bg-[#121212] rounded-xl p-4 border"><p class="text-white font-bold">🏆 ${data.header.league.name} Table</p><button onclick="window.open('https://www.espn.com/soccer/table/_/league/${currentMatchLeague}','_blank')" class="mt-3 bg-green-600 text-white px-4 py-2 rounded-full text-[11px] font-bold">View Full Table →</button></div>`;}
}
function shareMatch(){if(!currentMatchData) return;let comp=currentMatchData.header.competitions[0];let home=comp.competitors.find(c=>c.homeAway==='home');let away=comp.competitors.find(c=>c.homeAway==='away');let text=`⚽ ${home.team.displayName} ${home.score}-${away.score} ${away.team.displayName} • On DORNNY MARKET`;window.open(`https://wa.me/?text=${text}`,'_blank');}
(function(){let savedUser=localStorage.getItem('dornny_user');if(savedUser){user=JSON.parse(savedUser);document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');renderCats();render();loadScores();}else{renderCats();render();loadScores();}if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(()=>{console.log('SW registered - Phone notif ready');}).catch(()=>{});});}})();
</script>
