<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DORNNY MARKET</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}</style>
</head>
<body class="bg-gray-100 pb-24">
<div class="bg-white p-3 sticky top-0 z-30 shadow">
<div class="flex justify-between items-center">
<h1 class="text-red-600 font-black text-xl">DORNNY MARKET</h1>
<div class="flex gap-2"><span onclick="showPage('notif')" class="text-xl">🔔</span><button onclick="location.href='sell.html'" class="bg-green-600 text-white px-4 py-1 rounded-full font-bold">+SELL</button></div>
</div>
<input id="search" oninput="doSearch()" placeholder="Search iPhone, dress..." class="w-full mt-2 p-3 rounded-full bg-gray-100 outline-none">
</div>

<div class="flex gap-2 p-2 overflow-auto no-scrollbar">
<button onclick="filterCat('all')" id="c-all" class="cat bg-black text-white px-5 py-2 rounded-full whitespace-nowrap">All</button>
<button onclick="filterCat('fashion')" id="c-fashion" class="cat bg-white px-5 py-2 rounded-full whitespace-nowrap">Fashion</button>
<button onclick="filterCat('phones')" id="c-phones" class="cat bg-white px-5 py-2 rounded-full whitespace-nowrap">Phones</button>
<button onclick="filterCat('shoes')" id="c-shoes" class="cat bg-white px-5 py-2 rounded-full whitespace-nowrap">Shoes</button>
<button onclick="filterCat('food')" id="c-food" class="cat bg-white px-5 py-2 rounded-full whitespace-nowrap">Food</button>
<button onclick="filterCat('electronics')" id="c-electronics" class="cat bg-white px-5 py-2 rounded-full whitespace-nowrap">Electronics</button>
<button onclick="filterCat('furniture')" id="c-furniture" class="cat bg-white px-5 py-2 rounded-full whitespace-nowrap">Furniture</button>
<button onclick="filterCat('home')" id="c-home" class="cat bg-white px-5 py-2 rounded-full whitespace-nowrap">Home</button>
</div>

<div id="p-home" class="p-2">
<div id="list" class="grid grid-cols-2 gap-2"></div>
</div>

<div id="p-cart" class="hidden p-4"><h2 class="font-bold">🛒 Cart</h2><div id="cartList" class="bg-white p-3 rounded-xl mt-3 shadow">Empty cart</div></div>
<div id="p-shop" class="hidden p-4"><h2 class="font-bold">🏪 My Shop</h2><div class="bg-white p-3 rounded-xl mt-3 shadow text-sm">Pay 50 GHS to register & start selling - Monthly 50 GHS after 30 days<br><br><button onclick="location.href='sell.html'" class="bg-green-600 text-white w-full p-3 rounded-xl mt-2">Go to Sell</button></div></div>
<div id="p-trend" class="hidden p-4"><h2 class="font-bold">🔥 Trending</h2><div id="trendList" class="grid grid-cols-2 gap-2 mt-3"></div></div>
<div id="p-me" class="hidden p-4"><h2 class="font-bold">👤 Me</h2><div class="bg-white p-3 rounded-xl mt-3 shadow"><p id="meInfo"></p></div></div>
<div id="p-notif" class="hidden p-4"><h2 class="font-bold">🔔 Info</h2><div class="bg-white p-3 rounded-xl mt-3 shadow text-sm">Pay 50 GHS to register & start selling - Monthly 50 GHS after 30 days</div></div>

<div id="viewModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex flex-col">
<div class="flex justify-between p-3 text-white"><button onclick="closeView()" class="text-2xl">✕</button><span id="slideInfo">1/3</span></div>
<div class="flex-1 flex items-center relative overflow-hidden" id="slideBox" ontouchstart="ts(event)" ontouchend="te(event)">
<img id="vImg" class="w-full h-[70vh] object-contain">
<button onclick="prevImg()" class="absolute left-2 bg-white/50 rounded-full w-10 h-10">‹</button>
<button onclick="nextImg()" class="absolute right-2 bg-white/50 rounded-full w-10 h-10">›</button>
</div>
<div class="bg-white p-4 rounded-t-2xl"><h2 id="vName" class="font-bold text-lg"></h2><p id="vPrice" class="text-red-600 font-bold"></p><button onclick="addCart()" class="bg-black text-white w-full p-3 rounded-xl mt-2">Add to Cart</button></div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-white flex justify-around p-3 border-t z-40">
<button onclick="showPage('home')" class="flex flex-col items-center"><span>🏠</span><span class="text-xs">Home</span></button>
<button onclick="showPage('cart')" class="flex flex-col items-center"><span>🛒</span><span class="text-xs">Cart</span></button>
<button onclick="showPage('shop')" class="flex flex-col items-center"><span>🏪</span><span class="text-xs">Shop</span></button>
<button onclick="showPage('trend')" class="flex flex-col items-center"><span>🔥</span><span class="text-xs">Trend</span></button>
<button onclick="showPage('me')" class="flex flex-col items-center"><span>👤</span><span class="text-xs">Me</span></button>
</div>

<script>
let products=[
{name:"Ladies Dress",price:"₵250",cat:"fashion",seller:"Ama Fashion",likes:52,rate:4.8,imgs:["https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500","https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=500","https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500"]},
{name:"Boys top",price:"₵70",cat:"fashion",seller:"Akoti",likes:0,rate:5,imgs:["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500","https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500","https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500"]}
];
let curCat='all', curProd=null, curIdx=0, startX=0;
function render(list){
let h=""; list.forEach((p,i)=>{
h+=`<div onclick="openView(${i})" class="bg-white rounded-xl overflow-hidden shadow"><img src="${p.imgs[0]}" class="w-full h-40 object-cover"><div class="p-2"><p class="font-bold text-sm">${p.name}</p><p class="text-xs text-gray-500">${p.seller} • 3 📷</p><div class="flex justify-between"><p class="text-red-600 font-bold">${p.price}</p><p class="text-xs">❤️${p.likes} ⭐${p.rate}</p></div></div></div>`;
}); document.getElementById('list').innerHTML=h;
document.getElementById('trendList').innerHTML=h;
}
function filterCat(c){
curCat=c; document.querySelectorAll('.cat').forEach(b=>b.className="cat bg-white px-5 py-2 rounded-full whitespace-nowrap");
document.getElementById('c-'+c).className="cat bg-black text-white px-5 py-2 rounded-full whitespace-nowrap";
let f=c=='all'?products:products.filter(p=>p.cat==c); render(f);
}
function doSearch(){
let q=document.getElementById('search').value.toLowerCase();
let f=products.filter(p=>p.name.toLowerCase().includes(q));
render(f);
}
function showPage(p){
['home','cart','shop','trend','me','notif'].forEach(id=>{let e=document.getElementById('p-'+id); if(e) e.classList.add('hidden')});
document.getElementById('p-'+p).classList.remove('hidden');
if(p=='me'){let reg=localStorage.getItem('regPaid')||'Not paid'; document.getElementById('meInfo').innerHTML="Reg: "+reg+"<br>Exp: "+(localStorage.getItem('exp')||'--') }
if(p=='cart') loadCart();
}
function openView(i){curProd=products[i]; curIdx=0; showSlide(); document.getElementById('viewModal').classList.remove('hidden')}
function closeView(){document.getElementById('viewModal').classList.add('hidden')}
function showSlide(){
if(!curProd) return;
document.getElementById('vImg').src=curProd.imgs[curIdx];
document.getElementById('vName').innerText=curProd.name;
document.getElementById('vPrice').innerText=curProd.price;
document.getElementById('slideInfo').innerText=(curIdx+1)+"/"+curProd.imgs.length;
}
function nextImg(){curIdx=(curIdx+1)%curProd.imgs.length; showSlide()}
function prevImg(){curIdx=(curIdx-1+curProd.imgs.length)%curProd.imgs.length; showSlide()}
function ts(e){startX=e.touches[0].clientX}
function te(e){let dx=e.changedTouches[0].clientX-startX; if(dx<-50) nextImg(); if(dx>50) prevImg();}
function addCart(){let c=JSON.parse(localStorage.getItem('cart')||"[]"); c.push(curProd); localStorage.setItem('cart',JSON.stringify(c)); alert('Added to cart!'); closeView(); loadCart();}
function loadCart(){let c=JSON.parse(localStorage.getItem('cart')||"[]"); if(c.length==0){document.getElementById('cartList').innerHTML="Empty cart"; return;} let h=""; c.forEach(p=>{h+=`<div class="flex gap-2 border-b py-2"><img src="${p.imgs[0]}" class="w-16 h-16 object-cover rounded"><div><p>${p.name}</p><p class="text-red-600">${p.price}</p></div></div>`}); document.getElementById('cartList').innerHTML=h;}
render(products);
</script>
</body>
</html>
