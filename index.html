<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#222;padding-bottom:80px}
.header{background:#fff;padding:10px 12px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo{color:#cc0000;font-weight:900;font-size:22px;letter-spacing:-0.5px}
.head-right{display:flex;gap:8px;align-items:center}
.btn-sell{background:#0a8a00;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:700;font-size:14px}
.btn-user{background:#e9e9e9;border:none;padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
.ref-bar{background:linear-gradient(135deg,#111,#333);color:#fff;padding:12px;margin:8px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.ref-bar b{color:#ffeb3b}
.ref-bar button{background:#ffeb3b;color:#111;border:none;padding:6px 12px;border-radius:8px;font-weight:800;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);display:flex;flex-direction:column;position:relative}
.card-img{width:100%;height:160px;background:#f0f0f0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px;flex:1;display:flex;flex-direction:column}
.badge-ver{color:#cc0000;background:#ffe5e5;font-size:10px;font-weight:800;padding:3px 8px;border-radius:12px;display:inline-block;width:fit-content;margin-bottom:6px}
.card-title{font-size:13px;font-weight:700;line-height:1.3;height:34px;overflow:hidden;margin-bottom:6px}
.card-price{color:#0a8a00;font-weight:900;font-size:16px;margin-bottom:4px}
.card-old{color:#888;font-size:11px;text-decoration:line-through;margin-left:4px}
.card-loc{font-size:11px;color:#888;display:flex;align-items:center;gap:3px;margin-bottom:8px}
.btn-wa{background:#0a8a00;color:#fff;border:none;width:100%;padding:10px;border-radius:8px;font-weight:700;font-size:13px;margin-top:auto}
.btn-wa:active{background:#076600}
.featured-card{grid-column:1 / -1;display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.12);border:2px solid #0a8a00}
.featured-card .card-img{width:140px;height:140px;flex-shrink:0}
.featured-info{padding:10px;flex:1}
.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:8px;max-width:600px;margin:0 auto}
.cat-chip{background:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cat-chip.on{background:#111;color:#fff}
.page{display:none;max-width:600px;margin:0 auto;padding:12px}
.page.on{display:block}
.me-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:200}
.nav-item{text-align:center;font-size:11px;color:#888;padding:4px 12px}
.nav-item.on{color:#cc0000;font-weight:700}
.nav-item b{display:block;font-size:18px}
</style>
</head>
