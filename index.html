<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dornny's Market</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#121212;color:#fff}.cat-active{background:#fff!important;color:#000!important}.product-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;align-items:end;justify-content:center}.product-modal.active{display:flex}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1e1e1e;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:40}.cart-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:none;flex-direction:column}.cart-modal.active{display:flex}.slide-track{display:flex;transition:transform.35s ease}.dot{width:8px;height:8px;border-radius:50%}.dot-on{background:#fff}.dot-off{background:rgba(255,255,255,.4)}</style></head><body class="pb-20">
<header class="bg-black p-4 sticky top-0 z-20 flex justify-between"><h1 class="font-black">DORNNY'S MARKET</h1><div class="flex gap-2"><a href="./live.html" class="bg-red-600 px-4 py-1.5 rounded-full text-xs font-bold">LIVE</a><a href="./sell.html" class="bg-[#2a2a2a] px-4 py-1.5 rounded-full text-sm font-bold">+ Sell</a></div></header>
<div class="p-3"><input id="search" placeholder="Search..." class="w-full p-3 rounded-full bg-[#2a2a2a] border-0"></div>
<div class="flex gap-2 px-3 overflow-x-auto pb-3 text-sm" style="scrollbar-width:none"><button onclick="filterCat('',this)" class="cat-btn cat-active px-4 py-1.5 rounded-full bg-[#2a2a2a]">All</button><button onclick="filterCat('Men',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Men</button><button onclick="filterCat('Women',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Women</button><button onclick="filterCat('Kids',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Kids</button><button onclick="filterCat('Shoes',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Shoes</button><button onclick="filterCat('Pets',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Pets</button><button onclick="filterCat('Jewelry',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Jewelry</button><button onclick="filterCat('Furniture',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Furniture</button><button onclick="filterCat('Office',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Office</button><button onclick="filterCat('Bags',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Bags</button><button onclick="filterCat('Phones',this)" class="cat-btn px-4 py-1.5 rounded-full bg-[#2a2a2a]">Phones</button></div>
<div id="products" class="grid grid-cols-2 gap-3 p-3"><p class="col-span-full text-center py-20 text-gray-400">Loading...</p></div>
<div id="modal" class="product-modal" onclick="closeModal()"><div class="bg-[#1e1e1e] rounded-t-[24px] w-full max-w-md max-h-[92vh] flex flex-col" onclick="event.stopPropagation()"><div class="overflow-y-auto"><div class="w-12 h-1 bg-gray-600 rounded-full mx-auto mt-3"></div>
<div class="relative w-full h-[380px] mt-3 overflow-hidden bg-black" id="imgWrap"><div id="mImageSlider" class="slide-track h-full"></div><button onclick="prevImg()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/60 w-9 h-9 rounded-full font-bold">‹</button><button onclick="nextImg()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/60 w-9 h-9 rounded-full font-bold">›</button><div id="mDots" class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5"></div><div id="mImgCount" class="absolute top-3 right-3 bg-black/60 text-[11px] px-2 py-1 rounded-full">1/1</div></div>
<div class="p-5"><div class="flex justify-between"><h3 id="mName" class="font-bold text-lg flex-1"></h3><button id="mFollowBtn" onclick="toggleFollow()" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">+ Follow</button></div><p id="mCategory" class="text-sm text-gray-400"></p><p id="mPrice" class="font-black text-2xl mt-2"></p><p id="mShop" class="text-sm mt-1 text-gray-400"></p><div class="flex gap-4 mt-3 text-xs text-gray-400"><span id="mLikes"><b class="text-white">0</b> likes</span><span id="mFollowers"><b class="text-white">0</b> followers</span><span id="mRating"><b class="text-white">4.5</b> rating</span><span id="mCommentCount"><b class="text-white">0</b> comments</span></div><a id="mWhatsapp" href="#" target="_blank" class="block mt-4 bg-green-500 text-center py-3.5 rounded-full font-bold">Chat on WhatsApp</a><button onclick="addToCart()" class="block w-full mt-2 bg-white text-black py-3.5 rounded-full font-bold">Add to Cart</button><p class="text-[11px] text-gray-500 mt-2 text-center">👆 Swipe image left/right to see more</p><div class="flex gap-5 mt-5 border-b border-[#333]"><button id="tabComment" class="pb-2 border-b-2 border-white font-bold text-sm" onclick="showTab('comment')">Comments</button><button id="tabRate" class="pb-2 border-b-2 border-transparent text-gray-500 text-sm" onclick="showTab('rate')">Ratings</button></div><div id="commentSection" class="mt-3"><div id="commentList" class="flex flex-col gap-2 max-h-40 overflow-y-auto"></div><div class="flex gap-2 mt-3"><input id="commentInput" placeholder="Write comment..." class="flex-1 bg-[#2a2a2a] p-2.5 rounded-full text-sm border-0"><button onclick="postComment()" class="bg-white text-black w-10 h-10 rounded-full">></button></div></div><div id="rateSection" class="mt-3 hidden"><div class="text-center py-4"><div id="mRatingBig" class="text-4xl font-black">4.5</div><div class="flex justify-center gap-1 mt-3"><button onclick="rateProduct(1)">⭐</button><button onclick="rateProduct(2)">⭐</button><button onclick="rateProduct(3)">⭐</button><button onclick="rateProduct(4)">⭐</button><button onclick="rateProduct(5)">⭐</button></div><button id="likeBtnDetail" onclick="toggleLike()" class="mt-4 bg-[#2a2a2a] px-6 py-2 rounded-full text-sm">Like</button></div></div></div></div></div></div>
<div id="cartModal" class="cart-modal" onclick="if(event.target.id==='cartModal')closeCart()"><div class="bg-[#1e1e1e] rounded-t-[24px] w-full max-w-md mt-auto max-h-[90vh] flex flex-col" onclick="event.stopPropagation()"><div class="flex justify-between p-5 border-b border-[#333]"><h2 class="font-black">Cart - <span id="cartCountTitle">0 items</span></h2><button onclick="closeCart()" class="bg-[#2a2a2a] w-8 h-8 rounded-full">X</button></div><div id="cartItems" class="flex-1 overflow-y-auto p-3 flex flex-col gap-3"></div><div class="p-5 border-t border-[#333] bg-[#121212]"><div class="flex justify-between font-bold text-lg mb-2"><span>Total to Pay:</span><span id="cartTotal" class="text-green-400">GH₵ 0</span></div><button onclick="checkoutWhatsApp()" class="w-full bg-green-500 py-3.5 rounded-full font-bold">Checkout via WhatsApp</button><button onclick="clearCart()" class="w-full mt-2 bg-[#2a2a2a] py-2 rounded-full text-sm">Clear Cart</button></div></div></div>
<div class="bottom-nav"><a href="./index.html" class="flex flex-col items-center text-white"><span>🏠</span><span class="text-[10px]">Home</span></a><a href="#" onclick="window.scrollTo({top:80,behavior:'smooth'})" class="flex flex-col items-center text-gray-400"><span>📂</span><span class="text-[10px]">Category</span></a><a href="./live.html" class="flex flex-col items-center text-gray-400"><span>🔥</span><span class="text-[10px]">Trend</span></a><a href="#" onclick="openCart()" class="flex flex-col items-center relative"><span>🛒</span><span id="cartBadge" class="absolute -top-1 -right-1 bg-red-600 text-[10px] w-4 h-4 rounded-full hidden items-center justify-center">0</span><span class="text-[10px]">Cart</span></a><a href="#" class="flex flex-col items-center text-gray-400"><span>👤</span><span class="text-[10px]">Me</span></a></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBpZzAyVZegord63vYH_zkX2weSv2Ds6BA",authDomain:"dornnysmarket.firebaseapp.com",projectId:"dornnysmarket",storageBucket:"dornnysmarket.firebasestorage.app",messagingSenderId:"726307073658",appId:"1:726307073658:web:957d1225916799d9fa95c3"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);let allProducts=[];let currentP=null;let cart=JSON.parse(localStorage.getItem('dornny_cart')||'[]');
let curImgIdx=0;let curImgs=[];
function ex(p){if(p.likes==null)p.likes=Math.floor(Math.random()*80)+10;if(p.liked==null)p.liked=false;if(p.followers==null)p.followers=Math.floor(Math.random()*300)+20;if(p.following==null)p.following=false;if(p.rating==null)p.rating=(4+Math.random()).toFixed(1);if(!p.comments)p.comments=[];if(p.images&&!Array.isArray(p.images))p.images=[p.images];return p;}
async function load(){try{const snap=await getDocs(collection(db,"products"));allProducts=[];snap.forEach(d=>{allProducts.push(ex({id:d.id,...d.data()}));});if(allProducts.length==0)allProducts=[ex({id:'demo1',name:"Sneakers",category:"Shoes",price:"80",shop:"Daby shop",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",images:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600","https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=600","https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600"],whatsapp:"0550000000"})];const sv=JSON.parse(localStorage.getItem('dornny_extras')||'[]');sv.forEach(x=>{let p=allProducts.find(z=>z.id===x.id);if(p){p.likes=x.likes;p.liked=x.liked;p.followers=x.followers;p.following=x.following;p.rating=x.rating;p.comments=x.comments;}});render(allProducts);}catch(e){document.getElementById('products').innerHTML="<p class='col-span-full text-center py-10'>Error: "+e.message+"</p>";}}
function render(list){const c=document.getElementById('products');if(!list||!list.length){c.innerHTML="<p class='col-span-full text-center py-20 text-gray-400'>No products</p>";return;}c.innerHTML=list.map(p=>`<div class="bg-[#1e1e1e] rounded-2xl overflow-hidden" onclick="openM('${p.id}')"><img src="${p.image}" class="w-full h-40 object-cover"><div class="p-3"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-[11px] text-gray-400 truncate">${p.shop||''} • ${p.category||''}</p><p class="font-black mt-1">GH₵ ${p.price}</p><div class="flex justify-between text-[11px] text-gray-500 mt-1"><span>${p.liked?'❤️':''} ${p.likes}</span><span>💬 ${p.comments.length}</span><span>⭐ ${p.rating}</span></div></div></div>`).join('');}
function showImgs(){const s=document.getElementById('mImageSlider');const d=document.getElementById('mDots');const cnt=document.getElementById('mImgCount');if(!s||!curImgs.length)return;s.innerHTML=curImgs.map(u=>`<img src="${u}" class="w-full h-[380px] object-cover flex-shrink-0" style="min-width:100%">`).join('');d.innerHTML=curImgs.map((_,i)=>`<span class="dot ${i===curImgIdx?'dot-on':'dot-off'}"></span>`).join('');cnt.innerText=(curImgIdx+1)+"/"+curImgs.length;s.style.transform=`translateX(-${curImgIdx*100}%)`;}
window.nextImg=function(){curImgIdx=(curImgIdx+1)%curImgs.length;showImgs();}
window.prevImg=function(){curImgIdx=(curImgIdx-1+curImgs.length)%curImgs.length;showImgs();}
window.openM=function(id){currentP=allProducts.find(x=>x.id===id);if(!currentP)return;document.getElementById('mName').innerText=currentP.name;document.getElementById('mCategory').innerText=currentP.category||'';document.getElementById('mPrice').innerText='GH₵ '+currentP.price;document.getElementById('mShop').innerText=currentP.shop||'';const wa=(currentP.whatsapp||'').toString().replace(/^0/,'');document.getElementById('mWhatsapp').href=`https://wa.me/233${wa}?text=Hi ${encodeURIComponent(currentP.name)}`;upd();rC();curImgs=currentP.images&&currentP.images.length?currentP.images:[currentP.image,currentP.image,currentP.image];curImgIdx=0;showImgs();document.getElementById('modal').classList.add('active');showTab('comment');}
window.openModal=window.openM;
function upd(){document.getElementById('mLikes').innerHTML=`<b class="text-white">${currentP.likes}</b> likes`;document.getElementById('mFollowers').innerHTML=`<b class="text-white">${currentP.followers}</b> followers`;document.getElementById('mRating').innerHTML=`<b class="text-white">${currentP.rating}</b> rating`;document.getElementById('mCommentCount').innerHTML=`<b class="text-white">${currentP.comments.length}</b> comments`;document.getElementById('mRatingBig').innerText=currentP.rating;document.getElementById('mFollowBtn').innerText=currentP.following?'✓ Following':'+ Follow';}
window.closeModal=function(){document.getElementById('modal').classList.remove('active');}
window.toggleLike=function(){currentP.liked=!currentP.liked;currentP.likes+=currentP.liked?1:-1;save();upd();render(allProducts);}
window.toggleFollow=function(){currentP.following=!currentP.following;currentP.followers+=currentP.following?1:-1;save();upd();render(allProducts);}
window.showTab=function(t){if(t==='comment'){document.getElementById('commentSection').classList.remove('hidden');document.getElementById('rateSection').classList.add('hidden');}else{document.getElementById('commentSection').classList.add('hidden');document.getElementById('rateSection').classList.remove('hidden');}}
function rC(){const l=document.getElementById('commentList');if(!currentP.comments.length){l.innerHTML='<p class="text-xs text-gray-500">No comments yet</p>';return;}l.innerHTML=currentP.comments.map(c=>`<div class="bg-[#2a2a2a] p-2 rounded-xl text-xs"><b>${c.user}</b> ${c.text}</div>`).join('');}
window.postComment=function(){const i=document.getElementById('commentInput');if(!i.value.trim())return;currentP.comments.push({user:'You',text:i.value.trim(),time:'now'});i.value='';save();upd();rC();render(allProducts);}
window.rateProduct=function(n){currentP.rating=((parseFloat(currentP.rating)+n)/2).toFixed(1);save();upd();render(allProducts);alert('Rated '+n);}
function save(){localStorage.setItem('dornny_extras',JSON.stringify(allProducts.map(p=>({id:p.id,likes:p.likes,liked:p.liked,followers:p.followers,following:p.following,rating:p.rating,comments:p.comments}))));}
window.addToCart=function(){let e=cart.find(c=>c.id===currentP.id);if(e)e.qty++;else cart.push({id:currentP.id,name:currentP.name,price:parseFloat(currentP.price),image:currentP.image,shop:currentP.shop,qty:1});localStorage.setItem('dornny_cart',JSON.stringify(cart));badge();alert('Added! Total GH₵ '+total());closeModal();openCart();}
function total(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}
function badge(){const q=cart.reduce((s,i)=>s+i.qty,0);const b=document.getElementById('cartBadge');document.getElementById('cartCountTitle').innerText=q+' items';if(q>0){b.innerText=q;b.classList.remove('hidden');b.classList.add('flex');}else{b.classList.add('hidden');}}
window.openCart=function(){document.getElementById('cartModal').classList.add('active');renderCart();}
window.closeCart=function(){document.getElementById('cartModal').classList.remove('active');}
function renderCart(){const con=document.getElementById('cartItems');if(!cart.length){con.innerHTML='<div class="text-center py-16 text-gray-500">Cart empty<br><span class="text-xs">Buyer sees total GH₵ here</span></div>';document.getElementById('cartTotal').innerText='GH₵ 0';return;}con.innerHTML=cart.map(i=>`<div class="flex gap-3 bg-[#2a2a2a] p-3 rounded-2xl"><img src="${i.image}" class="w-14 h-14 rounded-xl object-cover"><div class="flex-1"><p class="text-sm font-bold">${i.name}</p><p class="font-black">GH₵ ${i.price}</p><div class="flex gap-2 mt-2"><button onclick="changeQ('${i.id}',-1)" class="bg-black w-7 h-7 rounded-full">-</button><span>${i.qty}</span><button onclick="changeQ('${i.id}',1)" class="bg-black w-7 h-7 rounded-full">+</button><button onclick="rem('${i.id}')" class="ml-auto">🗑️</button></div></div></div>`).join('');document.getElementById('cartTotal').innerText='GH₵ '+total().toLocaleString();}
window.changeQ=function(id,d){let it=cart.find(c=>c.id===id);if(!it)return;it.qty+=d;if(it.qty<=0)cart=cart.filter(c=>c.id!==id);localStorage.setItem('dornny_cart',JSON.stringify(cart));badge();renderCart();}
window.changeQty=window.changeQ;
window.rem=function(id){cart=cart.filter(c=>c.id!==id);localStorage.setItem('dornny_cart',JSON.stringify(cart));badge();renderCart();}
window.removeItem=window.rem;
window.clearCart=function(){cart=[];localStorage.setItem('dornny_cart',JSON.stringify(cart));badge();renderCart();}
window.checkoutWhatsApp=function(){if(!cart.length)return alert('Cart empty');let t=total();let m=`Hello!%0A`;cart.forEach(i=>{m+=`${i.name} x${i.qty} = GH₵ ${i.price*i.qty}%0A`;});m+=`Total: GH₵ ${t}`;window.open(`https://wa.me/233000000000?text=${m}`,'_blank');}
window.filterCat=function(cat,btn){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('cat-active'));if(btn)btn.classList.add('cat-active');if(!cat)render(allProducts);else render(allProducts.filter(p=>(p.category||'').toLowerCase().includes(cat.toLowerCase())));}
document.getElementById('search').addEventListener('input',e=>{const v=e.target.value.toLowerCase();render(allProducts.filter(p=>p.name.toLowerCase().includes(v)||(p.category||'').toLowerCase().includes(v)));});
let touchStartX=0;const wrap=document.getElementById('imgWrap');if(wrap){wrap.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});wrap.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>50){if(dx<0)nextImg();else prevImg();}},{passive:true});}
load();badge();
</script></body></html>
