<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY MARKET</title><script src="https://js.paystack.co/v1/inline.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#f5f5f5}header{background:#000;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}header h1{letter-spacing:4px;font-size:18px;font-weight:800}header nav{display:flex;gap:14px;font-size:11px;font-weight:700}.hero{background:#000;color:#fff;text-align:center;padding:28px 16px}.hero h2{font-size:28px;font-weight:900}.hero h2 span{color:#FFD700}.hero p{color:#aaa;margin:10px 0 16px;font-size:14px}.btns{display:flex;gap:10px;justify-content:center}.btn{padding:12px 18px;border-radius:10px;font-weight:800;font-size:12px;border:none;cursor:pointer}.btn-y{background:#FFD700;color:#000}.btn-b{background:#111;color:#fff;border:1px solid #333}.ticker{background:#FFD700;color:#000;text-align:center;padding:8px;font-weight:800;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}.card img{width:100%;height:180px;object-fit:cover}.info{padding:8px 10px 10px!important;overflow:visible!important}.info h3{font-size:13px;font-weight:700}.price{font-size:12px!important;font-weight:700!important;display:block!important;margin:3px 0 0!important;padding-left:2px!important;overflow:visible!important;text-align:left!important;color:#111!important;width:100%!important}#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}#modal.show{display:flex}.box{background:#fff;width:320px;max-width:90vw;border-radius:16px;overflow:hidden}.box img{width:100%;height:220px;object-fit:cover}.box .pad{padding:12px}.box h2{font-size:16px}.box .price{font-size:13px!important;margin:6px 0!important}.buy{width:100%;background:#FFD700;border:none;padding:12px;border-radius:10px;font-weight:800;margin-top:10px}#shopModal,#ambModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}#shopModal.show,#ambModal.show{display:flex}.white{background:#fff;width:360px;max-width:90vw;border-radius:16px;padding:16px}.white input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0}</style></head><body><header><h1>D O R N N Y</h1><nav><span>MARKET</span><span>SELL</span><span>AMBASSADOR</span></nav></header><div class="hero"><h2>BUY & SELL ON <span>DORNNY</span></h2><p>Ghana's streetwear marketplace - 50 GHS to open shop</p><div class="btns"><button class="btn btn-y" onclick="openShop()">OPEN SHOP - 50 GHS</button><button class="btn btn-b" onclick="openAmb()">BECOME AMBASSADOR</button></div></div><div class="ticker">FREE DELIVERY ACCRA • 50 GHS SHOP FEE • 15 GHS PER REFERRAL • PAYSTACK SECURE</div><div class="grid" id="grid"></div><div id="modal" onclick="if(event.target==this)closeM()"><div class="box"><img id="mImg"><div class="pad"><h2 id="mName"></h2><p class="price" id="mPrice"></p><p id="mDesc" style="font-size:12px;color:#666;margin-top:4px"></p><button class="buy" id="mBuy">BUY ON WHATSAPP</button><button onclick="closeM()" style="width:100%;background:#eee;border:none;padding:10px;border-radius:10px;margin-top:8px;font-weight:700">Close</button></div></div></div><div id="shopModal" onclick="if(event.target==this)closeShop()"><div class="white"><h3>Open Shop - 50 GHS</h3><p style="font-size:12px;color:#666">Test Mode - No real money yet</p><input id="sn" placeholder="Shop Name"><input id="sp" placeholder="WhatsApp 059..."><input id="se" type="email" placeholder="Email"><button class="btn btn-y" style="width:100%;margin-top:8px" onclick="submitShop()">PAY 50 GHS WITH PAYSTACK</button><button onclick="closeShop()" style="width:100%;background:#eee;border:none;padding:10px;border-radius:8px;margin-top:8px">Cancel</button></div></div><div id="ambModal" onclick="if(event.target==this)closeAmb()"><div class="white"><h3>Ambassador</h3><p style="font-size:12px">Share link, earn 15 GHS per shop</p><input id="ambLink" readonly style="font-size:11px"><button class="btn btn-b" style="width:100%;margin-top:8px" onclick="copyAmb()">COPY LINK</button><button onclick="closeAmb()" style="width:100%;background:#eee;border:none;padding:10px;border-radius:8px;margin-top:8px">Close</button></div></div><script>var PAYSTACK_KEY="pk_test_ff67497ad6c77a992c255aebe97bee4a467d7817";var products=[{id:1,name:"Gray Hoodie",price:180,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400",desc:"Warm hoodie",wa:"233594221108"},{id:2,name:"Pink Joggers",price:120,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400",desc:"Soft joggers",wa:"233594221108"},{id:3,name:"Tee",price:80,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",desc:"Cotton tee",wa:"233594221108"},{id:4,name:"Sneakers",price:250,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",desc:"Running",wa:"233594221108"},{id:5,name:"Bag",price:120,img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400",desc:"Leather bag",wa:"233594221108"},{id:6,name:"Watch",price:200,img:"https://images.unsplash.com/photo-1524805444973-bf35bbb0928e?w=400",desc:"Watch",wa:"233594221108"}];function render(){var g=document.getElementById("grid");g.innerHTML="";products.forEach(function(p){g.innerHTML+='<div class="card" onclick="openM('+p.id+')"><img src="'+p.img+'"><div class="info"><h3>'+p.name+'</h3><p class="price">'+p.price+' GHS</p></div></div>';});}function openM(id){var p=products.find(function(x){return x.id==id});document.getElementById("mImg").src=p.img;document.getElementById("mName").innerText=p.name;document.getElementById("mPrice").innerText=p.price+" GHS";document.getElementById("mDesc").innerText=p.desc;document.getElementById("mBuy").onclick=function(){window.open("https://wa.me/"+p.wa+"?text=I want "+p.name+" "+p.price+" GHS from DORNNY","_blank");};document.getElementById("modal").classList.add("show");}function closeM(){document.getElementById("modal").classList.remove("show");}function openShop(){document.getElementById("shopModal").classList.add("show");}function closeShop(){document.getElementById("shopModal").classList.remove("show");}function openAmb(){var ref=localStorage.getItem("dornny_ref")||"DANNY"+Math.floor(Math.random()*9000+1000);localStorage.setItem("dornny_ref",ref);document.getElementById("ambLink").value=location.origin+location.pathname+"?ref="+ref;document.getElementById("ambModal").classList.add("show");}function closeAmb(){document.getElementById("ambModal").classList.remove("show");}function copyAmb(){var i=document.getElementById("ambLink");i.select();document.execCommand("copy");alert("Link copied!");}function submitShop(){var n=document.getElementById("sn").value.trim(),p=document.getElementById("sp").value.trim(),e=document.getElementById("se").value.trim();if(!n||!p||!e)return alert("Fill all fields");payWithPaystack(e,n,p);}function payWithPaystack(email,shopName,phone){var handler=PaystackPop.setup({key:PAYSTACK_KEY,email:email,amount:5000,currency:"GHS",ref:"DORNNY-"+Date.now(),metadata:{shopName:shopName,phone:phone},onClose:function(){alert("Payment cancelled - Test mode");},callback:function(res){alert("PAYMENT SUCCESS (TEST)! Ref: "+res.reference+" Shop "+shopName+" activated! NOTE: This is TEST - no real money yet. Switch to LIVE key for real 50 GHS!");closeShop();localStorage.setItem("dornny_shop_"+phone,JSON.stringify({name:shopName,ref:res.reference,paid:50}));var ref=new URLSearchParams(location.search).get("ref");if(ref){var k="ref_"+ref;localStorage.setItem(k,parseInt(localStorage.getItem(k)||0)+1);}window.open("https://wa.me/233594221108?text=NEW SHOP PAID TEST! "+shopName+" "+phone+" Ref:"+res.reference,"_blank");}});handler.openIframe();}render();</script></body></html>
