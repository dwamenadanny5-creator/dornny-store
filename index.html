<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DORNNY - Search + Category Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<style>
body{font-family:system-ui;background:#f5f5f5;padding-bottom:80px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:22px;font-size:12px;z-index:99999;display:none;max-width:90%}
.hide::-webkit-scrollbar{display:none}
.cat-active{background:#111!important;color:#fff!important}
.size-active{background:#111!important;color:#fff!important}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="bg-[#111] text-white text-center py-2"><p class="font-black text-[12px]">WELCOME TO DORNNY MARKET</p><p class="text-[9px] text-yellow-400">Search + Category WORKING ✅</p></div>

<div id="loginScreen" class="min-h-[70vh] flex items-center justify-center p-4">
<div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl">
<h2 class="text-[18px] font-black text-center">DORNNY MARKET</h2>
<input id="shopName" placeholder="Shop Name e.g. Danny shop" class="w-full border rounded-full px-4 py-3 text-[13px] mb-2 mt-3">
<input id="phone" placeholder="Phone" class="w-full border rounded-full px-4 py-3 text-[13px] mb-2">
<input id="email" placeholder="Email" class="w-full border rounded-full px-4 py-3 text-[13px] mb-2">
<input id="pass" type="password" placeholder="Password" class="w-full border rounded-full px-4 py-3 text-[13px] mb-3">
<button onclick="doLogin()" class="w-full bg-black text-white py-3 rounded-full font-bold">CONTINUE</button>
</div>
</div>

<div id="mainApp" class="hidden">
<!-- SEARCH BAR - FIXED -->
<div class="sticky top-0 z-30 bg-white p-2.5 flex gap-2 items-center border-b">
<div class="font-black text-[14px]">DORNNY</div>
<div class="flex-1 bg-[#f2f2f2] rounded-full h-[40px] flex items-center px-4 border focus-within:border-black">
<i class="fa-solid fa-search text-gray-500 text-[13px]"></i>
<input id="search" oninput="render()" onkeyup="render()" placeholder="Search club top, men, danny..." class="bg-transparent ml-2 w-full text-[13px] outline-none">
<button id="clearSearch" onclick="clearSearch()" class="hidden w-6 h-6 bg-gray-300 rounded-full text-[10px]">✕</button>
</div>
</div>

<!-- CATEGORY - FIXED -->
<div class="bg-white p-2 border-b sticky top-[50px] z-20">
<div id="catList" class="flex gap-2 overflow-x-auto hide pb-1"></div>
<div class="flex justify-between items-center mt-1">
<p id="catResult" class="text-[11px] font-bold"></p>
<p id="searchResult" class="text-[10px] text-blue-600"></p>
</div>
</div>

<div id="grid" class="p-2 grid grid-cols-2 gap-2"></div>
</div>

<!-- DETAIL -->
<div id="detail" class="fixed inset-0 bg-[#f5f5f5] z-50 hidden overflow-y-auto">
<div class="bg-white">
<div class="relative">
<div class="swiper" id="detailSwiper" style="height:420px"><div class="swiper-wrapper" id="detailImgs"></div><div class="swiper-pagination"></div></div>
<button onclick="closeDetail()" class="absolute top-3 left-3 w-8 h-8 bg-black/50 text-white rounded-full z-10">✕</button>
</div>
<div class="p-3">
<h3 id="dName" class="font-bold text-[18px]"></h3>
<p id="dPrice" class="font-black text-[20px]"></p>
<p id="dSeller" class="text-[12px] text-gray-500"></p>
<p id="dCatShow" class="text-[10px] bg-gray-100 px-2 py-1 rounded-full inline-block mt-1"></p>

<div class="mt-4 bg-[#fafafa] border rounded-xl p-3">
<p class="font-black text-[13px] mb-1">📝 Description</p>
<p id="dDesc" class="text-[12px] leading-5"></p>
</div>

<div class="mt-3 bg-white border-2 border-black rounded-xl p-3">
<p class="font-black text-[13px] mb-2">👕 Choose Size</p>
<div id="sizeList" class="flex flex-wrap gap-2"></div>
<p id="sizeSelected" class="text-[11px] text-gray-500 mt-2"></p>
</div>

<div class="mt-3 bg-white border rounded-xl p-3">
<div class="flex justify-between"><p class="font-black text-[13px]">📦 Quantity</p><p id="dStock" class="text-[11px] bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold"></p></div>
<div class="flex items-center gap-3 mt-3">
<button onclick="changeQty(-1)" class="w-9 h-9 border-2 border-black rounded-full font-bold">-</button>
<span id="qtyNum" class="font-black w-8 text-center">1</span>
<button onclick="changeQty(1)" class="w-9 h-9 border-2 border-black rounded-full font-bold">+</button>
</div>
<p class="font-black text-[13px] mt-4 mb-2">🏪 More from seller - Slide ←→</p>
<div class="swiper" id="shopSwiper" style="height:110px"><div class="swiper-wrapper" id="shopItems"></div></div>
</div>

<div class="flex gap-2 mt-4">
<button id="addBtn" onclick="addCartDetail()" class="flex-1 border-2 border-black py-3.5 rounded-full font-bold text-[12px]">Add to Cart</button>
<button onclick="openCart()" class="flex-1 bg-black text-white py-3.5 rounded-full font-bold text-[12px]">View Cart</button>
</div>
</div>
</div>
</div>

<div id="cartDrawer" class="fixed inset-0 bg-black/50 z-[55] hidden flex justify-end"><div class="bg-white w-[95%] max-w-sm h-full flex flex-col"><div class="p-4 border-b flex justify-between"><b>Cart (<span id="cartCount2">0</span>)</b><button onclick="closeCart()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="cartItems" class="p-3 space-y-3 flex-1 overflow-y-auto"></div><div class="p-4 border-t"><div class="flex justify-between font-black"><span>Total</span><span id="totalPay">GH₵0</span></div><button onclick="checkout()" class="w-full bg-black text-white py-3.5 rounded-full mt-4 font-black">PAY NOW</button></div></div></div>

<div id="mePage" class="fixed inset-0 bg-[#f5f5f5] z-[52] hidden overflow-y-auto pb-[80px]"><div class="bg-black text-white p-5 pt-10 relative"><button onclick="closeMe()" class="absolute top-4 right-4 w-8 h-8 bg-white/20 rounded-full">✕</button><p id="meShop" class="font-bold"></p><p id="meEmail" class="text-[11px] text-gray-300"></p></div><div class="p-3"><div class="bg-white rounded-xl divide-y"><button onclick="openMyProducts()" class="w-full p-3.5 flex justify-between text-[12px]"><span>🛍️ My Products</span><span id="myProdCount">0</span></button><button onclick="openSell()" class="w-full p-3.5 text-[12px] text-left">➕ Upload</button><button onclick="doLogout()" class="w-full p-3.5 text-[12px] text-left text-red-500">Logout</button></div></div></div>

<div id="myProductsPage" class="fixed inset-0 bg-white z-[53] hidden overflow-y-auto"><div class="p-4 border-b flex gap-3 items-center"><button onclick="closeMyProducts()" class="w-8 h-8 bg-gray-100 rounded-full">←</button><b>My Products</b></div><div id="myProductsGrid" class="p-2 grid grid-cols-2 gap-2"></div></div>

<div id="sellScreen" class="fixed inset-0 bg-white z-[60] hidden overflow-y-auto p-4"><div class="flex justify-between"><h2 class="font-black">Upload</h2><button onclick="closeSell()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div>
<div class="mt-4 border-2 border-dashed rounded-xl p-4 text-center"><input type="file" id="galleryFile" accept="image/*" multiple class="hidden" onchange="handleGallery(event)"><button onclick="document.getElementById('galleryFile').click()" class="bg-black text-white px-6 py-3 rounded-full text-[12px] font-bold">📷 Select 3-4 Images</button><div id="previewImgs" class="grid grid-cols-3 gap-2 mt-3"></div></div>
<input id="upName" placeholder="Product name e.g. Club top" class="w-full border rounded-xl px-3 py-3 mt-4 text-[13px]">
<input id="upPrice" type="number" placeholder="Price GH₵" class="w-full border rounded-xl px-3 py-3 mt-2 text-[13px]">
<textarea id="upDesc" placeholder="Description..." class="w-full border rounded-xl px-3 py-3 mt-2 text-[13px] h-20"></textarea>
<div class="mt-3 border rounded-xl p-3"><p class="font-bold text-[12px] mb-2">Sizes</p><div class="flex flex-wrap gap-2"><button type="button" onclick="toggleUpSize(this,'S')" class="upSizeBtn border px-3 py-1.5 rounded-full text-[11px]">S</button><button type="button" onclick="toggleUpSize(this,'M')" class="upSizeBtn border px-3 py-1.5 rounded-full text-[11px]">M</button><button type="button" onclick="toggleUpSize(this,'L')" class="upSizeBtn border px-3 py-1.5 rounded-full text-[11px]">L</button><button type="button" onclick="toggleUpSize(this,'XL')" class="upSizeBtn border px-3 py-1.5 rounded-full text-[11px]">XL</button><button type="button" onclick="toggleUpSize(this,'XXL')" class="upSizeBtn border px-3 py-1.5 rounded-full text-[11px]">XXL</button></div><p id="upSizeSelectedText" class="text-[10px] text-gray-500 mt-2">Selected: None</p></div>
<input id="upStock" type="number" placeholder="Stock" class="w-full border rounded-xl px-3 py-3 mt-3 text-[13px]">
<input id="upWhatsapp" placeholder="WhatsApp" class="w-full border rounded-xl px-3 py-3 mt-2 text-[13px]">
<select id="upCat" class="w-full border rounded-xl px-3 py-3 mt-2 text-[13px]"></select>
<button onclick="uploadProduct()" class="w-full bg-black text-white py-4 rounded-full mt-4 font-black">UPLOAD NOW</button>
</div>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-1.5 z-40">
<button onclick="setCat('All');clearSearch()" class="flex flex-col items-center text-black"><i class="fa-solid fa-house"></i><span class="text-[8px]">Home</span></button>
<button onclick="openSell()" class="flex flex-col items-center text-gray-400"><i class="fa-solid fa-circle-plus"></i><span class="text-[8px]">Sell</span></button>
<button onclick="openMe()" class="flex flex-col items-center text-gray-400"><i class="fa-regular fa-user"></i><span class="text-[8px]">Me</span></button>
<button onclick="openCart()" class="flex flex-col items-center text-gray-400 relative"><i class="fa-solid fa-bag-shopping"></i><span id="cartCount" class="absolute -top-1 -right-1 bg-black text-white text-[7px] w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span><span class="text-[8px]">Cart</span></button>
</nav>

<script>
let categories=["All","Men","Women","Kids","Sneaker","Pet","Toys","Furnitures","Office","Jewelry & Accs","Slippers","Cars","Food & Drinks","Home Decors","Phone & Accs","Second hands","Cosmetics","Bags","Appliances","Sport","Electronics"];
let old1=JSON.parse(localStorage.getItem('dornny_products')||'[]');
let old2=JSON.parse(localStorage.getItem('dornny_products_v2')||'[]');
let products=[...old2,...old1];
if(products.length===0){
products=[{id:1,name:"Club top",price:85,cat:"Men",imgs:["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"],img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600",seller:"Danny shop",desc:"Shiny satin club top PAVTROS brand - for club, gym, street",sizes:["M","L","XL","XXL"],stock:12}];
}
let user=null,cart=[],currentCat="All",currentP=null,uploadedImages=[],selectedSizesUp=[],selectedSizeBuy=null,qtyBuy=1,detailSwiper=null,shopSwiper=null;

function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function doLogin(){let shop=document.getElementById('shopName').value,e=document.getElementById('email').value;if(!shop||!e)return toast('Fill all');user={shop:shop,email:e};localStorage.setItem('dornny_user',JSON.stringify(user));document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');renderCats();render();}
function renderCats(){
let counts={};categories.forEach(c=>counts[c]=0);
products.forEach(p=>{let cat=p.cat||'All';if(counts[cat]!==undefined)counts[cat]++;counts['All']++;});
document.getElementById('catList').innerHTML=categories.map(c=>{
let cnt=c==='All'?products.length:counts[c]||0;
return `<button onclick="setCat('${c}')" class="px-4 py-2 rounded-full text-[11px] border whitespace-nowrap font-bold ${currentCat===c?'cat-active':'bg-[#f2f2f2]'}">${c} (${cnt})</button>`
}).join('');
document.getElementById('upCat').innerHTML=categories.filter(c=>c!=='All').map(c=>`<option value="${c}">${c}</option>`).join('');
}
function setCat(c){currentCat=c;toast('Category: '+c);renderCats();render();}
function clearSearch(){document.getElementById('search').value='';document.getElementById('clearSearch').classList.add('hidden');render();}

// SEARCH + CATEGORY WORK TOGETHER - FIXED
function render(){
let searchText=document.getElementById('search').value.trim().toLowerCase();
let clearBtn=document.getElementById('clearSearch');
if(searchText.length>0) clearBtn.classList.remove('hidden'); else clearBtn.classList.add('hidden');

// 1. Filter by category
let filtered = currentCat==='All'? products : products.filter(p=> (p.cat||'').toLowerCase() === currentCat.toLowerCase());

// 2. Filter by search (name + description + seller + category + sizes)
if(searchText){
filtered = filtered.filter(p=>{
let inName = (p.name||'').toLowerCase().includes(searchText);
let inDesc = (p.desc||'').toLowerCase().includes(searchText);
let inSeller = (p.seller||'').toLowerCase().includes(searchText);
let inCat = (p.cat||'').toLowerCase().includes(searchText);
let inSizes = (p.sizes||[]).join(',').toLowerCase().includes(searchText);
return inName || inDesc || inSeller || inCat || inSizes;
});
document.getElementById('searchResult').innerText = searchText? `Search "${searchText}" - ${filtered.length} found` : '';
} else {
document.getElementById('searchResult').innerText='';
}

document.getElementById('catResult').innerText = `${filtered.length} items in ${currentCat}${searchText? ` for "${searchText}"` : ''}`;

document.getElementById('grid').innerHTML=filtered.map(p=>{
let img=p.imgs&&p.imgs.length>0? p.imgs[0] : p.img;
return `<div onclick="openDetail(${p.id})" class="bg-white rounded-xl overflow-hidden border"><img src="${img}" class="w-full h-[160px] object-cover"><div class="p-2"><p class="text-[11px] font-bold truncate">${p.name}</p><p class="text-[9px] text-gray-500">${p.cat} • ${p.sizes? p.sizes.join(','):''}</p><span class="font-bold text-[13px]">GH₵${p.price}</span></div></div>`
}).join('') || `<div class="col-span-2 text-center p-8 bg-white rounded-xl"><p class="text-[12px]">No results for "${searchText}" in ${currentCat}</p><button onclick="clearSearch();setCat('All')" class="mt-3 bg-black text-white px-4 py-2 rounded-full text-[11px]">Clear Search & Show All</button></div>`;

document.getElementById('cartCount').innerText=cart.length;
document.getElementById('cartCount2').innerText=cart.length;
document.getElementById('totalPay').innerText='GH₵'+cart.reduce((s,p)=>s+p.price*p.qty,0);
document.getElementById('cartItems').innerHTML=cart.map((p,i)=>`<div class="flex gap-2 border-b pb-2 items-center"><img src="${p.imgs? p.imgs[0]:p.img}" class="w-14 h-14 rounded"><div class="flex-1"><p class="text-[11px] font-bold">${p.name}</p><p class="text-[10px]">Size: ${p.selectedSize} • Qty: ${p.qty}</p></div><button onclick="removeCart(${i})" class="text-red-500 text-[11px]">Remove</button></div>`).join('')||'<p class="text-[11px] text-gray-400 p-4 text-center">Cart empty</p>';
let myProds=products.filter(p=>p.seller===user?.shop);
document.getElementById('myProdCount').innerText=myProds.length;
document.getElementById('myProductsGrid').innerHTML=myProds.map(p=>{
let img=p.imgs? p.imgs[0]:p.img;
return `<div onclick="openDetail(${p.id})" class="bg-white rounded-xl overflow-hidden border"><img src="${img}" class="w-full h-[140px] object-cover"><div class="p-2"><p class="text-[11px] font-bold">${p.name}</p><p class="text-[10px]">${p.cat}</p><p class="font-bold text-[12px]">GH₵${p.price}</p></div></div>`
}).join('')||'<p class="text-center text-[11px] p-4">No products</p>';
}

function openDetail(id){
currentP=products.find(p=>p.id===id);qtyBuy=1;selectedSizeBuy=null;
document.getElementById('dName').innerText=currentP.name;
document.getElementById('dPrice').innerText='GH₵'+currentP.price;
document.getElementById('dSeller').innerText=currentP.seller;
document.getElementById('dCatShow').innerText=currentP.cat||'Men';
document.getElementById('dDesc').innerText=currentP.desc||'No description';
document.getElementById('dStock').innerText=currentP.stock+' left';
document.getElementById('qtyNum').innerText='1';
let imgs=currentP.imgs&&currentP.imgs.length>0? currentP.imgs : [currentP.img];
document.getElementById('detailImgs').innerHTML=imgs.map(im=>`<div class="swiper-slide"><div class="swiper-zoom-container"><img src="${im}" class="w-full h-full object-cover"></div></div>`).join('');
let sizes=currentP.sizes&&currentP.sizes.length>0? currentP.sizes : ["M","L","XL","XXL"];
document.getElementById('sizeList').innerHTML=sizes.map(s=>`<button onclick="selectBuySize(this,'${s}')" class="sizeBtn border-2 px-4 py-2 rounded-full text-[12px] font-bold">${s}</button>`).join('');
document.getElementById('sizeSelected').innerText='Tap size: '+sizes.join(', ');
let other=products.filter(p=>p.seller===currentP.seller && p.id!==currentP.id);if(other.length===0) other=products.filter(p=>p.id!==currentP.id).slice(0,6);
document.getElementById('shopItems').innerHTML=other.map(p=>`<div class="swiper-slide" style="width:90px" onclick="openDetail(${p.id})"><img src="${p.imgs? p.imgs[0]:p.img}" class="w-full h-[90px] object-cover rounded-xl border"></div>`).join('');
document.getElementById('detail').style.display='block';
setTimeout(()=>{
if(detailSwiper) detailSwiper.destroy();
detailSwiper=new Swiper('#detailSwiper',{zoom:true,pagination:{el:'.swiper-pagination',clickable:true}});
if(shopSwiper) shopSwiper.destroy();
shopSwiper=new Swiper('#shopSwiper',{slidesPerView:'auto',spaceBetween:8});
},100);
}
function closeDetail(){document.getElementById('detail').style.display='none';}
function selectBuySize(btn,size){document.querySelectorAll('.sizeBtn').forEach(b=>b.classList.remove('size-active'));btn.classList.add('size-active');selectedSizeBuy=size;document.getElementById('sizeSelected').innerText='Selected size: '+size;document.getElementById('addBtn').innerText='Add to Cart - Size '+size;}
function changeQty(d){qtyBuy+=d;if(qtyBuy<1)qtyBuy=1;if(qtyBuy>currentP.stock)qtyBuy=currentP.stock;document.getElementById('qtyNum').innerText=qtyBuy;}
function addCartDetail(){if(!selectedSizeBuy){toast('Please choose size first');return;}cart.push({...currentP,selectedSize:selectedSizeBuy,qty:qtyBuy});toast('Added Size '+selectedSizeBuy+' Qty '+qtyBuy);render();}
function removeCart(i){cart.splice(i,1);render();}
function openCart(){document.getElementById('cartDrawer').style.display='flex';render();}
function closeCart(){document.getElementById('cartDrawer').style.display='none';}
function checkout(){let total=cart.reduce((s,p)=>s+p.price*p.qty,0);if(!total)return toast('Cart empty');toast('✅ Paid GH₵'+total);cart=[];closeCart();render();}
function openMe(){document.getElementById('mePage').style.display='block';document.getElementById('meShop').innerText=user?.shop||'My Shop';document.getElementById('meEmail').innerText=user?.email||'';render();}
function closeMe(){document.getElementById('mePage').style.display='none';}
function openMyProducts(){document.getElementById('myProductsPage').style.display='block';render();}
function closeMyProducts(){document.getElementById('myProductsPage').style.display='none';}
function toggleUpSize(btn,size){btn.classList.toggle('size-active');if(selectedSizesUp.includes(size)){selectedSizesUp=selectedSizesUp.filter(s=>s!==size);}else{selectedSizesUp.push(size);}document.getElementById('upSizeSelectedText').innerText='Selected: '+(selectedSizesUp.join(', ')||'None');}
function handleGallery(e){let files=e.target.files;uploadedImages=[];document.getElementById('previewImgs').innerHTML='';for(let file of files){let reader=new FileReader();reader.onload=function(ev){uploadedImages.push(ev.target.result);document.getElementById('previewImgs').innerHTML+=`<div><img src="${ev.target.result}" class="w-full h-20 object-cover rounded"></div>`;};reader.readAsDataURL(file);}toast(files.length+' images selected');}
function doLogout(){localStorage.removeItem('dornny_user');location.reload();}
function openSell(){document.getElementById('sellScreen').style.display='block';}
function closeSell(){document.getElementById('sellScreen').style.display='none';}
function uploadProduct(){
let n=document.getElementById('upName').value,pr=parseInt(document.getElementById('upPrice').value),wa=document.getElementById('upWhatsapp').value,ca=document.getElementById('upCat').value,desc=document.getElementById('upDesc').value,stock=parseInt(document.getElementById('upStock').value)||10;
if(!n||!pr||!wa)return toast('Fill name, price, WhatsApp');
if(uploadedImages.length===0)return toast('Select 3-4 images');
if(selectedSizesUp.length===0)return toast('Select sizes');
let prod={id:Date.now(),name:n,price:pr,cat:ca,imgs:uploadedImages,img:uploadedImages[0],seller:user.shop,whatsapp:wa,desc:desc,sizes:selectedSizesUp,stock:stock};
products.unshift(prod);
localStorage.setItem('dornny_products_v2',JSON.stringify(products));
localStorage.setItem('dornny_products',JSON.stringify(products));
toast('✅ Uploaded to '+ca+' - Searchable now!');
renderCats();render();closeSell();
}
(function(){let s=localStorage.getItem('dornny_user');if(s){user=JSON.parse(s);document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');}renderCats();render();})();
</script>
</body>
</html>
