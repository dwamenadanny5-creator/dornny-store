<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORNNY LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding-bottom:90px}
header{padding:12px;background:#111;display:flex;justify-content:space-between;position:sticky;top:0}
button{cursor:pointer}
.cat{display:flex;gap:6px;overflow:auto;padding:8px 10px}
.cat button{background:#1a1a1a;color:#aaa;border:1px solid #222;padding:7px 12px;border-radius:20px;font-size:11px}
.cat button.a{background:#fff;color:#000}
#products{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.p{background:#111;border-radius:12px;overflow:hidden;border:1px solid #1a1a1a}
.p img{width:100%;height:150px;object-fit:cover}
.badge{position:absolute;top:6px;left:6px;background:gold;color:#000;font-size:9px;padding:2px 5px;border-radius:4px}
.live{position:absolute;top:6px;right:6px;background:red;color:#fff;font-size:9px;padding:2px 5px;border-radius:4px}
.trend{background:#0a0a0a;padding:10px;margin:10px;border-radius:12px;display:flex;gap:10px;overflow:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #222}
nav a{color:#666;text-decoration:none;font-size:10px}
nav a.a{color:#fff}
.btn{background:#fff;color:#000;border:none;padding:8px;border-radius:8px;font-weight:bold;width:100%;margin-top:5px}
#me,#live,#trendPage,#cartM{display:none;padding:12px}
video{width:100%;height:220px;background:#000;border-radius:12px}
</style>
</head>
<body>
<header><b>DORNNY LIVE</b><span><span id="cc">0</span> <button onclick="show('live')" style="background:red;color:#fff;border:none;padding:5px 9px;border-radius:12px">LIVE</button></span></header>
<input id="s" placeholder="Search..." oninput="search(this.value)" style="width:calc(100% - 20px);margin:8px 10px;padding:10px;border-radius:10px;border:none;background:#1a1a1a;color:#fff">
<div class="cat" id="cat"></div>
<div id="home"><div class="trend" id="tr"></div><div style="padding:10px"><b>LIVE Sellers</b><div id="lv"></div></div><section id="products"></section></div>
<div id="live"><h3>LIVE Studio</h3><video id="v" autoplay muted playsinline></video><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" style="background:red;color:#fff" onclick="goLive()">Start Live</button><button class="btn" style="background:#333;color:#fff" onclick="stopLive()">End</button></div><input id="lt" placeholder="Title" style="width:100%;padding:9px;margin-top:8px;background:#222;border:none;color:#fff;border-radius:8px"><div id="lc" style="background:#111;padding:8px;border-radius:8px;margin-top:8px;max-height:100px;overflow:auto"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="ci" placeholder="Comment..." style="flex:1;padding:8px;background:#222;border:none;color:#fff;border-radius:8px"><button onclick="sendC()">Send</button></div></div>
<div id="trendPage"><h3>TRENDING</h3><div id="tp"></div></div>
<div id="cartM"><h3>Cart</h3><div id="cartI"></div><div><b>Total: GHS <span id="ct">0</span></b><button class="btn" style="background:#25D366;color:#fff" onclick="wa()">Checkout WhatsApp</button></div></div>
<div id="me"><h3>My Account</h3><div style="background:#111;padding:12px;border-radius:12px"><button class="btn">Login</button><p>Follow: <span id="fc">0</span> Likes: <span id="lc2">0</span></p></div></div>
<nav><a onclick="show('home')" class="a">Home</a><a onclick="show('live')">Live</a><a onclick="show('trendPage')">Trend</a><a onclick="show('cartM')">Cart</a><a onclick="show('me')">Me</a></nav>
<script>
cats=["All","Men","Women","Kids","Pet","Office","Furnitures","Jewery & Acc","Shoes","Home Used","Cars","Appliances","Electronics","Bags","Toys","Lingeries & Sleep","Sport"];
prods=[{id:1,n:"Men Sneakers",p:280,c:"Shoes",im:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"],l:120,vw:890,s:"Kwame Shoes"},{id:2,n:"Women Ankara Dress",p:150,c:"Women",im:["https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"],l:200,vw:1200,s:"Ama Fashion",top:1},{id:3,n:"Kids Toy Car",p:90,c:"Toys",im:["https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=400"],l:80,vw:400,s:"Kids World"}];
let cart=[],liked=[],followed=[],liveS=[{n:"Kwame Shoes",t:"Latest sneakers!",vw:45},{n:"Ama Fashion",t:"New Ankara!",vw:120}];
function init(){let cb=document.getElementById('cat');cats.forEach((c,i)=>cb.innerHTML+=`<button onclick="fil('${c}',this)" class="${i==0?'a':''}">${c}</button>`);render(prods);trend();live();badge();}
function render(list){let co=document.getElementById('products');co.innerHTML='';list.forEach(pr=>{co.innerHTML+=`<div class="p" style="position:relative"><div style="position:relative" onclick="nextImg(this)"><img src="${pr.im[0]}" data-im="${pr.im.join('|')}" data-i="0"><div class="badge" style="display:${pr.top?'block':'none'}">TOP</div><div class="live">LIVE</div></div><div class="i"><small>${pr.s}</small><p>${pr.n}</p><b>GHS ${pr.p}</b><button class="btn" onclick="add(${pr.id})">Add Cart</button><div><span onclick="like(${pr.id})">❤️ ${pr.l}</span> <span onclick="follow('${pr.s}')">Follow</span></div></div></div>`;});}
function nextImg(d){let im=d.querySelector('img'),a=im.dataset.im.split('|'),i=(+im.dataset.i+1)%a.length;im.dataset.i=i;im.src=a[i];}
function trend(){let so=[...prods].sort((a,b)=>b.vw-a.vw).slice(0,6),tr=document.getElementById('tr');tr.innerHTML='';so.forEach(p=>{tr.innerHTML+=`<div><img src="${p.im[0]}" style="width:60px;height:60px;border-radius:50%"><p>${p.n.slice(0,10)}</p></div>`;});}
function live(){let lv=document.getElementById('lv');lv.innerHTML='';liveS.forEach(s=>{lv.innerHTML+=`<div style="background:#111;padding:10px;border-radius:12px;margin:6px 0"><b>${s.n}</b> - ${s.t} <button onclick="show('live')">Join</button></div>`;});}
function fil(c,btn){if(btn){document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('a'));btn.classList.add('a');}if(c=='All')render(prods);else render(prods.filter(p=>p.c==c));}
function search(q){if(!q)return render(prods);render(prods.filter(p=>p.n.toLowerCase().includes(q.toLowerCase())));}
function add(id){let pr=prods.find(p=>p.id==id),f=cart.find(c=>c.id==id);if(f)f.q++;else cart.push({...pr,q:1});badge();}
function badge(){document.getElementById('cc').textContent=cart.reduce((a,b)=>a+b.q,0);let ci=document.getElementById('cartI'),tot=0;ci.innerHTML='';cart.forEach(it=>{tot+=it.p*it.q;ci.innerHTML+=`<div>${it.n} x${it.q} = ${it.p*it.q} <button onclick="rem(${it.id})">X</button></div>`;});document.getElementById('ct').textContent=tot;}
function rem(id){cart=cart.filter(c=>c.id!=id);badge();}
function like(id){liked.includes(id)?liked=liked.filter(x=>x!=id):liked.push(id);}
function follow(n){followed.includes(n)?followed=followed.filter(x=>x!=n):followed.push(n);alert('Followed '+n);}
function wa(){let m='Hello Dornny order:%0A';cart.forEach(i=>m+=`- ${i.n} x${i.q}=GHS ${i.p*i.q}%0A`);window.open('https://wa.me/233599789304?text='+m,'_blank');}
function show(id){['home','live','trendPage','me','cartM'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display='block';}
let st=null;async function goLive(){try{st=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('v').srcObject=st;}catch(e){alert(e.message);}}
function stopLive(){if(st)st.getTracks().forEach(t=>t.stop());}
function sendC(){let i=document.getElementById('ci'),b=document.getElementById('lc');if(!i.value)return;b.innerHTML+=`<div>You: ${i.value}</div>`;i.value='';}
init();
</script>
</body>
</html>
