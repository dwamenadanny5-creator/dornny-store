<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dornny's Market - Ghana's Marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-black text-white p-4 sticky top-0 z-10 flex justify-between items-center">
<h1 class="font-bold text-xl">DORNNY'S MARKET</h1>
<a href="/sell.html" class="bg-white text-black px-4 py-2 rounded-full text-sm font-bold">+ Sell</a>
</header>
<div class="p-4">
<input id="search" placeholder="Search shoes, phones, clothes..." class="w-full p-3 rounded-full border shadow-sm">
</div>
<div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3 p-3">
<p class="col-span-full text-center py-10">Loading products...</p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBpZzAyVZegord63vYH_zkX2weSv2Ds6BA",
  authDomain: "dornnysmarket.firebaseapp.com",
  projectId: "dornnysmarket",
  storageBucket: "dornnysmarket.firebasestorage.app",
  messagingSenderId: "726307073658",
  appId: "1:726307073658:web:957d1225916799d9fa95c3",
  measurementId: "G-WYVEH8VG5V"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allProducts = [];
async function loadProducts(){
  const q = query(collection(db, "products"), orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  allProducts = [];
  snap.forEach(doc=>{ allProducts.push({id:doc.id, ...doc.data()}); });
  render(allProducts);
}
function render(list){
  const container = document.getElementById('products');
  if(list.length==0){ container.innerHTML="<p class='col-span-full text-center py-10'>No products yet. Be first to sell!</p>"; return; }
  container.innerHTML = list.map(p=>`
    <div class="bg-white rounded-xl overflow-hidden shadow-sm border">
      <img src="${p.image}" class="w-full h-36 object-cover">
      <div class="p-3">
        <h3 class="font-bold text-sm truncate">${p.name}</h3>
        <p class="text-xs text-gray-500 truncate">${p.category||''}</p>
        <p class="font-bold mt-1">GHS ${p.price}</p>
        <a href="https://wa.me/233${p.whatsapp.replace(/^0/,'')}?text=Hi, I'm interested in ${encodeURIComponent(p.name)} on Dornny's Market" target="_blank" class="block mt-2 bg-green-500 text-white text-center py-2 rounded-full text-xs font-bold">Chat Seller on WhatsApp</a>
      </div>
    </div>
  `).join('');
}
document.getElementById('search').addEventListener('input', e=>{
  const val = e.target.value.toLowerCase();
  const filtered = allProducts.filter(p=> p.name.toLowerCase().includes(val) || (p.category||'').toLowerCase().includes(val));
  render(filtered);
});
loadProducts();
</script>
</body>
</html>
