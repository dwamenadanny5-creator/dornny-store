<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dornny Store - 15 GHS Referral</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#f5f5f7;padding-bottom:70px}
.top{display:flex;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.top input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}
.page{display:none;padding:12px}.page.on{display:block}
.card{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{background:#000;color:#fff;border:none;padding:10px 16px;border-radius:8px;width:100%;margin-top:6px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee}
.nav div{padding:6px 12px;border-radius:20px}.nav.on{background:#000;color:#fff}
.badge{background:red;color:#fff;border-radius:50%;padding:2px 6px;font-size:10px;margin-left:4px}
.ref-box{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.ref-code{font-size:22px;font-weight:bold;letter-spacing:2px;background:rgba(255,255,255,.2);padding:8px;border-radius:8px;text-align:center;margin:10px 0}
</style>
</head>
<body>
<div class="top"><input id="q" placeholder="Search products..."><button onclick="doSearch()">Search</button></div>
<div id="p-shop" class="page on">
<div class="ref-box">
<h3>🎉 Earn 15 GHS per referral!</h3>
<p>Your code: <span id="myCode">----</span></p>
<p>Referred: <span id="refCount">0</span> | Earned: <span id="refEarn">0 GHS</span></p>
<button onclick="shareRef()" style="background:#fff;color:#667eea;padding:8px 12px;border:none;border-radius:8px;margin-top:8px">Share My Link</button>
<div style="margin-top:10px"><input id="applyRef" placeholder="Have referral code?"><button onclick="applyReferral()">Apply</button></div>
</div>
<div id="shopGrid"></div>
</div>
<div id="p-category" class="page"><h2>Categories</h2><div id="catGrid"></div></div>
<div id="p-cart" class="page"><h2>Cart</h2><div id="cartGrid"></div><button class="btn" onclick="checkout()">Checkout</button></div>
<div id="p-me" class="page">
<div class="card"><h3>My Account</h3><p id="meCode"></p><p id="meStats"></p><input id="meRefInput" placeholder="Enter friend code"><button class="btn" onclick="applyReferral()">Apply</button></div>
<div class="card"><h3>Withdraw</h3><p>Balance: <span id="bal">0 GHS</span></p><button class="btn" onclick="withdraw()">Request Withdrawal</button></div>
</div>
<div class="nav">
<div id="n-shop" class="on" onclick="showPage('p-shop','n-shop')">Shop</div>
<div id="n-cat" onclick="showPage('p-category','n-cat')">Category</div>
<div id="n-cart" onclick="showPage('p-cart','n-cart')">Cart <span id="cartBadge" class="badge" style="display:none">0</span></div>
<div id="n-me" onclick="showPage('p-me','n-me')">Me</div>
</div>
<script>
var prods=[{name:"Wireless Earbuds",price:120,cat:"Electronics"},{name:"Sneakers Red",price:250,cat:"Fashion"},{name:"Phone Case",price:45,cat:"Accessories"},{name:"Smart Watch",price:300,cat:"Electronics"}];
var cart=JSON.parse(localStorage.getItem("cart")||"[]");
var myRef=localStorage.getItem("myRefCode");
if(!myRef){myRef="DORN"+Math.floor(1000+Math.random()*9000); localStorage.setItem("myRefCode",myRef);}
var refData=JSON.parse(localStorage.getItem("refData")||'{"count":0,"earned":0,"used":false,"referredBy":null}');
function showPage(p,n){
document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));
document.getElementById(p).classList.add('on');
document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('on'));
document.getElementById(n).classList.add('on');
if(p=='p-shop') buildShop();
if(p=='p-cart') buildCart();
if(p=='p-me') buildMe();
}
function buildShop(list){
var arr=list||prods;
var g=document.getElementById('shopGrid'); g.innerHTML="";
arr.forEach((pr,i)=>{g.innerHTML+='<div class="card"><h4>'+pr.name+'</h4><p>'+pr.price+' GHS - '+pr.cat+'</p><button class="btn" onclick="addCart('+i+')">Add to Cart</button></div>';});
document.getElementById('myCode').innerText=myRef;
document.getElementById('refCount').innerText=refData.count;
document.getElementById('refEarn').innerText=refData.earned+" GHS";
}
function buildMe(){
document.getElementById('meCode').innerText="Your code: "+myRef;
document.getElementById('meStats').innerText="Referred "+refData.count+" friends, Earned "+refData.earned+" GHS";
document.getElementById('bal').innerText=refData.earned+" GHS";
}
function addCart(i){cart.push(prods[i]); localStorage.setItem("cart",JSON.stringify(cart)); updateBadge(); alert("Added");}
function updateBadge(){var b=document.getElementById('cartBadge'); if(cart.length>0){b.style.display="inline"; b.innerText=cart.length}else b.style.display="none";}
function buildCart(){
var g=document.getElementById('cartGrid'); if(cart.length==0){g.innerHTML="<p>Cart empty</p>";return;}
g.innerHTML=""; var total=0;
cart.forEach((pr,idx)=>{total+=pr.price; g.innerHTML+='<div class="card">'+pr.name+' - '+pr.price+' GHS <button onclick="remCart('+idx+')">Remove</button></div>';});
if(refData.referredBy){g.innerHTML+='<div class="card">Referral Discount: -5 GHS</div>'; total=Math.max(0,total-5);}
g.innerHTML+='<div class="card"><b>Total: '+total+' GHS</b></div>';
}
function remCart(i){cart.splice(i,1); localStorage.setItem("cart",JSON.stringify(cart)); buildCart(); updateBadge();}
function checkout(){
if(cart.length==0)return alert("Cart empty");
if(refData.referredBy &&!refData.firstOrderDone){
var allRefs=JSON.parse(localStorage.getItem("allReferrals")||"{}");
var code=refData.referredBy; if(!allRefs[code]) allRefs[code]={count:0,earned:0};
allRefs[code].count+=1; allRefs[code].earned+=15;
localStorage.setItem("allReferrals",JSON.stringify(allRefs));
if(code==myRef){refData.count=allRefs[code].count; refData.earned=allRefs[code].earned;}
refData.firstOrderDone=true; localStorage.setItem("refData",JSON.stringify(refData));
alert("Referrer "+code+" earned 15 GHS!");
}
alert("Order placed!"); cart=[]; localStorage.setItem("cart",JSON.stringify(cart)); buildCart(); updateBadge();
}
function applyReferral(){
var input=document.getElementById('applyRef')||document.getElementById('meRefInput');
var code=(input?input.value:"").trim().toUpperCase(); if(!code) return alert("Enter code");
if(code==myRef) return alert("Cannot use own code"); if(refData.referredBy) return alert("Already used: "+refData.referredBy);
refData.referredBy=code; localStorage.setItem("refData",JSON.stringify(refData));
alert("Applied! Code "+code+" - You get 5 GHS off, friend gets 15 GHS after your order!"); buildCart();
}
function shareRef(){
var link=location.origin+location.pathname+"?ref="+myRef;
if(navigator.share){navigator.share({title:"Join Dornny Store",text:"Use my code "+myRef+" ",url:link})}
else{prompt("Share this link:",link+" Code: "+myRef)}
}
function withdraw(){if(refData.earned<50) return alert("Min 50 GHS. You have "+refData.earned); alert("Withdrawal "+refData.earned+" GHS sent! MoMo soon.");}
function doSearch(){var q=document.getElementById('q').value.toLowerCase(); var f=prods.filter(p=>p.name.toLowerCase().includes(q)); buildShop(f);}
var urlParams=new URLSearchParams(location.search); var refParam=urlParams.get('ref');
if(refParam &&!refData.referredBy && refParam!=myRef){refData.referredBy=refParam.toUpperCase(); localStorage.setItem("refData",JSON.stringify(refData)); setTimeout(()=>alert("Referred by "+refParam+" - 5 GHS discount!"),500);}
buildShop(); updateBadge();
var all=JSON.parse(localStorage.getItem("allReferrals")||"{}"); if(all[myRef]){refData.count=all[myRef].count; refData.earned=all[myRef].earned; localStorage.setItem("refData",JSON.stringify(refData));}
</script>
</body>
</html>
