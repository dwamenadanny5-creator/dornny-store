<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#f5f5f5;padding-bottom:130px}.top{background:#fff;padding:10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10}.top input{flex:1;background:#f2f2f2;border:0;border-radius:20px;padding:10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#ddd}.card{background:#fff;cursor:pointer}.card img{width:100%;height:230px;object-fit:cover;display:block}.card.t{padding:8px;font-size:11px;background:#fff}.card.t b{display:block}.open{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#FFD700;padding:14px 30px;border-radius:30px;font-weight:900;border:0;z-index:20;box-shadow:0 4px 10px rgba(0,0,0,.2)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:30}.nav div{text-align:center;font-size:9px;color:#888;cursor:pointer}.nav div.on{color:#000;font-weight:900}.page{display:none}.page.on{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal.on{display:flex}.box{background:#fff;width:100%;max-width:360px;border-radius:14px;overflow:hidden;max-height:90vh;overflow:auto}.btn{width:92%;margin:6px 4%;padding:12px;border:0;border-radius:10px;font-weight:900}.y{background:#FFD700}.bk{background:#111;color:#fff}.in{width:92%;margin:6px 4%;padding:12px;border:1px solid #ddd;border-radius:10px}.star{font-size:22px;cursor:pointer;color:#ddd}.star.on{color:gold}.msg{padding:8px 10px;border-radius:10px;margin:4px 0;max-width:80%;font-size:12px}.msg.me{background:#FFD700;margin-left:auto}.msg.other{background:#fff;border:1px solid #eee}</style></head><body>
<div class="top"><span>✉️</span><input id="q" placeholder="Search Jeans, Shoes, Sneakers..." oninput="search()"><span style="background:#111;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center" onclick="search()">⌕</span><span onclick="tab('msgs')">💬<span id="msgDot" style="background:red;color:#fff;border-radius:50%;padding:1px 4px;font-size:8px;display:none">0</span></span></div>

<div id="p-shop" class="page on"><div class="grid" id="grid"></div></div>
<div id="p-category" class="page"><div style="background:#fff;padding:12px"><h3>Shops & Ratings ⭐</h3><div id="olist"></div><button class="btn y" onclick="openShop()">OPEN SHOP - 50 GHS</button></div></div>
<div id="p-trends" class="page"><div style="background:#fff;padding:12px"><h3>Top Rated Sellers ⭐</h3><div id="tgrid"></div></div></div>
<div id="p-cart" class="page"><div style="background:#fff;padding:12px"><h3>Cart (<span id="cn">0</span>)</h3><div id="clist"></div></div></div>
<div id="p-msgs" class="page"><div style="background:#fff;padding:12px"><h3>Messages 💬</h3><div id="chatList"></div><div id="chatBox" style="display:none"><div style="height:300px;overflow:auto;background:#f9f9f9;padding:10px;border-radius:10px" id="msgs"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="msgInput" class="in" style="flex:1;margin:0" placeholder="Type message..."><button class="btn bk" style="width:60px;margin:0" onclick="sendMsg()">Send</button></div><div style="font-size:10px;color:#888;margin-top:4px">✉️ Email notification sent to seller</div></div></div></div>
<div id="p-me" class="page"><div style="background:#fff;padding:12px"><h3 id="meT">My Shop</h3><div id="meBox"></div><div id="myProds"></div></div></div>

<button class="open" onclick="openShop()">OPEN SHOP - 50 GHS</button>

<div class="nav"><div id="n-shop" class="on" onclick="tab('shop')">🏪<br>Shop</div><div id="n-category" onclick="tab('category')">☰<br>Shops</div><div id="n-trends" onclick="tab('trends')">⭐<br>Rated</div><div id="n-cart" onclick="tab('cart')">🛒<br>Cart</div><div id="n-me" onclick="tab('me')">👤<br>Me</div></div>

<div id="mProd" class="modal" onclick="if(event.target==this)closeProd()"><div class="box"><img id="mi" style="width:100%;height:360px;object-fit:cover"><div style="padding:12px"><h3 id="mn"></h3><p id="mp" style="font-weight:900;font-size:18px;margin:6px 0"></p><div id="rating" style="margin:6px 0"></div><p id="ms" style="font-size:11px;background:#f5f5f5;padding:8px;border-radius:8px"></p><button class="btn bk" onclick="addCart()">ADD TO CART</button><button class="btn y" onclick="openChat()">💬 MESSAGE SELLER</button><button class="btn" style="background:#25D366;color:#fff" onclick="buyWA()">BUY WHATSAPP</button><div style="border-top:1px solid #eee;margin-top:10px;padding-top:8px"><p style="font-size:11px;font-weight:900">Rate this seller:</p><div id="rateStars"><span class="star" onclick="rate(1)">★</span><span class="star" onclick="rate(2)">★</span><span class="star" onclick="rate(3)">★</span><span class="star" onclick="rate(4)">★</span><span class="star" onclick="rate(5)">★</span></div></div><button class="btn" style="background:#eee" onclick="closeProd()">Close</button></div></div></div>

<div id="mShop" class="modal"><div class="box" style="padding:15px"><h3>Open Shop - 50 GHS</h3><p style="font-size:11px;color:#666">You will get email notification</p><input id="oname" class="in" placeholder="Full Name"><input id="oshop" class="in" placeholder="Shop Name"><input id="oemail" class="in" placeholder="Your Email for notifications"><input id="ophone" class="in" placeholder="WhatsApp 059..."><input id="oloc" class="in" placeholder="Location - Accra"><button class="btn y" onclick="regShop()">PAY 50 GHS & OPEN SHOP</button><button class="btn" style="background:#eee" onclick="closeShop()">Cancel</button></div></div>

<div id="mAdd" class="modal"><div class="box" style="padding:15px"><h3>Add Product - Real Photo</h3><input id="aname" class="in" placeholder="Name"><input id="aprice" class="in" type="number" placeholder="Price GH₵"><label style="display:block;width:92%;margin:10px 4%;padding:18px;border:3px dashed gold;border-radius:12px;text-align:center;background:#fffbe6;font-weight:900">📷 TAP TO ADD REAL PHOTO<input id="afile" type="file" accept="image/*" style="display:none" onchange="preview(this)"></label><img id="aprev" style="width:92%;margin:0 4%;height:200px;object-fit:cover;border-radius:10px;display:none"><button class="btn y" onclick="addProd()">ADD TO SHOP - NOTIFY USERS</button><button class="btn" style="background:#eee" onclick="closeAdd()">Cancel</button></div></div>

<script>
emailjs.init("YOUR_PUBLIC_KEY");
var def=[
{name:"Nike Air Sneakers Red",price:350,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop",shop:"Sneaker Hub",owner:"Dornny",phone:"0594221108",email:"dornny@gmail.com",rating:4.8,rates:12},
{name:"Baggy Jeans Street",price:150,img:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400&h=400&fit=crop",shop:"Jeans Store",owner:"Dornny",phone:"0594221108",email:"dornny@gmail.com",rating:4.5,rates:8},
{name:"Airmax Sneakers White",price:300,img:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400&h=400&fit=crop",shop:"Sneaker Hub",owner:"Dornny",phone:"0594221108",email:"dornny@gmail.com",rating:4.9,rates:20},
{name:"T-shirt Black Cotton",price:80,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=400&fit=crop",shop:"Dornny Wear",owner:"Dornny",phone:"0594221108",email:"dornny@gmail.com",rating:4.6,rates:15},
{name:"Leather Shoes Brown",price:320,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop",shop:"Dornny Shoes",owner:"Dornny",phone:"0594221108",email:"dornny@gmail.com",rating:5,rates:6},
{name:"Pink Joggers 120 GHS",price:120,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=400&h=400&fit=crop",shop:"Dornny Wear",owner:"Dornny",phone:"0594221108",email:"dornny@gmail.com",rating:4.7,rates:10}
];
var my=JSON.parse(localStorage.getItem("dornny_my")||"[]");
var owners=JSON.parse(localStorage.getItem("dornny_owners")||"[]");
var curOwner=JSON.parse(localStorage.getItem("dornny_cur")||"null");
var msgs=JSON.parse(localStorage.getItem("dornny_msgs")||"[]");
var ratings=JSON.parse(localStorage.getItem("dornny_ratings")||"[]");
var all=def.concat(my);
var cart=[];var cur=null;var tmpImg="";var chatShop=null;
function build(){all.forEach(function(it,i){it.id=i;});draw(all);drawTopRated();drawOwners();drawMe();drawChatList();updateMsgDot();}
function draw(list){var g=document.getElementById("grid");g.innerHTML="";list.forEach(function(it){g.innerHTML+='<div class="card" onclick="openProd('+it.id+')"><img src="'+it.img+'"><div class="t"><b>'+it.name+'</b><span>GH₵'+it.price+'</span> <span style="font-size:10px;color:gold">★'+(it.rating||5)+'</span></div></div>';});}
function drawTopRated(){var t=document.getElementById("tgrid");t.innerHTML="";var sorted=[...all].sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,4);sorted.forEach(function(it){t.innerHTML+='<div style="background:#fff;padding:10px;border-radius:10px;margin:6px 0;border:1px solid #eee;display:flex;gap:10px" onclick="openProd('+it.id+')"><img src="'+it.img+'" style="width:60px;height:60px;border-radius:8px"><div><b>'+it.name+'</b><br>⭐ '+it.rating+' ('+it.rates+' rates)<br>GH₵'+it.price+'</div></div>';});}
function tab(n){document.querySelectorAll(".page").forEach(function(p){p.classList.remove("on")});document.querySelectorAll(".nav div").forEach(function(d){d.classList.remove("on")});document.getElementById("p-"+n).classList.add("on");document.getElementById("n-"+n).classList.add("on");}
function search(){var q=document.getElementById("q").value.toUpperCase();if(!q){draw(all);return;}draw(all.filter(function(x){return x.name.toUpperCase().indexOf(q)>=0;}));}
function openProd(id){cur=all.find(function(x){return x.id==id;});document.getElementById("mi").src=cur.img;document.getElementById("mn").innerText=cur.name;document.getElementById("mp").innerText="GH₵"+cur.price;document.getElementById("ms").innerHTML="🏪 "+cur.shop+"<br>👤 "+cur.owner+"<br>📱 "+cur.phone+"<br>⭐ "+cur.rating+" ("+cur.rates+" ratings)";document.getElementById("rating").innerHTML="⭐ "+cur.rating+" - "+cur.shop;document.getElementById("mProd").classList.add("on");}
function closeProd(){document.getElementById("mProd").classList.remove("on");}
function addCart(){cart.push(cur);document.getElementById("cn").innerText=cart.length;var cl=document.getElementById("clist");var tot=0;cl.innerHTML="";cart.forEach(function(c){tot+=c.price;cl.innerHTML+='<div style="background:#fff;padding:10px;border:1px solid #eee;border-radius:10px;margin:5px 0;display:flex;gap:10px"><img src="'+c.img+'" style="width:50px;height:50px;border-radius:8px"><div><b>'+c.name+'</b><br>GH₵'+c.price+'</div></div>';});cl.innerHTML+='<div style="padding:12px;background:#fff;border-radius:10px;margin-top:8px"><b>Total GH₵'+tot+'</b><br><button class="btn bk" onclick="sendOrderEmail('+tot+')">CHECKOUT & EMAIL SELLER</button></div>';closeProd();tab("cart");}
function sendOrderEmail(tot){var emailParams={to_email:cur.email||"dornny@gmail.com",product:cur.name,total:tot,buyer:curOwner?curOwner.name:"Guest"};emailjs.send("service_id","template_id",emailParams).then(function(){alert("✅ Order placed! Email sent to "+cur.shop);},function(){alert("Order saved! Seller notified via WhatsApp");window.open("https://wa.me/233594221108?text=Order GH₵"+tot);});}
function buyWA(){var ph=cur.phone.replace(/\D/g,"");if(ph.charAt(0)=="0"){ph="233"+ph.substring(1);}window.open("https://wa.me/"+ph+"?text=I want "+encodeURIComponent(cur.name)+" GH₵"+cur.price);}
function openChat(){chatShop=cur.shop;closeProd();tab("msgs");document.getElementById("chatBox").style.display="block";drawMsgs();}
function sendMsg(){var txt=document.getElementById("msgInput").value;if(!txt)return;var m={shop:chatShop,text:txt,from:"me",time:new Date().toLocaleTimeString(),buyer:curOwner?curOwner.shop:"Guest"};msgs.push(m);localStorage.setItem("dornny_msgs",JSON.stringify(msgs));document.getElementById("msgInput").value="";drawMsgs();sendEmailNotif(chatShop,txt);updateMsgDot();}
function drawMsgs(){var box=document.getElementById("msgs");box.innerHTML="";msgs.filter(function(m){return m.shop==chatShop}).forEach(function(m){box.innerHTML+='<div class="msg '+(m.from=="me"?"me":"other")+'"><b>'+m.buyer+':</b> '+m.text+'<br><span style="font-size:8px">'+m.time+'</span></div>';});box.scrollTop=box.scrollHeight;}
function drawChatList(){var l=document.getElementById("chatList");l.innerHTML="";var shops=[...new Set(msgs.map(function(m){return m.shop}))];if(!shops.length){l.innerHTML='<p style="color:#888;font-size:11px">No messages yet - Message a seller from product page</p>';return;}shops.forEach(function(s){var last=msgs.filter(function(m){return m.shop==s}).pop();l.innerHTML+='<div style="background:#fff;padding:12px;border:1px solid #eee;border-radius:10px;margin:6px 0" onclick="chatShop=\''+s+'\';drawMsgs();document.getElementById(\'chatBox\').style.display=\'block\'"><b>💬 '+s+'</b><br><span style="font-size:11px">'+last.text+'</span><br><span style="font-size:9px;color:#888">'+last.time+'</span></div>';});}
function updateMsgDot(){var d=document.getElementById("msgDot");if(msgs.length>0){d.style.display="inline";d.innerText=msgs.length;}else{d.style.display="none";}}
function sendEmailNotif(shop,txt){var emailParams={to_email:"seller@example.com",shop:shop,message:txt};emailjs.send("service_id","template_id",emailParams).then(function(){console.log("Email sent");});}
function rate(n){if(!cur)return;var r={shop:cur.shop,stars:n,product:cur.name};ratings.push(r);localStorage.setItem("dornny_ratings",JSON.stringify(ratings));var shopRatings=ratings.filter(function(x){return x.shop==cur.shop});var avg=(shopRatings.reduce(function(s,x){return s+x.stars;},0)/shopRatings.length).toFixed(1);cur.rating=avg;cur.rates=shopRatings.length;alert("⭐ Thanks! You rated "+cur.shop+" "+n+" stars! New rating: "+avg);document.querySelectorAll("#rateStars.star").forEach(function(s,i){s.classList.toggle("on",i<n);});}
function openShop(){document.getElementById("mShop").classList.add("on");}
function closeShop(){document.getElementById("mShop").classList.remove("on");}
function openAdd(){if(!curOwner){alert("Open Shop first - 50 GHS");openShop();return;}document.getElementById("mAdd").classList.add("on");}
function closeAdd(){document.getElementById("mAdd").classList.remove("on");tmpImg="";document.getElementById("aprev").style.display="none";}
function preview(inp){if(inp.files[0]){var r=new FileReader();r.onload=function(e){tmpImg=e.target.result;document.getElementById("aprev").src=tmpImg;document.getElementById("aprev").style.display="block";};r.readAsDataURL(inp.files[0]);}}
function regShop(){var n=document.getElementById("oname").value;var s=document.getElementById("oshop").value;var p=document.getElementById("ophone").value;var e=document.getElementById("oemail").value;if(!n||!s||!p){alert("Fill all");return;}var o={name:n,shop:s,phone:p,email:e||"seller@gmail.com",loc:document.getElementById("oloc").value||"Accra",rating:5,rates:0};owners.push(o);curOwner=o;localStorage.setItem("dornny_owners",JSON.stringify(owners));localStorage.setItem("dornny_cur",JSON.stringify(o));closeShop();drawMe();drawOwners();var emailParams={to_email:e,to_name:n,shop_name:s};emailjs.send("service_id","template_id",emailParams).then(function(){alert("🎉 Shop Opened! Email sent to "+e);});tab("me");}
function addProd(){var n=document.getElementById("aname").value;var pr=document.getElementById("aprice").value;if(!n||!pr){alert("Name and price");return;}var it={name:n,price:parseFloat(pr),img:tmpImg||"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop",shop:curOwner.shop,owner:curOwner.name,phone:curOwner.phone,email:curOwner.email,rating:5,rates:0};my.push(it);localStorage.setItem("dornny_my",JSON.stringify(my));all=def.concat(my);build();closeAdd();var emailParams={shop:curOwner.shop,product:n};emailjs.send("service_id","template_id",emailParams).then(function(){alert("✅ Product added! Users notified by email!");});tab("shop");}
function drawOwners(){var o=document.getElementById("olist");if(!owners.length){o.innerHTML='<p style="color:#888;font-size:11px">No shops yet - Be first! ⭐</p>';return;}o.innerHTML="";owners.forEach(function(x){var shopRatings=ratings.filter(function(r){return r.shop==x.shop});var avg=shopRatings.length? (shopRatings.reduce(function(s,r){return s+r.stars;},0)/shopRatings.length).toFixed(1):5;o.innerHTML+='<div style="background:#fff;padding:12px;border-radius:10px;margin:6px 0;border:1px solid #eee;display:flex;gap:10px;justify-content:space-between"><div style="display:flex;gap:10px"><div style="width:40px;height:40px;background:#111;color:gold;border-radius:50%;display:flex;align-items:center;justify-content:center">'+x.shop.charAt(0)+'</div><div><b>'+x.shop+'</b><br><span style="font-size:11px">'+x.name+' - ⭐ '+avg+'</span></div></div><button style="background:#111;color:#fff;border:0;border-radius:20px;padding:6px 12px;font-size:10px" onclick="chatShop=\''+x.shop+'\';tab(\'msgs\');document.getElementById(\'chatBox\').style.display=\'block\'">💬 Chat</button></div>';});}
function drawMe(){var b=document.getElementById("meBox");var l=document.getElementById("myProds");if(curOwner){b.innerHTML='<div style="background:#111;color:#fff;padding:14px;border-radius:12px"><b>'+curOwner.shop+'</b> ⭐ '+(curOwner.rating||5)+'<br>'+curOwner.name+' - '+curOwner.email+'<br><button class="btn y" style="margin-top:8px" onclick="openAdd()">+ ADD REAL PHOTO</button><button class="btn" style="background:#fff;color:#111;margin-top:6px" onclick="tab(\'msgs\')">💬 VIEW MESSAGES ('+msgs.filter(function(m){return m.shop==curOwner.shop}).length+')</button></div>';if(!my.length){l.innerHTML='<p style="color:#888;font-size:12px;padding:10px">No products yet</p>';}else{l.innerHTML="";my.forEach(function(it){l.innerHTML+='<div style="background:#fff;padding:10px;border:1px solid #eee;border-radius:10px;margin:6px 0;display:flex;gap:10px"><img src="'+it.img+'" style="width:60px;height:60px;border-radius:8px;object-fit:cover"><div><b>'+it.name+'</b><br>GH₵'+it.price+' ⭐ '+it.rating+'</div></div>';});}}else{b.innerHTML='<div style="background:#fffbe6;padding:12px;border-radius:10px;border:1px dashed gold;text-align:center">Pay 50 GHS to Open Shop<br>Get Email Notifications + Chat + Ratings</div><button class="btn y" onclick="openShop()">OPEN SHOP - 50 GHS</button>';l.innerHTML="";}}
build();
</script></body></html>
