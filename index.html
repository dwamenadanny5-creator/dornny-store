<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dornny Store - Live Camera Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}</style>
</head>
<body class="bg-gray-50 pb-[70px]">
<div class="bg-white sticky top-0 z-30 p-3 flex justify-between items-center shadow-sm">
<h1 class="font-black text-xl">DORNNY<span class="text-pink-600">.STORE</span></h1>
<div class="flex gap-2">
<button onclick="showLogin()" id="loginBtn" class="bg-black text-white text-xs px-3 py-1.5 rounded-full">Login</button>
<button onclick="showPage('livePage')" class="bg-red-500 text-white text-xs px-3 py-1.5 rounded-full animate-pulse">● LIVE</button>
</div>
</div>
<div id="homePage" class="page active p-2">
<div id="buyerSlider" class="relative overflow-hidden rounded-[16px] h-[130px] mb-3">
<div id="sliderTrack" style="display:flex; transition:transform 0.6s ease; height:100%;">
<div style="min-width:100%; background:linear-gradient(90deg,#ff0055,#ff9900); display:flex; align-items:center; padding:16px; color:white;"><div><h2 class="font-black text-[20px]">🔥 TRENDING TODAY</h2><p class="text-xs">Up to 50% OFF</p></div><div class="ml-auto text-5xl">🛍️</div></div>
<div style="min-width:100%; background:linear-gradient(90deg,#8a2be2,#00d4ff); display:flex; align-items:center; padding:16px; color:white;"><div><h2 class="font-black text-[20px]">NEW DROPS</h2><p class="text-xs">Men • Women • Kids</p></div><div class="ml-auto text-5xl">✨</div></div>
<div style="min-width:100%; background:linear-gradient(90deg,#00c851,#007E33); display:flex; align-items:center; padding:16px; color:white;"><div><h2 class="font-black text-[20px]">LIVE SELLING NOW</h2><p class="text-xs">Join & Get Discount</p></div><div class="ml-auto text-5xl">📹</div></div>
</div>
</div>
<div id="sellerDashboard" style="display:none; margin-bottom:10px;">
<div style="background:#111; border-radius:30px; padding:8px 12px; display:flex; align-items:center; justify-content:space-between;">
<div style="display:flex; align-items:center; gap:8px;"><span style="background:linear-gradient(90deg,#ff0055,#8a2be2); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white;">🏪</span><div><div style="color:white; font-weight:800; font-size:12px;">SELLER CENTER</div><div style="color:#00ff88; font-size:9px;">● Live Upload</div></div></div>
<div style="display:flex; gap:6px;"><button onclick="document.getElementById('sellerUploadBox').style.display=document.getElementById('sellerUploadBox').style.display==='none'?'block':'none'" style="background:white; color:black; border:none; border-radius:20px; padding:6px 14px; font-weight:800; font-size:11px;">+ NEW</button><button onclick="document.getElementById('sellerDashboard').style.display='none'" style="background:#333; color:white; border:none; width:26px; height:26px; border-radius:50%;">✕</button></div>
</div>
<div id="sellerUploadBox" style="display:none; background:white; border-radius:16px; padding:12px; margin-top:8px; border:1px solid #eee;">
<div style="display:flex; gap:8px; margin-bottom:8px;"><label style="flex:1; background:#f5f5f5; border-radius:10px; padding:10px; text-align:center; border:1px dashed #ccc; font-size:11px;">📷 Add Photo<input type="file" id="prodImage" accept="image/*" multiple style="display:none;"></label><select id="prodCat" style="padding:10px; border-radius:10px; border:1px solid #ddd; font-size:12px; background:#f5f5f5;"><option>Men</option><option>Women</option><option>Kids</option><option>Toys</option><option>Sport</option><option>Cars</option><option>Food</option><option>Home Used</option><option>Jewelry</option><option>Home Deco</option><option>Phone</option><option>Shoes</option></select></div>
<input type="text" id="prodName" placeholder="Product name" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:10px; font-size:13px; margin-bottom:8px;">
<div style="display:flex; gap:8px;"><input type="number" id="prodPrice" placeholder="Price GH₵" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:10px;"><button onclick="uploadProduct()" style="flex:1; background:linear-gradient(90deg,#ff0055,#8a2be2); color:white; border:none; border-radius:10px; font-weight:800;">🚀 PUBLISH</button></div>
<input type="text" id="prodWhatsapp" placeholder="Your WhatsApp 233..." style="width:100%; padding:8px; border:1px solid #eee; border-radius:10px; font-size:11px; margin-top:8px;">
</div>
</div>
<div class="bg-white sticky top-[56px] z-20 py-2 flex gap-2 overflow-x-auto whitespace-nowrap scrollbar-hide">
<button onclick="filterCat('All')" class="catBtn bg-black text-white px-4 py-1.5 rounded-full text-xs font-bold">All</button>
<button onclick="filterCat('Men')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Men</button>
<button onclick="filterCat('Women')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Women</button>
<button onclick="filterCat('Kids')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Kids</button>
<button onclick="filterCat('Toys')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Toys</button>
<button onclick="filterCat('Sport')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Sport</button>
<button onclick="filterCat('Cars')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Cars</button>
<button onclick="filterCat('Food')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Food</button>
<button onclick="filterCat('Home Used')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Home Used</button>
<button onclick="filterCat('Jewelry')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Jewelry</button>
<button onclick="filterCat('Home Deco')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Home Deco</button>
<button onclick="filterCat('Phone')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Phone</button>
<button onclick="filterCat('Shoes')" class="catBtn bg-gray-100 px-4 py-1.5 rounded-full text-xs">Shoes</button>
</div>
<div id="productGrid" class="grid grid-cols-2 gap-2 mt-2"></div>
</div>
<div id="trendPage" class="page hidden p-4"><h2 class="font-black">🔥 Trending</h2><div id="trendGrid" class="grid grid-cols-2 gap-2 mt-3"></div></div>
<div id="livePage" class="page hidden p-0 bg-black min-h-screen">
<div class="p-3 bg-white flex justify-between items-center"><h2 class="font-black">📹 Live Sellers</h2><span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full">● LIVE MODE</span></div>
<div id="myLiveBox" style="display:none; background:black; position:relative;">
<video id="liveVideo" autoplay muted playsinline style="width:100%; height:420px; object-fit:cover; background:#111;"></video>
<div style="position:absolute; top:12px; left:12px; background:red; color:white; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:bold;">● LIVE - You</div>
<button onclick="stopLive()" style="position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.6); color:white; border:none; width:32px; height:32px; border-radius:50%;">✕</button>
<div style="position:absolute; bottom:12px; left:10px; right:10px; display:flex; gap:8px;"><input id="liveTitle" placeholder="What are you selling live?" style="flex:1; padding:10px; border-radius:20px; border:none; font-size:12px;"><button style="background:white; padding:8px 14px; border-radius:20px; font-size:12px;">💬</button></div>
</div>
<div class="p-4 bg-gray-50 min-h-[300px]">
<button onclick="goLive()" id="goLiveBtn" class="w-full bg-red-500 text-white py-3.5 rounded-full font-bold shadow-lg">📷 GO LIVE NOW - Turn On Camera</button>
<p class="text-[10px] text-gray-400 text-center mt-2">Allow camera permission when asked</p>
<div id="liveList" class="mt-4"></div>
</div>
</div>
<div id="categoryPage" class="page hidden p-4"><h2 class="font-black">📦 Categories</h2><div class="grid grid-cols-3 gap-3 mt-3" id="catGrid"></div></div>
<div id="cartPage" class="page hidden p-4"><h2 class="font-black">🛒 Cart</h2><div id="cartList" class="mt-3"></div><div class="mt-4 bg-black text-white p-4 rounded-2xl"><div class="flex justify-between"><span>Total Pay:</span><span id="totalPay" class="font-black">GH₵0</span></div><button onclick="checkout()" class="w-full mt-3 bg-pink-600 py-3 rounded-full font-bold">CHECKOUT</button></div></div>
<div id="mePage" class="page hidden p-4"><h2 class="font-black">👤 Me</h2><div id="meInfo" class="mt-3 bg-white p-4 rounded-xl"></div><button onclick="logout()" class="mt-4 text-red-500 text-sm">Logout</button></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-30">
<button onclick="showPage('homePage')" class="flex flex-col items-center text-[10px]"><span>🏠</span>Home</button>
<button onclick="showPage('trendPage')" class="flex flex-col items-center text-[10px]"><span>🔥</span>Trend</button>
<button onclick="showPage('livePage')" class="flex flex-col items-center text-[10px]"><span style="color:red;">●</span>Live</button>
<button onclick="showPage('categoryPage')" class="flex flex-col items-center text-[10px]"><span>📦</span>Category</button>
<button onclick="showPage('cartPage')" class="flex flex-col items-center text-[10px] relative"><span>🛒</span>Cart <span id="cartCount" class="absolute -top-1 -right-2 bg-pink-600 text-white text-[8px] w-4 h-4 rounded-full flex items-center justify-center">0</span></button>
<button onclick="showPage('mePage')" class="flex flex-col items-center text-[10px]"><span>👤</span>Me</button>
</div>
<div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:60;"><div style="background:white; width:90%; max-width:350px; border-radius:20px; padding:20px; margin:auto; margin-top:20%;"><h2 class="font-black text-lg">Login</h2><input id="loginName" placeholder="Your Name" class="w-full mt-3 p-3 border rounded-xl text-sm"><input id="loginEmail" placeholder="Email" class="w-full mt-2 p-3 border rounded-xl text-sm"><input id="loginWhatsapp" placeholder="WhatsApp 233..." class="w-full mt-2 p-3 border rounded-xl text-sm"><select id="loginRole" class="w-full mt-2 p-3 border rounded-xl text-sm"><option value="buyer">I am Buyer</option><option value="seller">I am Seller</option></select><button onclick="doLogin()" class="w-full mt-4 bg-black text-white py-3 rounded-full font-bold">Continue</button><button onclick="document.getElementById('loginModal').style.display='none'" class="w-full mt-2 text-sm text-gray-500">Cancel</button></div></div>
<script>
let products = JSON.parse(localStorage.getItem('dwamen_products')||'[]');
if(products.length===0){products=[{id:1,name:'Men Classic Shirt',price:120,cat:'Men',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400',imgs:['https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400'],seller:'Kwame',sellerId:'kwame@test.com',whatsapp:'233200000001',likes:12,rating:4.8,comments:[{text:'Nice quality!',user:'Ama'}],followers:[]},{id:2,name:'Women Dress Floral',price:180,cat:'Women',img:'https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=400',imgs:['https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=400'],seller:'Ama',sellerId:'ama@test.com',whatsapp:'233200000002',likes:34,rating:4.9,comments:[],followers:[]}];localStorage.setItem('dwamen_products',JSON.stringify(products));}
let curFilter='All';
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.getElementById(id).classList.add('active');if(id==='homePage')checkTop();if(id==='cartPage')renderCart();if(id==='mePage')renderMe();if(id==='trendPage')renderTrend();if(id==='livePage')renderLive();if(id==='categoryPage')renderCats();window.scrollTo(0,0);}
function filterCat(cat){curFilter=cat;document.querySelectorAll('.catBtn').forEach(b=>{b.classList.remove('bg-black','text-white');b.classList.add('bg-gray-100');if(b.textContent===cat){b.classList.add('bg-black','text-white');b.classList.remove('bg-gray-100');}});renderProducts(cat);checkTop();}
function renderProducts(filter='All'){let grid=document.getElementById('productGrid');let list=filter==='All'?products:products.filter(p=>p.cat===filter);grid.innerHTML=list.map(p=>`<div onclick="openProduct(${p.id})" class="bg-white rounded-xl overflow-hidden shadow-sm"><div class="relative"><img src="${p.imgs[0]}" class="w-full h-[170px] object-cover"><button onclick="event.stopPropagation();likeProduct(${p.id})" class="absolute top-2 right-2 bg-white rounded-full px-2 py-0.5 text-[10px] font-bold">❤️ ${p.likes||0}</button></div><div class="p-2"><div class="text-xs font-bold truncate">${p.name}</div><div class="flex justify-between"><span class="text-pink-600 font-black text-sm">GH₵${p.price}</span><span class="text-[9px] bg-yellow-100 px-1 rounded">★ ${p.rating||5}</span></div><div class="text-[9px] text-gray-500">${p.seller} • ${p.followers?.length||0} followers</div></div></div>`).join('')||'<div class="col-span-2 text-center py-10 text-gray-400">No products in '+filter+'</div>';}
function uploadProduct(){let name=document.getElementById('prodName').value.trim();let price=document.getElementById('prodPrice').value;let cat=document.getElementById('prodCat').value;let wa=document.getElementById('prodWhatsapp').value||JSON.parse(localStorage.getItem('dwamen_user')||'{}').whatsapp||'233000000000';let fileInput=document.getElementById('prodImage');let u=JSON.parse(localStorage.getItem('dwamen_user')||'{}');if(!name||!price)return alert('Add name & price');let files=fileInput.files;let imgs=[];if(files.length>0){let loaded=0;for(let i=0;i<files.length;i++){let r=new FileReader();r.onload=e=>{imgs.push(e.target.result);loaded++;if(loaded===files.length){saveProd(name,price,cat,wa,imgs,u);}};r.readAsDataURL(files[i]);}}else{saveProd(name,price,cat,wa,['https://via.placeholder.com/400?text='+encodeURIComponent(name)],u);}}
function saveProd(name,price,cat,wa,imgs,u){let p={id:Date.now(),name,price,cat,img:imgs[0],imgs,seller:u.name||'Seller',sellerId:u.email||'seller@test.com',whatsapp:wa,likes:0,rating:5,comments:[],followers:[],reports:0};products.unshift(p);localStorage.setItem('dwamen_products',JSON.stringify(products));renderProducts(curFilter);document.getElementById('prodName').value='';document.getElementById('prodPrice').value='';alert('Published!');}
function openProduct(id){let p=products.find(x=>x.id===id);let modal=document.createElement('div');modal.id='productModal';modal.style="position:fixed; inset:0; background:white; z-index:50; overflow-y:auto; padding-bottom:80px;";modal.innerHTML=`<div style="position:relative;"><div style="display:flex; overflow-x:auto; scroll-snap-type:x mandatory;" id="imgSlider">${p.imgs.map(img=>`<img src="${img}" style="min-width:100%; height:360px; object-fit:cover; scroll-snap-align:start;">`).join('')}</div><button onclick="this.closest('#productModal').remove()" style="position:absolute; top:12px; right:12px; background:black; color:white; border-radius:50%; width:32px; height:32px;">✕</button><div style="position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.6); color:white; font-size:10px; padding:4px 10px; border-radius:20px;">← Slide → ${p.imgs.length} images</div></div><div style="padding:14px;"><h2 style="font-weight:900; font-size:18px;">${p.name}</h2><div style="display:flex; gap:8px; margin-top:6px;"><span style="font-weight:900; font-size:18px; color:#ff0055;">GH₵${p.price}</span><span style="background:#fff3cd; font-size:10px; padding:2px 6px; border-radius:6px;">★ ${p.rating} • ${p.likes} likes</span></div><div style="display:flex; gap:8px; margin:14px 0; flex-wrap:wrap;"><button onclick="likeProduct(${p.id}); openProduct(${p.id});" style="background:#ffe6e6; padding:8px 14px; border-radius:20px; font-size:12px; font-weight:bold; border:none;">❤️ Like ${p.likes}</button><button onclick="followSeller('${p.sellerId}')" style="background:black; color:white; padding:8px 14px; border-radius:20px; font-size:12px; border:none;">+ Follow ${p.seller}</button><a href="https://wa.me/${p.whatsapp}?text=Hi ${p.seller}, interested in ${p.name}" target="_blank" style="background:#25D366; color:white; padding:8px 14px; border-radius:20px; font-size:12px; text-decoration:none; font-weight:bold;">WhatsApp</a></div><div style="background:#f9f9f9; border-radius:12px; padding:10px;"><div style="font-weight:bold; font-size:13px;">Rate: <span onclick="rateProduct(${p.id},5)" style="cursor:pointer;">★★★★★</span></div><div style="display:flex; gap:6px; margin-top:10px;"><input id="commentInput" placeholder="Add comment..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:10px;"><button onclick="commentProduct(${p.id})" style="background:black; color:white; padding:10px 14px; border-radius:10px;">Post</button></div><div style="margin-top:10px;">${(p.comments||[]).map(c=>`<div style="font-size:12px; padding:6px 0; border-bottom:1px solid #eee;"><b>${c.user}:</b> ${c.text}</div>`).join('')||'<div style="font-size:11px; color:gray;">No comments yet</div>'}</div></div><div style="display:flex; gap:12px; margin-top:14px;"><button onclick="reportProduct(${p.id})" style="font-size:11px; color:red; border:none; background:none;">🚩 Report</button><button onclick="refundProduct(${p.id})" style="font-size:11px; border:none; background:none;">↩️ Refund</button></div><button onclick="addToCart(${p.id}); this.textContent='✅ Added!'; setTimeout(()=>{document.getElementById('productModal')?.remove(); showPage('cartPage')},800);" style="width:100%; margin-top:16px; background:linear-gradient(90deg,#ff0055,#8a2be2); color:white; padding:14px; border:none; border-radius:30px; font-weight:900;">🛒 ADD TO CART - GH₵${p.price}</button></div>`;document.body.appendChild(modal);}
function likeProduct(id){let p=products.find(x=>x.id==id);p.likes=(p.likes||0)+1;localStorage.setItem('dwamen_products',JSON.stringify(products));renderProducts(curFilter);}
function rateProduct(id,s){let p=products.find(x=>x.id==id);p.rating=s;localStorage.setItem('dwamen_products',JSON.stringify(products));alert('Rated '+s+' stars!');}
function commentProduct(id){let inp=document.getElementById('commentInput');let txt=inp.value.trim();if(!txt)return;let p=products.find(x=>x.id==id);let u=JSON.parse(localStorage.getItem('dwamen_user')||'{}');p.comments.push({text:txt,user:u.name||'Buyer'});localStorage.setItem('dwamen_products',JSON.stringify(products));openProduct(id);}
function followSeller(sellerId){alert('✅ Following! You will get notification when LIVE!');if(Notification&&Notification.permission!=='granted'){Notification.requestPermission();}localStorage.setItem('follow_'+sellerId,'1');}
function reportProduct(id){let r=prompt('Why reporting?');if(!r)return;alert('Reported. Admin will review.');}
function refundProduct(id){let r=prompt('Reason for refund?');if(!r)return;alert('Refund request sent to seller WhatsApp.');}
function addToCart(id){let cart=JSON.parse(localStorage.getItem('dwamen_cart')||'[]');cart.push(products.find(x=>x.id==id));localStorage.setItem('dwamen_cart',JSON.stringify(cart));updateCartTotal();}
function renderCart(){let cart=JSON.parse(localStorage.getItem('dwamen_cart')||'[]');document.getElementById('cartList').innerHTML=cart.map((p,i)=>`<div class="bg-white p-3 rounded-xl flex gap-3 mb-2"><img src="${p.img}" class="w-16 h-16 rounded-lg object-cover"><div class="flex-1"><div class="text-sm font-bold">${p.name}</div><div class="text-pink-600 font-bold">GH₵${p.price}</div></div><button onclick="removeCart(${i})" class="text-red-500 text-xs">Remove</button></div>`).join('')||'<div class="text-center py-10 text-gray-400">Cart empty</div>';updateCartTotal();}
function removeCart(i){let cart=JSON.parse(localStorage.getItem('dwamen_cart')||'[]');cart.splice(i,1);localStorage.setItem('dwamen_cart',JSON.stringify(cart));renderCart();}
function updateCartTotal(){let cart=JSON.parse(localStorage.getItem('dwamen_cart')||'[]');let total=cart.reduce((s,p)=>s+Number(p.price),0);document.getElementById('totalPay').textContent='GH₵'+total;document.getElementById('cartCount').textContent=cart.length;}
function checkout(){let cart=JSON.parse(localStorage.getItem('dwamen_cart')||'[]');if(cart.length===0)return alert('Cart empty');let total=cart.reduce((s,p)=>s+Number(p.price),0);alert('Order placed! Total GH₵'+total);localStorage.setItem('dwamen_cart','[]');renderCart();}
function renderTrend(){document.getElementById('trendGrid').innerHTML=products.slice().sort((a,b)=>b.likes-a.likes).map(p=>`<div onclick="openProduct(${p.id})" class="bg-white rounded-xl overflow-hidden"><img src="${p.img}" class="w-full h-32 object-cover"><div class="p-2 text-xs font-bold">${p.name}</div><div class="px-2 pb-2 text-xs text-pink-600">GH₵${p.price} • ❤️ ${p.likes}</div></div>`).join('');}
function renderLive(){document.getElementById('liveList').innerHTML=products.slice(0,5).map(p=>`<div class="bg-white p-3 rounded-xl flex gap-3 mb-2 items-center"><div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">📹</div><div class="flex-1"><div class="font-bold text-sm">${p.seller} is LIVE</div><div class="text-xs text-gray-500">${p.name}</div></div><button onclick="alert('Joining ${p.seller} LIVE!')" class="bg-red-500 text-white px-4 py-1.5 rounded-full text-xs">JOIN</button></div>`).join('');}
function renderCats(){let cats=['Men','Women','Kids','Toys','Sport','Cars','Food','Home Used','Jewelry','Home Deco','Phone','Shoes'];document.getElementById('catGrid').innerHTML=cats.map(c=>`<button onclick="showPage('homePage'); filterCat('${c}')" class="bg-white p-4 rounded-xl text-sm font-bold">${c}</button>`).join('');}
function renderMe(){let u=JSON.parse(localStorage.getItem('dwamen_user')||'null');let el=document.getElementById('meInfo');if(!u)el.innerHTML='Not logged in. <button onclick="showLogin()" class="bg-black text-white px-3 py-1 rounded-full text-xs">Login</button>';else el.innerHTML=`<div class="font-bold">${u.name}</div><div class="text-xs">${u.email} • ${u.role}</div><div class="text-xs mt-2">WhatsApp: ${u.whatsapp}</div>`;}
function showLogin(){document.getElementById('loginModal').style.display='block';}
function doLogin(){let name=document.getElementById('loginName').value.trim();let email=document.getElementById('loginEmail').value.trim();let wa=document.getElementById('loginWhatsapp').value.trim();let role=document.getElementById('loginRole').value;if(!name||!email)return alert('Add name & email');let u={name,email,whatsapp:wa||'233000000000',role};localStorage.setItem('dwamen_user',JSON.stringify(u));document.getElementById('loginModal').style.display='none';document.getElementById('loginBtn').textContent=name.split(' ')[0];checkTop();renderMe();alert('Welcome '+name+' as '+role);}
function logout(){localStorage.removeItem('dwamen_user');document.getElementById('loginBtn').textContent='Login';renderMe();checkTop();}
let liveStream=null;
async function goLive(){
let u=JSON.parse(localStorage.getItem('dwamen_user')||'null');
if(!u||u.role!=='seller') return alert('Login as Seller to go Live!');
let box=document.getElementById('myLiveBox');
let video=document.getElementById('liveVideo');
let btn=document.getElementById('goLiveBtn');
try{
box.style.display='block';
let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:true});
liveStream=stream;
video.srcObject=stream;
btn.textContent='🔴 You are LIVE - Camera ON';
btn.style.background='black';
showPage('livePage');
}catch(err){
alert('Camera failed: '+err.message+'\nFix: Use https:// and tap Allow camera. On Chrome: Settings > Site settings > Camera > Allow');
if(box) box.style.display='none';
}
}
function stopLive(){
let box=document.getElementById('myLiveBox');
let video=document.getElementById('liveVideo');
let btn=document.getElementById('goLiveBtn');
if(liveStream){liveStream.getTracks().forEach(t=>t.stop()); liveStream=null;}
if(video) video.srcObject=null;
if(box) box.style.display='none';
if(btn){btn.textContent='📷 GO LIVE NOW - Turn On Camera'; btn.style.background='#ef4444';}
}
function checkTop(){let d=document.getElementById('sellerDashboard');let slider=document.getElementById('buyerSlider');let u={};try{u=JSON.parse(localStorage.getItem('dwamen_user')||'{}')}catch(e){}let isSeller=(u.role||'').toLowerCase()==='seller';let home=document.getElementById('homePage');let isHome=home&&!home.classList.contains('hidden');if(slider)slider.style.display=isHome?'block':'none';if(!d)return;if(!isSeller||!isHome){d.style.display='none';return;}d.style.display=curFilter==='All'?'block':'none';}
let slideIdx=0;setInterval(()=>{let track=document.getElementById('sliderTrack');let home=document.getElementById('homePage');if(!home||home.classList.contains('hidden')||!track)return;slideIdx=(slideIdx+1)%3;track.style.transform=`translateX(-${slideIdx*100}%)`;},3500);
renderProducts('All');updateCartTotal();renderMe();checkTop();setInterval(checkTop,1000);
