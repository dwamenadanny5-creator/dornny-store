<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORNNY - Ghana's WhatsApp Marketplace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f8f9fa}
.header{background:linear-gradient(135deg,#0a3d1f,#1a5c2e);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px}.logo span{color:#f4b400}
.btn{border:none;border-radius:22px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn-gold{background:#f4b400;color:#000}.btn-green{background:#0a3d1f;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}.card-body{padding:10px}
.price{color:#0a3d1f;font-weight:800}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center;padding:16px}
.modal.active{display:flex}.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
</style></head><body>
<div class="header"><div class="logo">DORNNY<span>.</span></div><div style="display:flex;gap:8px">
<button class="btn btn-gold" onclick="openAmbassador()">Ambassador</button>
<button class="btn btn-gold" onclick="openShop()">Open Shop (50 GHS)</button></div></div>

<div id="products" class="grid"></div>

<div class="modal" id="viewModal">
<div class="modal-box" style="padding:0;overflow:hidden;max-width:320px;width:92%;border-radius:20px">
<img id="vImg" style="width:100%;height:220px;object-fit:cover">
<div style="padding:16px"><h3 id="vTitle"></h3><p id="vPrice" class="price" style="margin:8px 0"></p>
<p id="vDesc" style="font-size:13px;color:#666"></p>
<button class="btn btn-green" style="width:100%;margin-top:12px" onclick="buyNow()">BUY ON WHATSAPP</button>
<button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeModals()">Close</button>
</div></div></div>

<div class="modal" id="shopModal"><div class="modal-box">
<h2>Open Your Shop - 50 GHS</h2><p style="font-size:13px;margin:8px 0">Pay MoMo to 0594221108 then fill form</p>
<input id="sName" class="input" placeholder="Shop Name">
<input id="sPhone" class="input" placeholder="WhatsApp Number 233...">
<input id="sMomo" class="input" placeholder="MoMo Transaction ID">
<button class="btn btn-green" style="width:100%" onclick="submitShop()">Submit Shop</button>
<button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeModals()">Cancel</button>
</div></div>

<div class="modal" id="ambModal"><div class="modal-box">
<h2>Ambassador Account</h2>
<input id="aName" class="input" placeholder="Your Name">
<input id="aPhone" class="input" placeholder="Your WhatsApp">
<input id="aMomo" class="input" placeholder="MoMo for payments">
<button class="btn btn-green" style="width:100%" onclick="createAmbassador()">CREATE MY ACCOUNT</button>
<div id="dash" style="display:none;margin-top:12px;border-top:1px solid #eee;padding-top:12px">
<p>Your Link: <span id="refLink" style="font-size:11px;word-break:break-all"></span></p>
<p>Sellers: <b id="refCount">0</b> | Earned: <b id="refEarn">0 GHS</b></p>
<button class="btn btn-gold" style="width:100%;margin-top:8px" onclick="shareAmb()">Share Link</button>
</div>
<button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeModals()">Close</button>
</div></div>
