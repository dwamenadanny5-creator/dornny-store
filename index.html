<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DORNNY - Ghana's SHEIN</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff}
.hide-scroll::-webkit-scrollbar{display:none}
.shein-tab{white-space:nowrap;padding:8px 0;border-bottom:2.5px solid transparent;font-size:13px}
.shein-tab.active{border-bottom-color:#000;font-weight:700;color:#000}
.prod-swiper{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.prod-swiper>div{min-width:100%;scroll-snap-align:center}
#liveVideo{background:#000;object-fit:cover}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 20px;border-radius:30px;font-size:12px;z-index:9999;display:none;max-width:90%;text-align:center}
</style>
</head>
<body class="pb-[70px]">
<div id="toast" class="toast"></div>
<div id="customPrompt" class="fixed inset-0 bg-black/70 z-[200] hidden flex items-center justify-center p-6"><div class="bg-white w-full rounded-2xl p-5 max-w-sm"><h3 class="font-bold">Start Live</h3><input id="promptInput" value="New Collection Drop 🔥" class="w-full bg-[#f5f5f5] p-3 rounded-full mt-3 text-sm outline-none border"><div class="flex gap-2 mt-4"><button onclick="closePrompt()" class="flex-1 bg-gray-100 py-3 rounded-full text-sm">Cancel</button><button onclick="confirmPrompt()" class="flex-1 bg-[#ff2d55] text-white py-3 rounded-full text-sm font-bold">Go Live 🔴</button></div></div></div>

<div id="loginScreen" class="fixed inset-0 bg-white z-[100] flex flex-col p-6"><div class="text-center mt-10"><h1 class="font-black text-[28px] tracking-[0.15em]">DORNNY</h1><p class="text-[11px] tracking-[0.3em] text-gray-400 mt-1">GHANA'S SHEIN</p></div><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400" class="w-full h-40 object-cover rounded-2xl mt-6"><h2 class="font-bold text-xl mt-6">Welcome to DORNNY</h2><input id="loginEmail" placeholder="Email" class="w-full bg-[#f5f5f5] p-4 rounded-full mt-6 text-sm"><input id="loginPass" type="password" placeholder="Password" class="w-full bg-[#f5f5f5] p-4 rounded-full mt-3 text-sm"><button onclick="doLogin()" class="w-full bg-black text-white p-4 rounded-full mt-4 font-bold text-sm">LOG IN / SIGN UP</button><button onclick="skipLogin()" class="w-full text-gray-400 text-xs mt-3">Skip →</button></div>

<header class="bg-white sticky top-0 z-40 border-b"><div class="p-3 flex justify-between items-center"><div class="font-black text-[22px]">DORNNY</div><div class="flex gap-3 items-center text-[18px]"><i class="fa-regular fa-envelope"></i><div class="relative"><i class="fa-solid fa-bag-shopping"></i><span id="cartCount" class="absolute -top-2 -right-2 bg-black text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span></div></div></div><div class="px-3 pb-2 flex gap-2"><div class="flex-1 bg-[#f5f5f5] rounded-full flex items-center px-3 py-2.5"><i class="fa-solid fa-magnifying-glass text-gray-400 text-sm mr-2"></i><input id="searchInput" oninput="render()" placeholder="Dress" class="bg-transparent w-full text-[13px] outline-none"></div></div><div class="flex gap-5 px-3 overflow-x-auto hide-scroll border-b mt-1"><button onclick="filterCat('All')" id="cat-All" class="shein-tab active">All</button><button onclick="filterCat('Women')" id="cat-Women" class="shein-tab text-gray-500">Women</button><button onclick="filterCat('Men')" id="cat-Men" class="shein-tab text-gray-500">Men</button><button onclick="filterCat('Shoes')" id="cat-Shoes" class="shein-tab text-gray-500">Shoes</button><button onclick="filterCat('Bags')" id="cat-Bags" class="shein-tab text-gray-500">Bags</button></div></header>
<div class="bg-[#ffe6e9] text-[#ff2442] text-[11px] px-3 py-1.5">🎟️ New User: <b>GH₵ 50 OFF</b></div>
<div class="px-3 py-2"><div class="flex justify-between items-center"><h3 class="font-bold text-[13px]">🔴 Trending LIVE</h3><span onclick="openLiveList()" class="text-[11px] text-gray-400">More ></span></div><div id="liveList" class="flex gap-2 overflow-x-auto hide-scroll mt-2"></div></div>
<div class="px-2 py-1 bg-[#f5f5f5]"><div id="productGrid" class="grid grid-cols-2 gap-2"></div></div>
<div id="productModal" class="fixed inset-0 bg-white z-50 hidden overflow-y-auto"><div class="sticky top-0 bg-white z-10 p-2 flex justify-between border-b"><button onclick="closeProduct()" class="w-8 h-8 bg-black/10 rounded-full">←</button></div><div id="prodSwiper" class="prod-swiper w-full h-[55vh] bg-[#f5f5f5]"></div><div id="productDetail" class="p-3"></div></div>

<div id="liveRoomModal" class="fixed inset-0 bg-black z-[60] hidden"><div class="relative w-full h-full">
<video id="liveVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full"></video>
<div class="absolute top-0 left-0 right-0 p-3 flex justify-between items-center z-[20]" style="background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent)">
<div class="flex items-center gap-2"><img id="hostAvatar" src="https://i.pravatar.cc/100" class="w-9 h-9 rounded-full border-2 border-white"><div><p id="hostName" class="text-white text-[12px] font-bold">DORNNY</p><p class="text-white text-[10px]"><span id="viewerCount">1</span> viewers • 🔴 LIVE</p></div>
<button onclick="shareLive()" class="bg-white/20 text-white text-[10px] px-3 py-1 rounded-full ml-2">Invite</button>
</div><button onclick="closeLive()" class="w-9 h-9 bg-white/20 text-white rounded-full">✕</button></div>
<div class="absolute left-3 right-20 bottom-[135px] max-h-[30vh] overflow-y-auto hide-scroll space-y-2 z-[20]" id="liveComments"></div>
<div class="absolute left-3 right-3 bottom-[80px] bg-white rounded-xl p-2 flex gap-2 items-center z-[20]"><img id="liveProductImg" src="" class="w-12 h-12 rounded-lg"><div class="flex-1"><p id="liveProductName" class="text-[11px] font-bold truncate">Product</p><p id="liveProductPrice" class="text-[#ff2d55] text-[12px] font-bold">GH₵ 0</p></div><button onclick="addToCartLive()" class="bg-[#ff2d55] text-white text-[11px] px-4 py-2 rounded-full font-bold">Buy</button></div>
<div class="absolute left-3 right-3 bottom-4 flex gap-2 z-[30]"><input id="liveCommentInput" placeholder="Add comment..." class="flex-1 bg-white text-black text-[14px] px-4 py-3 rounded-full outline-none shadow-2xl"><button onclick="sendComment()" class="bg-[#ff2d55] w-12 h-12 rounded-full text-white shadow-2xl"><i class="fa-solid fa-paper-plane"></i></button></div>
</div></div>

<div id="liveListModal" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-end"><div class="bg-white w-full rounded-t-2xl max-h-[80vh] overflow-y-auto p-3"><div class="flex justify-between"><h3 class="font-bold">🔴 Live Now</h3><button onclick="closeLiveList()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><div id="liveListFull" class="grid grid-cols-2 gap-2 mt-3"></div><button onclick="startHostLive()" class="w-full bg-[#ff2d55] text-white p-3 rounded-full mt-4 font-bold">🎥 START MY LIVE</button><p class="text-[10px] text-gray-400 text-center mt-2">Friend needs REAL Firebase to join - add it in code</p></div></div>
<button onclick="openLiveList()" class="fixed bottom-[80px] right-4 bg-[#ff2d55] w-14 h-14 rounded-full shadow-xl flex flex-col items-center justify-center text-white z-30"><i class="fa-solid fa-video text-sm"></i><span class="text-[9px] font-black">LIVE</span><span class="absolute -top-1 -right-1 bg-black text-[8px] w-4 h-4 rounded-full flex items-center justify-center" id="liveBadge">0</span></button>
<div id="addModal" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-end"><div class="bg-white w-full rounded-t-2xl p-4"><h3 class="font-bold">Add Product</h3><input id="nName" placeholder="Name" class="w-full bg-[#f5f5f5] p-3 rounded-full mt-3 text-sm"><input id="nPrice" type="number" placeholder="Price" class="w-full bg-[#f5f5f5] p-3 rounded-full mt-2 text-sm"><input id="nImg" placeholder="Image URL" class="w-full bg-[#f5f5f5] p-3 rounded-full mt-2 text-sm"><button onclick="addProduct()" class="w-full bg-black text-white p-3 rounded-full mt-3 font-bold">Publish</button><button onclick="closeAdd()" class="w-full text-gray-400 text-xs mt-2">Cancel</button></div></div>
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-1.5 z-40"><button class="flex flex-col items-center text-black"><i class="fa-solid fa-house"></i><span class="text-[9px]">Home</span></button><button onclick="openLiveList()" class="flex flex-col items-center text-gray-400"><i class="fa-solid fa-clapperboard"></i><span class="text-[9px]">Live</span></button><button class="flex flex-col items-center text-gray-400"><i class="fa-regular fa-user"></i><span class="text-[9px]">Me</span></button></nav>

<script>
const firebaseConfig={apiKey:"AIzaSyDUMMY-REPLACE-WITH-YOURS",authDomain:"dornny-store.firebaseapp.com",projectId:"dornny-store",storageBucket:"dornny-store.appspot.com",messagingSenderId:"123456789",appId:"1:123:web:abc"};
try{firebase.initializeApp(firebaseConfig)}catch(e){}
const db=firebase.firestore?firebase.firestore():null;const auth=firebase.auth?firebase.auth():null;
let products=JSON.parse(localStorage.getItem('dornny_final')||'null')||[{id:1,name:"SHEIN EZwear Cami Top",price:45,old:89,cat:"Women",img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400",imgs:["https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400"]},{id:2,name:"Cargo Pants",price:120,cat:"Men",img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400",imgs:["https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400"]},{id:3,name:"Sneakers",price:350,cat:"Shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",imgs:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"]}];
let cart=JSON.parse(localStorage.getItem('dornny_cart')||'[]');let currentCat='All';let currentLiveProduct=null;let liveUnsub=null;
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000);}
function closePrompt(){document.getElementById('customPrompt').style.display='none';}
function confirmPrompt(){const v=document.getElementById('promptInput').value.trim();if(!v){showToast('Enter title');return;}closePrompt();actuallyStartLive(v);}
if(db &&!firebaseConfig.apiKey.includes('DUMMY')){
 db.collection("liveRooms").where("isLive","==",true).onSnapshot(snap=>{const lives=snap.docs.map(d=>({id:d.id,...d.data()}));document.getElementById('liveBadge').innerText=lives.length;renderLivePreview(lives);});
}
function render(){let list=currentCat==='All'?products:products.filter(p=>p.cat===currentCat);const q=document.getElementById('searchInput').value.toLowerCase();if(q)list=list.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('productGrid').innerHTML=list.map(p=>`<div onclick="openProduct('${p.id}')" class="bg-white rounded-lg overflow-hidden"><img src="${p.img}" class="w-full h-[180px] object-cover"><div class="p-1.5"><p class="text-[11px]">${p.name}</p><span class="font-bold text-[13px]">GH₵${p.price}</span></div></div>`).join('');document.getElementById('cartCount').innerText=cart.length;}
function renderLivePreview(lives){const demo=lives&&lives.length?lives:[{id:'demo1',hostName:'DORNNY Live',viewers:234,img:products[0].img},{id:'demo2',hostName:'Ama Fashion',viewers:120,img:products[2].img}];document.getElementById('liveList').innerHTML=demo.map(l=>`<div onclick="joinLive('${l.id}')" class="relative min-w-[90px] w-[90px] h-[120px] rounded-xl overflow-hidden"><img src="${l.img}" class="w-full h-full object-cover"><span class="absolute top-1 left-1 bg-[#ff2d55] text-white text-[7px] px-1 rounded">LIVE</span><p class="absolute bottom-1 left-1 text-white text-[8px]">${l.hostName}</p></div>`).join('');document.getElementById('liveListFull').innerHTML=demo.map(l=>`<div onclick="joinLive('${l.id}')" class="relative rounded-xl h-48 overflow-hidden"><img src="${l.img}" class="w-full h-full object-cover"><span class="absolute top-2 left-2 bg-[#ff2d55] text-white text-[9px] px-2 rounded">● LIVE</span><p class="absolute bottom-2 left-2 text-white text-[11px]">${l.hostName}</p></div>`).join('');}
function filterCat(c){currentCat=c;document.querySelectorAll('.shein-tab').forEach(b=>{b.classList.remove('active');b.classList.add('text-gray-500')});document.getElementById('cat-'+c).classList.add('active');render();}
function openProduct(id){const p=products.find(x=>String(x.id)===String(id));currentLiveProduct=p;document.getElementById('prodSwiper').innerHTML=(p.imgs||[p.img]).map(img=>`<div><img src="${img}" class="w-full h-full object-contain"></div>`).join('');document.getElementById('productModal').style.display='block';document.getElementById('productDetail').innerHTML=`<p class="font-bold">${p.name}</p><p>GH₵${p.price}</p><button onclick="addToCart('${p.id}')" class="bg-black text-white py-3 w-full rounded-full mt-3">ADD TO CART</button>`;}
function closeProduct(){document.getElementById('productModal').style.display='none';}
function addToCart(id){const p=products.find(x=>String(x.id)===String(id));cart.push(p);localStorage.setItem('dornny_cart',JSON.stringify(cart));render();showToast('Added 🛍️');}
function openAddModal(){document.getElementById('addModal').style.display='flex';}function closeAdd(){document.getElementById('addModal').style.display='none';}
async function addProduct(){const name=document.getElementById('nName').value,price=parseFloat(document.getElementById('nPrice').value),img=document.getElementById('nImg').value;if(!name||!price||!img){showToast('Fill all');return;}products.unshift({id:Date.now(),name,price,img,imgs:[img]});render();closeAdd();showToast('Published ✅');}
function doLogin(){const e=document.getElementById('loginEmail').value,p=document.getElementById('loginPass').value;if(!e||!p){showToast('Enter email & password');return;}document.getElementById('loginScreen').style.display='none';localStorage.setItem('dornny_user',e);showToast('Welcome 🛍️');}
function skipLogin(){document.getElementById('loginScreen').style.display='none';}
if(localStorage.getItem('dornny_user'))document.getElementById('loginScreen').style.display='none';
function openLiveList(){document.getElementById('liveListModal').style.display='flex';renderLivePreview();}function closeLiveList(){document.getElementById('liveListModal').style.display='none';}
function startHostLive(){document.getElementById('customPrompt').style.display='flex';}
function shareLive(){
 if(!window.currentLiveId){showToast('Start live first');return;}
 const link = location.origin + location.pathname + "?live=" + window.currentLiveId;
 navigator.clipboard.writeText(link).then(()=>showToast('Invite link copied! Send to friend: '+link)).catch(()=>showToast(link));
}
async function actuallyStartLive(roomName){
 const product=products[0];closeLiveList();document.getElementById('liveRoomModal').style.display='block';
 document.getElementById('hostName').innerText="You (Host)";document.getElementById('liveProductImg').src=product.img;document.getElementById('liveProductName').innerText=product.name;document.getElementById('liveProductPrice').innerText="GH₵"+product.price;currentLiveProduct=product;
 if(window.liveStream)window.liveStream.getTracks().forEach(t=>t.stop());
 try{
  let stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},audio:true});
  const v=document.getElementById('liveVideo');v.srcObject=stream;await v.play();window.liveStream=stream;
  document.getElementById('liveComments').innerHTML='<p class="text-white bg-black/50 rounded-full px-3 py-1 text-[11px]">🔴 LIVE! Tap Invite to share</p>';
  if(firebaseConfig.apiKey.includes('DUMMY')){showToast('⚠️ REAL Firebase needed for friend to join! Add it in GitHub');return;}
  const doc=await db.collection("liveRooms").add({hostName:localStorage.getItem('dornny_user')||"Host",title:roomName,isLive:true,viewers:1,img:product.img,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  window.currentLiveId=doc.id;
  shareLive();
  liveUnsub=db.collection("liveRooms").doc(doc.id).collection("comments").orderBy("createdAt").onSnapshot(snap=>{
   const div=document.getElementById('liveComments');div.innerHTML=snap.docs.map(d=>{const c=d.data();return `<p class="text-[11px] text-white bg-black/40 rounded-full px-2 py-1 inline-block"><b class="text-yellow-300">${c.user}:</b> ${c.text}</p>`}).join('');div.scrollTop=div.scrollHeight;
  });
  db.collection("liveRooms").doc(doc.id).onSnapshot(s=>{if(s.data()) document.getElementById('viewerCount').innerText=s.data().viewers;});
 }catch(e){showToast("Camera: "+e.message);}
}
async function joinLive(id){
 document.getElementById('liveListModal').style.display='none';
 document.getElementById('liveRoomModal').style.display='block';
 const product=products[0];
 document.getElementById('hostName').innerText="DORNNY Live";document.getElementById('liveProductImg').src=product.img;
 document.getElementById('liveProductName').innerText=product.name;document.getElementById('liveProductPrice').innerText="GH₵"+product.price;currentLiveProduct=product;
 document.getElementById('liveVideo').poster=product.img;
 document.getElementById('liveComments').innerHTML='<p class="text-white bg-black/50 rounded px-3 py-1 text-[11px]">Joined 👋</p>';
 if(!firebaseConfig.apiKey.includes('DUMMY') && db){
  window.currentLiveId=id;
  try{
   liveUnsub=db.collection("liveRooms").doc(id).collection("comments").orderBy("createdAt").onSnapshot(snap=>{
    const div=document.getElementById('liveComments');div.innerHTML=snap.docs.map(d=>{const c=d.data();return `<p class="text-[11px] text-white bg-black/40 rounded-full px-2 py-1 inline-block"><b class="text-yellow-300">${c.user}:</b> ${c.text}</p>`}).join('');
   });
   db.collection("liveRooms").doc(id).update({viewers:firebase.firestore.FieldValue.increment(1)});
   db.collection("liveRooms").doc(id).onSnapshot(s=>{if(s.data()) document.getElementById('viewerCount').innerText=s.data().viewers;});
  }catch(e){showToast('Live ended');}
 }else{showToast('Demo live - add REAL Firebase for real join');}
}
function addCommentSystem(t){const d=document.getElementById('liveComments');d.innerHTML+=`<p class="text-white bg-black/40 rounded-full px-2 py-1 text-[11px] inline-block">${t}</p>`;d.scrollTop=d.scrollHeight;}
async function sendComment(){const i=document.getElementById('liveCommentInput');const text=i.value.trim();if(!text)return;const user=localStorage.getItem('dornny_user')||"Guest";if(db && window.currentLiveId &&!firebaseConfig.apiKey.includes('DUMMY')){await db.collection("liveRooms").doc(window.currentLiveId).collection("comments").add({user,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}else{addCommentSystem(user+": "+text);}i.value='';}
function addToCartLive(){if(currentLiveProduct)addToCart(currentLiveProduct.id);}
function closeLive(){if(window.liveStream)window.liveStream.getTracks().forEach(t=>t.stop());if(liveUnsub)liveUnsub();document.getElementById('liveRoomModal').style.display='none';if(db && window.currentLiveId && document.getElementById('hostName').innerText.includes("You") &&!firebaseConfig.apiKey.includes('DUMMY')){db.collection("liveRooms").doc(window.currentLiveId).update({isLive:false});}history.replaceState(null,'',location.pathname);}
const urlParams=new URLSearchParams(window.location.search);const liveId=urlParams.get('live');if(liveId){setTimeout(()=>joinLive(liveId),1000);}
setInterval(()=>{const el=document.getElementById('timer');if(!el)return;let[h,m,s]=el.innerText.split(':').map(Number);s--;if(s<0){s=59;m--}if(m<0){m=59;h--}el.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},1000);
render();renderLivePreview();
</script>
</body>
</html>
