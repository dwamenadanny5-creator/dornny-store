<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dornny Market - Ghana's Marketplace</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#008000">
<link rel="icon" href="icon-192.png">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
.header{background:#008000;color:white;padding:15px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.header img{width:45px;height:45px;border-radius:10px;background:white;padding:3px}
.btn{background:#008000;color:white;padding:12px 20px;border:none;border-radius:8px;font-size:16px;margin:8px;text-decoration:none;display:inline-block}
.container{padding:20px;text-align:center}
.card{background:white;padding:20px;margin:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
</style>
</head>
<body>
<div class="header">
<img src="icon-192.png" alt="logo">
<h1>Dornny Market</h1>
</div>
<div class="container">
<div class="card">
<h2>Welcome to Dornny Market 🇬🇭</h2>
<p>Ghana's Biggest Buy & Sell Marketplace</p>
<a href="sell.html" class="btn">Sell Something</a>
<a href="dornny-live.html" class="btn" style="background:#ff0000">Dornny Live</a>
</div>
<div class="card">
<h3>Quick Links</h3>
<a href="admin.html" class="btn">Admin</a>
<a href="live.html" class="btn">Live</a>
<a href="watch.html" class="btn">Watch</a>
</div>
</div>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
