<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORNNY MARKET</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="bg-white p-3 flex justify-between sticky top-0 shadow">
<b class="text-red-600">DORNNY MARKET</b>
<a href="sell.html" class="bg-green-500 text-white px-4 py-1 rounded-full">+SELL</a>
</div>
<div id="products" class="grid grid-cols-2 gap-2 p-2"></div>
<script>
let items=[
{title:"iPhone 13 Pro",price:4500,cat:"phones",img:"https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=300"},
{title:"Ladies Dress",price:250,cat:"fashion",img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=300"},
{title:"Nike Air",price:350,cat:"shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"}
];
let h="";
items.forEach(p=>{
h+=`<div class="bg-white rounded-xl p-2 shadow"><img src="${p.img}" class="h-28 w-full object-cover rounded"><b>${p.title}</b><p class="text-red-600">₵${p.price}</p></div>`;
});
document.getElementById("products").innerHTML=h;
</script>
</body>
</html>
