const db = getFirestore(app);
window.db=db; window.fb={collection, addDoc, onSnapshot, query, orderBy};
// AUTO DISPLAY TOP DASHBOARD - HIDE ON LIVE
onSnapshot(query(collection(db,"products")),(snap)=>{
 let c=[]; snap.forEach(d=>c.push(d.data()));
 if(c.length>0&&window.products){
  window.products=[...c];
  if(window.renderProducts)window.renderProducts();
 }
});
setInterval(()=>{
 let d=document.getElementById('topSellerDashboard');
 let l=document.getElementById('livePage');
 if(d&&l&&!l.classList.contains('hidden')){
  d.classList.add('hidden');
  d.style.setProperty('display','none','important');
 }else if(d&&l&&l.classList.contains('hidden')){
  d.style.removeProperty('display');
 }
},300);

<script>function quickPrev(){let f=document.getElementById('quickPFile').files[0];let r=new FileReader();r.onload=e=>{let i=document.getElementById('quickPPreview');i.src=e.target.result;i.classList.remove('hidden');i.dataset.b64=e.target.result};r.readAsDataURL(f)}async function quickUp(){let n=document.getElementById('quickPName').value;let p=document.getElementById('quickPPrice').value;let img=document.getElementById('quickPPreview')?.dataset?.b64||'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500';if(!n||!p)return alert('Enter name & price');let u=JSON.parse(localStorage.getItem('dw_user')||'{}');let d={name:n,price:parseInt(p),cat:'home',imgs:[img],seller:u.name||'Shop',rating:5,created:Date.now()};await window.fb.addDoc(window.fb.collection(window.db,"products"),d);alert('✅ LIVE AT TOP FOR ALL BUYERS!');}}  
let sheinDot=0;
setInterval(()=>{
 let dots=document.querySelectorAll('.flex.justify-center.gap-1\\.5 span');
 if(!dots.length) return;
 dots.forEach(x=>x.className='w-2 h-2 bg-white/40 rounded-full');

<script>
let products=JSON.parse(localStorage.getItem('dw_products')||'null')||[
{id:1,name:"Men's Cotton Shirt",price:89,cat:"men",imgs:["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500","https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500"],seller:"Kwame Shop",rating:4.5,likes:120,followers:340},
{id:2,name:"Women's Summer Dress",price:129,cat:"women",imgs:["https://images.unsplash.com/photo-1515372039744-b8f02a3c67ae?w=500","https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500"],seller:"Ama Fashion",rating:4.8,likes:230,followers:512},
{id:3,name:"Kids Nike Sneakers",price:65,cat:"kids",imgs:["https://images.unsplash.com/photo-1514989940723-e8e51635b782?w=500","https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500"],seller:"Kids World",rating:4.6,likes:90,followers:210},
{id:4,name:"Gold Necklace 18K",price:199,cat:"jewelry",imgs:["https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500","https://images.unsplash.com/photo-1601821765780-754fa98637c1?w=500"],seller:"Jewelry GH",rating:4.9,likes:400,followers:900},
{id:5,name:"Car Engine Oil 5L",price:599,cat:"cars",imgs:["https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=500","https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500"],seller:"Auto GH",rating:4.7,likes:150,followers:300},
{id:6,name:"Smart TV 55 inch UHD",price:899,cat:"electronics",imgs:["https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=500","https://images.unsplash.com/photo-1588508065123-287b28e013da?w=500"],seller:"Electro Mart",rating:4.8,likes:320,followers:650},
{id:7,name:"Office Leather Chair",price:250,cat:"office",imgs:["https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500","https://images.unsplash.com/photo-1505843513577-22bb7d21e455?w=500"],seller:"Office GH",rating:4.4,likes:80,followers:180},
{id:8,name:"Pet Dog Food 10kg",price:45,cat:"pets",imgs:["https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=500","https://images.unsplash.com/photo-1589924691995-c10eee878e60?w=500"],seller:"Pet Lover",rating:4.5,likes:60,followers:140},
];
let cart=[]; let currentCat='All'; let following=new Set(JSON.parse(localStorage.getItem('following')||'[]')); let liked=new Set();
let peer=null; let dataConns=[]; let liveLikes=0; let localStream=null;

function renderProducts(list){
let grid=document.getElementById('productGrid');
grid.innerHTML=list.map(p=>`
<div class="bg-white rounded-xl overflow-hidden shadow-sm" onclick="openDetail(${p.id})">
<div class="relative"><img src="${p.imgs[0]}" class="w-full h-40 object-cover"><button onclick="event.stopPropagation();likeProduct(${p.id})" class="absolute top-2 right-2 bg-white rounded-full w-7 h-7"><i class="fa fa-heart ${liked.has(p.id)?'text-red-500':''}"></i></button></div>
<div class="p-2"><p class="text-sm font-medium truncate">${p.name}</p><p class="font-bold">GH₵ ${p.price}</p><p class="text-xs text-gray-500">${p.seller} ⭐${p.rating}</p></div>
</div>`).join('');
document.getElementById('trendGrid').innerHTML=grid.innerHTML;
}
function filterCat(c){
currentCat=c; document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');
if(c==='All') renderProducts(products); else renderProducts(products.filter(p=>p.cat===c));
}
function filterProducts(){
let q=document.getElementById('searchInput').value.toLowerCase();
renderProducts(products.filter(p=>p.name.toLowerCase().includes(q)));
}
function openDetail(id){
let p=products.find(x=>x.id===id);
document.getElementById('detailSlider').innerHTML=p.imgs.map(i=>`<img src="${i}">`).join('');
document.getElementById('detailInfo').innerHTML=`
<h2 class="font-bold text-lg">${p.name}</h2><p class="text-red-500 font-bold text-xl">GH₵ ${p.price}</p>
<p class="text-sm mt-1">Seller: ${p.seller} <button onclick="followSeller('${p.seller}')" class="ml-2 bg-black text-white px-3 py-1 rounded-full text-xs">${following.has(p.seller)?'Following':'Follow'}</button></p>
<div class="flex gap-1 mt-2">${[1,2,3,4,5].map(s=>`<i class="fa fa-star ${s<=p.rating?'text-yellow-400':''}"></i>`).join('')} <span class="text-xs">(${p.likes})</span></div>
<div class="mt-3 flex gap-2"><button onclick="addToCart(${p.id})" class="flex-1 bg-[#ff0050] text-white py-3 rounded-full font-bold">Add to Cart</button><button onclick="buyNow(${p.id})" class="flex-1 bg-black text-white py-3 rounded-full font-bold">Buy Now</button></div>
<div class="mt-4"><h3 class="font-bold">Comments & Ratings</h3><div id="commentList" class="mt-2 space-y-2"></div><div class="flex gap-2 mt-2"><input id="commentInput" placeholder="Add comment & rate seller..." class="flex-1 border rounded-full px-3 py-2"><button onclick="addComment(${p.id})" class="bg-black text-white px-4 rounded-full">Post</button></div></div>
<div class="mt-4 flex gap-2"><button onclick="requestRefund()" class="flex-1 border py-2 rounded-full text-sm">Refund</button><button onclick="reportIssue()" class="flex-1 border py-2 rounded-full text-sm">Report Seller</button></div>
`;
showPage('detailPage');
}
function addToCart(id){let p=products.find(x=>x.id===id);cart.push(p);updateCart();}
function updateCart(){document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartItems').innerHTML=cart.map((p,i)=>`<div class="bg-white p-2 rounded-xl flex gap-2 mb-2"><img src="${p.imgs[0]}" class="w-16 h-16 rounded"><div class="flex-1"><p class="text-sm">${p.name}</p><p class="font-bold">GH₵ ${p.price}</p></div><button onclick="cart.splice(${i},1);updateCart()" class="text-red-500"><i class="fa fa-trash"></i></button></div>`).join('')+`<p class="font-bold mt-2">Total: GH₵ ${cart.reduce((s,p)=>s+p.price,0)}</p>`;}
function likeProduct(id){if(liked.has(id)) liked.delete(id); else liked.add(id); renderProducts(currentCat==='All'?products:products.filter(p=>p.cat===currentCat));}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);if(id==='mePage') checkLogin();}
function login(){let name=document.getElementById('userName').value;let role=document.getElementById('userRole').value;let phone=document.getElementById('userPhone').value;if(!name)return alert('Enter name');localStorage.setItem('dw_user',JSON.stringify({name,role,phone}));Notification.requestPermission();alert('Logged in as '+role+' - Notifications ON 🔔');checkLogin();}
function checkLogin(){let u=JSON.parse(localStorage.getItem('dw_user')||'null');if(u){document.getElementById('loginBox').classList.add('hidden');document.getElementById('profileBox').classList.remove('hidden');document.getElementById('profileName').innerText=u.name;document.getElementById('profileRole').innerText=u.role;document.getElementById('followCount').innerText=following.size;if(u.role==='seller'){document.getElementById('sellerDashboard').classList.remove('hidden');showSellerProducts();}else{document.getElementById('sellerDashboard').classList.add('hidden');}}else{document.getElementById('loginBox').classList.remove('hidden');document.getElementById('profileBox').classList.add('hidden');document.getElementById('sellerDashboard').classList.add('hidden');}}
function logout(){localStorage.removeItem('dw_user');checkLogin();}
function followSeller(name){if(!name) name='Seller Official';if(following.has(name))following.delete(name);else{following.add(name);if(Notification.permission==='granted') new Notification('Following '+name+'! You will be notified when they go LIVE 🔴');}localStorage.setItem('following',JSON.stringify([...following]));let btn=document.getElementById('followBtn');if(btn)btn.innerText=following.has(name)?'Following ✓':'+ Follow';if(document.getElementById('followCount'))document.getElementById('followCount').innerText=following.size;}
function addComment(id){let txt=document.getElementById('commentInput').value;if(!txt)return;let div=document.getElementById('commentList');div.innerHTML+=`<div class="bg-gray-100 p-2 rounded-xl text-sm"><b>You:</b> ${txt} ⭐⭐⭐⭐⭐</div>`;document.getElementById('commentInput').value='';}
function getLocation(){navigator.geolocation.getCurrentPosition(pos=>{document.getElementById('userLocation').innerText=pos.coords.latitude.toFixed(3)+','+pos.coords.longitude.toFixed(3)+' - Accra';document.getElementById('liveLoc').innerText='Accra, GH (Live)';});}
function checkout(){if(cart.length===0)return alert('Cart empty');alert('Order placed! Seller will be notified. You will get phone notification when shipped.');cart=[];updateCart();}
function requestRefund(){let r=prompt('Reason for refund?');if(r){alert('Refund request sent! You will get notification within 24h.');}}
function reportIssue(){let r=prompt('Report issue between buyer & seller:');if(r){alert('Report sent to admin! We will resolve in 24h.');}}
function sendMsg(){let t=document.getElementById('msgInput').value;if(!t)return;document.getElementById('msgList').innerHTML+=`<div class="bg-[#ff0050] text-white p-2 rounded-xl self-end ml-10">You: ${t}</div>`;document.getElementById('msgInput').value='';setTimeout(()=>{document.getElementById('msgList').innerHTML+=`<div class="bg-white p-2 rounded-xl mr-10">Seller: Thanks! We will deliver soon 🚚</div>`},1000);}
function buyNow(id){addToCart(id);showPage('cartPage');}
function previewFile(){let f=document.getElementById('pFile').files[0];if(f){let r=new FileReader();r.onload=e=>{let img=document.getElementById('pPreview');img.src=e.target.result;img.classList.remove('hidden');img.dataset.base64=e.target.result;};r.readAsDataURL(f);}}
function uploadProduct(){
let name=document.getElementById('pName').value;let price=document.getElementById('pPrice').value;let cat=document.getElementById('pCat').value;let img1=document.getElementById('pImg1').value;let img2=document.getElementById('pImg2').value;let preview=document.getElementById('pPreview').dataset.base64;
if(!name||!price)return alert('Enter name and price');
let imgs=[];if(preview)imgs.push(preview);if(img1)imgs.push(img1);if(img2)imgs.push(img2);if(imgs.length===0)imgs.push(`https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500`);
let u=JSON.parse(localStorage.getItem('dw_user')||'{}');
let newP={id:Date.now(),name,price:parseInt(price),cat,imgs,seller:u.name||'My Shop',rating:5.0,likes:0,followers:0};
products.unshift(newP);localStorage.setItem('dw_products',JSON.stringify(products));renderProducts(products);showSellerProducts();
document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImg1').value='';document.getElementById('pImg2').value='';
alert('✅ Product uploaded! Now showing on Home dashboard AUTOMATICALLY!');
if(Notification.permission==='granted') new Notification('New product: '+name+' live on dashboard!');
}
function showSellerProducts(){let u=JSON.parse(localStorage.getItem('dw_user')||'{}');let mine=products.filter(p=>p.seller===u.name);document.getElementById('myProducts').innerHTML='<p class="font-bold text-sm mt-2">My Products ('+mine.length+'):</p>'+mine.map(p=>`<div class="flex gap-2 p-2 border rounded-xl mt-1"><img src="${p.imgs[0]}" class="w-12 h-12 rounded object-cover"><div class="flex-1 text-sm"><p>${p.name}</p><p class="font-bold">GH₵ ${p.price}</p></div><button onclick="deleteProduct(${p.id})" class="text-red-500 text-xs">Delete</button></div>`).join('');}
function deleteProduct(id){products=products.filter(p=>p.id!==id);localStorage.setItem('dw_products',JSON.stringify(products));renderProducts(products);showSellerProducts();}
function initPeer(){if(peer)return;peer=new Peer(null,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',id=>console.log(id));peer.on('connection',conn=>{dataConns.push(conn);conn.on('data',d=>{if(d.type==='comment'){let el=document.getElementById('liveComments');if(el)el.innerHTML+=`<div style="background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:12px;margin:4px 0;"><b>Buyer:</b> ${d.text}</div>`;}else if(d.type==='like'){liveLikes=d.count;let lc=document.getElementById('likeCount');if(lc)lc.innerText=liveLikes;}});});peer.on('call',call=>{call.answer(localStream);});}
async function goLive(){
initPeer();let v=document.getElementById('localVideo');
try{localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});v.srcObject=localStream;}catch(e){alert('Camera error: need HTTPS and allow camera');return;}
showLiveChat(false);let id=peer.id;document.getElementById('liveRoomInput').value=id;document.getElementById('liveRoomInput').style.display='block';document.getElementById('liveRoomInput').type='text';
if(Notification.permission==='granted'){new Notification('🔴 You are LIVE! Followers notified');}localStorage.setItem('live_now',id);
}
async function watchLive(){
initPeer();let roomId=document.getElementById('liveRoomInput').value.trim();if(!roomId){roomId=localStorage.getItem('live_now'); if(!roomId)return alert('Enter Live ID');}
let conn=peer.connect(roomId);conn.on('open',()=>{dataConns.push(conn);showLiveChat(true);let call=peer.call(roomId,localStream||new MediaStream());call.on('stream',s=>{document.getElementById('localVideo').srcObject=s;});});
}
function showLiveChat(isBuyer){
let inp=document.getElementById('liveRoomInput');if(!isBuyer&&inp)inp.style.display='none';
document.querySelectorAll('button').forEach(b=>{let t=b.innerText;if(t.includes('GO LIVE')||t.includes('WATCH')) b.style.display='none';});
let old=document.getElementById('liveChatBox');if(old)old.remove();let p=document.getElementById('localVideo').parentElement;p.style.position='relative';
let chat=document.createElement('div');chat.id='liveChatBox';chat.innerHTML=`<div id="liveComments" style="position:absolute;bottom:110px;left:10px;right:80px;max-height:180px;overflow-y:auto;color:white;font-size:14px;z-index:9999;"></div><div style="position:absolute;bottom:12px;left:10px;right:75px;display:flex;gap:6px;z-index:9999;"><input id="liveCommentInput" placeholder="Say something..." style="flex:1;padding:14px;border-radius:25px;border:none;outline:none;"><button onclick="sendLiveComment()" style="background:#ff0050;color:white;padding:12px 18px;border-radius:25px;border:none;font-weight:bold;">Send</button></div><div style="position:absolute;bottom:12px;right:10px;display:flex;flex-direction:column;align-items:center;z-index:9999;"><button onclick="sendLiveLike()" style="font-size:28px;background:rgba(0,0,0,0.6);border-radius:50%;width:56px;height:56px;border:none;">❤️</button><span id="likeCount" style="color:white;font-weight:bold;">0</span></div>`;
p.appendChild(chat);
}
function sendLiveComment(){let i=document.getElementById('liveCommentInput');let txt=i.value.trim();if(!txt)return;let c=document.getElementById('liveComments');c.innerHTML+=`<div style="background:rgba(255,0,80,0.85);padding:6px 10px;border-radius:12px;margin:4px 0;"><b>You:</b> ${txt}</div>`;i.value='';c.scrollTop=c.scrollHeight;dataConns.forEach(conn=>{try{conn.send({type:'comment',text:txt});}catch(e){}});}
function sendLiveLike(){liveLikes++;let lc=document.getElementById('likeCount');if(lc)lc.innerText=liveLikes;let c=document.getElementById('liveComments');if(c)c.innerHTML+=`<div>❤️ You liked!</div>`;dataConns.forEach(conn=>{try{conn.send({type:'like',count:liveLikes});}catch(e){}});}
renderProducts(products);checkLogin();getLocation();
if('Notification' in window) Notification.requestPermission();
// === DWAMEN SELLER + BUYER DASHBOARD AUTO ===
function getUser(){ try{return JSON.parse(localStorage.getItem('dwamen_user')||'{}')}catch(e){return {}} }
function getProducts(){ try{return JSON.parse(localStorage.getItem('dwamen_products')||'[]')}catch(e){return []} }

function checkTop(){
  let u=getUser();
  let isSeller=(u.role||'').toLowerCase()==='seller';
  let d=document.getElementById('sellerDashboard');

  // CREATE SELLER DASHBOARD IF NOT EXIST
  if(!d){
    d=document.createElement('div');
    d.id='sellerDashboard';
    d.innerHTML=`
      <div style="background:#fff;padding:14px;margin:10px;border-radius:12px;border:2px solid #ff0055;box-shadow:0 3px 10px rgba(0,0,0,0.1)">
        <div style="font-weight:bold;font-size:17px;margin-bottom:10px;">🏪 Seller Dashboard - ${u.username||'Danny'} <span style="font-size:12px;color:green;">● LIVE</span></div>

        <input type="file" id="prodImage" accept="image/*" style="width:100%;padding:8px;border:1px dashed #ff0055;border-radius:8px;margin-bottom:8px;">
        <input type="text" id="prodName" placeholder="Product name (e.g. Men's Shirt)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <input type="number" id="prodPrice" placeholder="Price GHS" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;">
          <select id="prodCat" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;"><option>All</option><option>Men</option><option>Women</option><option>Kids</option><option>Pets</option><option>Jewelry</option></select>
        </div>
        <button onclick="uploadProduct()" style="width:100%;background:#ff0055;color:#fff;padding:12px;border:none;border-radius:25px;font-weight:bold;">📤 Upload From Gallery - LIVE AT TOP</button>
        <div id="myProductsList" style="margin-top:10px;font-size:13px;color:#666;"></div>
      </div>`;
    // Add at very top of page
    document.body.prepend(d);
  }

  // SHOW/HIDE BASED ON ROLE
  if(d){
    d.style.display=isSeller?'block':'none';
    d.style.position='sticky';
    d.style.top='0px';
    d.style.zIndex='9999';
    d.style.background='#fff';
  }

  // BUYER SEES SELLER GOODS AT TOP - make filter sticky
  let filterDiv=null;
  document.querySelectorAll('div').forEach(div=>{
    if(div.textContent.includes('All') && div.textContent.includes('Men') && div.textContent.includes('Women')){
      if(div.children.length>=3) filterDiv=div;
    }
  });
  if(filterDiv){
    filterDiv.style.position='sticky';
    filterDiv.style.top=isSeller?'210px':'0px';
    filterDiv.style.zIndex='9998';
    filterDiv.style.background='#fff';
    filterDiv.style.padding='10px 0';
  }
}

// UPLOAD FROM GALLERY
function uploadProduct(){
  let file=document.getElementById('prodImage').files[0];
  let name=document.getElementById('prodName').value;
  let price=document.getElementById('prodPrice').value;
  let cat=document.getElementById('prodCat').value;
  if(!file||!name||!price){ alert('Please select image from gallery, name and price!'); return; }

  let reader=new FileReader();
  reader.onload=function(e){
    let products=getProducts();
    products.unshift({id:Date.now(), image:e.target.result, name:name, price:price, cat:cat, seller:getUser().username||'Danny', likes:0});
    localStorage.setItem('dwamen_products', JSON.stringify(products));
    alert('✅ Product LIVE AT TOP FOR ALL BUYERS!');
    document.getElementById('prodName').value='';
    document.getElementById('prodPrice').value='';
    document.getElementById('prodImage').value='';
    location.reload();
  };
  reader.readAsDataURL(file);
}

// RUN AUTO
setInterval(checkTop,1000);
checkTop();
</script>
</body>
