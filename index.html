<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORNNY Marketplace</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
.head{background:#0a3d1f;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
.head b{font-size:20px}.head b span{color:#f4b400}
.btn{background:#f4b400;color:#000;border:none;padding:10px 15px;border-radius:20px;font-weight:bold;margin-left:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:10px;overflow:hidden}
.card img{width:100%;height:140px;object-fit:cover}
.card div{padding:8px;font-size:13px}
.price{color:#0a3d1f;font-weight:bold}
.pop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:99}
.pop.show{display:flex}
.box{background:#fff;width:90%;max-width:320px;border-radius:15px;overflow:hidden}
.box img{width:100%;height:220px;object-fit:cover}
.box2{padding:15px}
</style>
</head>
<body>
<div class="head"><b>DORNNY<span>.</span></b><div><button class="btn">Ambassador</button><button class="btn">Open Shop (50 GHS)</button></div></div>
<div class="grid" id="list"></div>
<div class="pop" id="pop" onclick="if(event.target==this)hide()"><div class="box"><img id="pImg"><div class="box2"><h3 id="pTitle"></h3><p id="pPrice" class="price"></p><p id="pDesc" style="font-size:12px;color:#666"></p><button class="btn" style="width:100%;margin-top:10px;background:#0a3d1f;color:#fff" onclick="buy()">BUY ON WHATSAPP</button><button class="btn" style="width:100%;margin-top:5px;background:#eee" onclick="hide()">Close</button></div></div></div>
<script>
var items=[
{t:"Hoodie Black",p:"180 GHS",i:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400",d:"Original Ghana hoodie",m:"233594221108"},
{t:"Sneakers White",p:"250 GHS",i:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",d:"Trendy sneakers",m:"233594221108"},
{t:"T-Shirt",p:"80 GHS",i:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",d:"Soft cotton",m:"233594221108"},
{t:"Ladies Bag",p:"120 GHS",i:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400",d:"Stylish bag",m:"233594221108"},
{t:"Watch",p:"200 GHS",i:"https://images.unsplash.com/photo-1524805444973-bf390e004138?w=400",d:"Classic watch",m:"233594221108"},
{t:"Cap Black",p:"60 GHS",i:"https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400",d:"DORNNY cap",m:"233594221108"}
];
var cur=null;
function show(){
var h="";
for(var k=0;k<items.length;k++){
h+='<div class="card" onclick="view('+k+')"><img src="'+items[k].i+'"><div><b>'+items[k].t+'</b><br><span class="price">'+items[k].p+'</span></div></div>';
}
document.getElementById("list").innerHTML=h;
}
function view(k){cur=items[k];document.getElementById("pImg").src=cur.i;document.getElementById("pTitle").innerHTML=cur.t;document.getElementById("pPrice").innerHTML=cur.p;document.getElementById("pDesc").innerHTML=cur.d;document.getElementById("pop").classList.add("show");}
function hide(){document.getElementById("pop").classList.remove("show");}
function buy(){window.open("https://wa.me/"+cur.m+"?text=Hi I want "+cur.t+" "+cur.p+" from DORNNY");}
show();
</script>
</body>
</html>
