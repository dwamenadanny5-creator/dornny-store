87042-66d1773070a5?w=400"},{id:10,name:"T-shirt Black Cotton",price:80,cat:"shirt tops tshirt",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"}];var currentList=allProducts;function render(list){var g=document.getElementById("grid");g.innerHTML="";document.getElementById("resultCount").innerText=list.length+" items";list.forEach(function(p){g.innerHTML+='<div class="card" onclick="openP('+p.id+')"><img src="'+p.img+'"><div class="info"><h4>'+p.name+'</h4><div class="price">GH₵'+p.price+'</div></div></div>'});if(list.length==0){g.innerHTML='<div style="grid-column:1/-1;padding:20px;text-align:center;color:#666">No results for that - try shoe, sneaker, jean, hoodie</div>'}}function doSearch(){var q=document.getElementById("searchBox").value.toLowerCase().trim();if(!q){currentList=allProducts;document.getElementById("resultTitle").innerText="All Products";render(currentList);return}var filtered=allProducts.filter(function(p){return p.name.toLowerCase().includes(q)||p.cat.includes(q)});currentList=filtered;document.getElementById("resultTitle").innerText='Results for "'+q+'"';render(filtered)}function filterCat(cat){document.getElementById("searchBox").value=cat;if(!cat){currentList=allProducts;document.getElementById("resultTitle").innerText="All Products";render(allProducts);return}var filtered=allProducts.filter(function(p){return p.cat.includes(cat.toLowerCase())||p.name.toLowerCase().includes(cat.toLowerCase())});currentList=filtered;document.getElementById("resultTitle").innerText=cat.toUpperCase();render(filtered);window.scrollTo(0,300)}document.getElementById("searchBox").addEventListener("input",doSearch);document.getElementById("searchBox").addEventListener("keydown",function(e){if(e.key=="Enter")doSearch()});function openP(id){var p=allProducts.find(function(x){return x.id==id});document.getElementById("mImg").src=p.img;document.getElementById("mName").innerText=p.name;document.getElementById("mPrice").innerText="GH₵"+p.price+" FULL";
