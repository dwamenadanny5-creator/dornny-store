<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#f5f5f5;padding-bottom:130px}.top{background:#fff;padding:10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10}.top input{flex:1;background:#f2f2f2;border:0;border-radius:20px;padding:10px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#ddd}.card{background:#fff}.card .t{padding:8px;font-size:11px}.card .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .t span{font-weight:900}.card img{width:100%;height:230px;object-fit:cover;display:block}.open{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#FFD700;padding:14px 30px;border-radius:30px;font-weight:900;border:0;z-index:20;box-shadow:0 4px 10px rgba(0,0,0,.2)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:30}.nav div{text-align:center;font-size:9px;color:#888}</style></head><body>
<div class="top"><span>✉️</span><input placeholder="Search Jeans, Shoes, Sneakers..."><span>📷</span><span style="background:#111;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center">⌕</span><span>♡</span></div>

<div class="grid">
<div class="card"><div class="t"><b>Leather Shoes Brown</b><span>GH₵320</span></div><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop"></div>
<div class="card"><div class="t"><b>Pink Joggers 120 GHS Full</b><span>GH₵120</span></div><img src="https://images.unsplash.com/photo-1542272604-787c3835535d?w=400&h=400&fit=crop"></div>
<div class="card"><div class="t"><b>Nike Air Sneakers Red</b><span>GH₵350</span></div><img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=400&h=400&fit=crop"></div>
<div class="card"><div class="t"><b>Baggy Jeans Street</b><span>GH₵150</span></div><img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400&h=400&fit=crop"></div>
<div class="card"><div class="t"><b>Airmax Sneakers White</b><span>GH₵300</span></div><img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400&h=400&fit=crop"></div>
<div class="card"><div class="t"><b>T-shirt Black Cotton</b><span>GH₵80</span></div><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=400&fit=crop"></div>
</div>

<button class="open" onclick="document.getElementById('shopModal').style.display='flex'">OPEN SHOP - 50 GHS</button>

<div class="nav"><div>🏪<br>Shop</div><div>☰<br>Category</div><div>↗<br>Trends</div><div>🛒<br>Cart</div><div>👤<br>Me</div></div>

<div id="shopModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:15px"><div style="background:#fff;width:100%;max-width:340px;border-radius:14px;padding:15px"><h3>Open Shop - 50 GHS</h3><input id="n" placeholder="Full Name" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><input id="s" placeholder="Shop Name" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><input id="p" placeholder="WhatsApp 059..." style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><button style="width:100%;padding:12px;background:gold;border:0;border-radius:10px;font-weight:900;margin-top:8px" onclick="alert('Shop Registered! '+document.getElementById('s').value);document.getElementById('shopModal').style.display='none'">PAY 50 GHS & OPEN</button><button style="width:100%;padding:12px;background:#eee;border:0;border-radius:10px;margin-top:6px" onclick="document.getElementById('shopModal').style.display='none'">Close</button></div></div>
</body></html>
