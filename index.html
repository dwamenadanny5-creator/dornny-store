<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dwamena - Shop Like Temu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { -webkit-tap-highlight-color: transparent; }
.page { display:none; min-height:100vh; padding-bottom:90px; }
.page.active { display:block; }
.slider { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.slider::-webkit-scrollbar { display:none; }
.slider img { scroll-snap-align:center; min-width:100%; height:280px; object-fit:cover; }
.cat-btn.active { background:#ff0050; color:white; }
.no-scrollbar::-webkit-scrollbar{ display:none; }
</style>
</head>
<body class="bg-gray-50">

<!-- TOP BAR -->
<div class="sticky top-0 z-50 bg-white p-3 flex gap-2 items-center shadow">
<input id="searchInput" oninput="filterProducts()" placeholder="Search products..." class="flex-1 bg-gray-100 rounded-full px-4 py-2 outline-none">
<button onclick="showPage('cartPage')" class="relative"><i class="fa fa-shopping-cart text-xl"></i><span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span></button>
<button onclick="showPage('messagePage')"><i class="fa fa-comment text-xl"></i></button>
</div>

<!-- CATEGORIES -->
<div class="bg-white sticky top-[60px] z-40 p-2 overflow-x-auto no-scrollbar flex gap-2 whitespace-nowrap">
<button onclick="filterCat('All')" class="cat-btn active px-4 py-1.5 rounded-full bg-gray-100 text-sm">All</button>
<button onclick="filterCat('men')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Men</button>
<button onclick="filterCat('women')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Women</button>
<button onclick="filterCat('kids')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Kids</button>
<button onclick="filterCat('pets')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Pets</button>
<button onclick="filterCat('jewelry')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Jewelry & Accs</button>
<button onclick="filterCat('cars')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Cars</button>
<button onclick="filterCat('home')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Home Use</button>
<button onclick="filterCat('electronics')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Electronics</button>
<button onclick="filterCat('shoes')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Shoes</button>
<button onclick="filterCat('office')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Office</button>
<button onclick="filterCat('furnitures')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Furnitures</button>
<button onclick="filterCat('toys')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Toys</button>
<button onclick="filterCat('food')" class="cat-btn px-4 py-1.5 rounded-full bg-gray-100 text-sm">Food</button>
</div>

<!-- HOME PAGE -->
<div id="homePage" class="page active p-2">
<div id="productGrid" class="grid grid-cols-2 gap-2"></div>
</div>

<!-- PRODUCT DETAIL WITH IMAGE SLIDER -->
<div id="detailPage" class="page bg-white">
<button onclick="showPage('homePage')" class="p-3"><i class="fa fa-arrow-left"></i> Back</button>
<div id="detailSlider" class="slider"></div>
<div id="detailInfo" class="p-4"></div>
</div>

<!-- LIVE PAGE - TIKTOK STYLE -->
<div id="livePage" class="page bg-black">
<div class="relative w-full">
<video id="localVideo" autoplay muted playsinline style="width:100%;height:65vh;object-fit:cover;background:#000;border-radius:0 0 20px 20px;"></video>
<div class="p-3 flex gap-2">
<button onclick="goLive()" class="flex-1 bg-red-600 text-white py-3 rounded-full font-bold"><i class="fa fa-video"></i> GO LIVE</button>
<button onclick="watchLive()" class="flex-1 bg-white text-black py-3 rounded-full font-bold"><i class="fa fa-eye"></i> WATCH</button>
<input id="liveRoomInput" placeholder="Enter Live ID to watch" class="flex-1 bg-white rounded-full px-3 py-2 text-sm hidden">
</div>
<div id="liveSellerInfo" class="p-3 text-white flex items-center justify-between">
<div class="flex items-center gap-2">
<img src="https://i.pravatar.cc/40" class="rounded-full"><div><p class="font-bold text-sm">Seller Official</p><p class="text-xs text-gray-300"><i class="fa fa-location-dot"></i> <span id="liveLoc">Accra, GH</span></p></div>
</div>
<button onclick="followSeller()" id="followBtn" class="bg-[#ff0050] px-4 py-1 rounded-full text-sm">+ Follow</button>
</div>
</div>
</div>

<!-- TREND PAGE -->
<div id="trendPage" class="page p-3">
<h2 class="font-bold text-lg mb-2">🔥 Trending Now</h2>
<div id="trendGrid" class="grid grid-cols-2 gap-2"></div>
</div>

<!-- CART PAGE -->
<div id="cartPage" class="page p-3">
<h2 class="font-bold text-lg">My Cart</h2>
<div id="cartItems"></div>
<div class="mt-4 p-3 bg-white rounded-xl">
<p>Location: <span id="userLocation">Detecting...</span> <button onclick="getLocation()" class="text-blue-500 text-sm">Allow Location</button></p>
<button onclick="checkout()" class="w-full bg-[#ff0050] text-white py-3 rounded-full mt-3 font-bold">Checkout & Pay</button>
<button onclick="requestRefund()" class="w-full border py-2 rounded-full mt-2 text-sm">Request Refund</button>
<button onclick="reportIssue()" class="w-full border py-2 rounded-full mt-2 text-sm">Report Issue</button>
</div>
</div>

<!-- MESSAGE PAGE -->
<div id="messagePage" class="page p-3">
<h2 class="font-bold text-lg">Messages</h2>
<div id="msgList" class="mt-3 space-y-2"></div>
<div class="fixed bottom-[85px] left-2 right-2 flex gap-2">
<input id="msgInput" placeholder="Message seller..." class="flex-1 bg-white rounded-full px-4 py-3 border">
<button onclick="sendMsg()" class="bg-[#ff0050] text-white px-5 rounded-full">Send</button>
</div>
</div>

<!-- ME / LOGIN PAGE -->
<div id="mePage" class="page p-4">
<div id="loginBox" class="bg-white p-5 rounded-2xl">
<h2 class="font-bold text-xl mb-3">Login / Register</h2>
<input id="userName" placeholder="Your Name" class="w-full border p-3 rounded-xl mb-2">
<select id="userRole" class="w-full border p-3 rounded-xl mb-2"><option value="buyer">I am Buyer</option><option value="seller">I am Seller</option></select>
<input id="userPhone" placeholder="Phone number for notifications" class="w-full border p-3 rounded-xl mb-3">
<button onclick="login()" class="w-full bg-black text-white py-3 rounded-full font-bold">Login & Enable Notifications</button>
</div>
<div id="profileBox" class="hidden bg-white p-5 rounded-2xl">
<p class="font-bold text-lg" id="profileName"></p><p id="profileRole" class="text-sm text-gray-500"></p>
<p class="mt-2">Following: <span id="followCount">0</span> | Likes: <span id="totalLikes">0</span></p>
<button onclick="logout()" class="mt-4 border w-full py-2 rounded-full">Logout</button>
<button onclick="Notification.requestPermission()" class="mt-2 w-full bg-blue-500 text-white py-2 rounded-full text-sm">Enable Live Notifications 🔔</button>
</div>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-50">
<button onclick="showPage('homePage')" class="flex flex-col items-center text-xs"><i class="fa fa-home text-lg"></i>Home</button>
<button onclick="showPage('livePage')" class="flex flex-col items-center text-xs"><i class="fa fa-video text-lg text-red-500"></i>Live</button>
<button onclick="showPage('trendPage')" class="flex flex-col items-center text-xs"><i class="fa fa-fire text-lg"></i>Trend</button>
<button onclick="showPage('cartPage')" class="flex flex-col items-center text-xs"><i class="fa fa-bag-shopping text-lg"></i>Cart</button>
<button onclick="showPage('mePage')" class="flex flex-col items-center text-xs"><i class="fa fa-user text-lg"></i>Me</button>
</div>

<script>
let products=[
{id:1,name:"Men's Casual Shirt",price:89,cat:"men",imgs:["https://picsum.photos/400/400?random=1","https://picsum.photos/400/400?random=11"],seller:"Kwame Shop",rating:4.5,likes:120,followers:340},
{id:2,name:"Women's Dress",price:129,cat:"women",imgs:["https://picsum.photos/400/400?random=2","https://picsum.photos/400/400?random=12"],seller:"Ama Fashion",rating:4.8,likes:230,followers:512},
{id:3,name:"Kids Sneakers",price:65,cat:"kids",imgs:["https://picsum.photos/400/400?random=3","https://picsum.photos/400/400?random=13"],seller:"Kids World",rating:4.6,likes:90,followers:210},
{id:4,name:"Gold Necklace",price:199,cat:"jewelry",imgs:["https://picsum.photos/400/400?random=4","https://picsum.photos/400/400?random=14"],seller:"Jewelry GH",rating:4.9,likes:400,followers:900},
{id:5,name:"Toyota Parts",price:599,cat:"cars",imgs:["https://picsum.photos/400/400?random=5","https://picsum.photos/400/400?random=15"],seller:"Auto GH",rating:4.7,likes:150,followers:300},
{id:6,name:"Smart TV 55\"",price:899,cat:"electronics",imgs:["https://picsum.photos/400/400?random=6","https://picsum.photos/400/400?random=16"],seller:"Electro Mart",rating:4.8,likes:320,followers:650},
{id:7,name:"Office Chair",price:250,cat:"office",imgs:["https://picsum.photos/400/400?random=7","https://picsum.photos/400/400?random=17"],seller:"Office GH",rating:4.4,likes:80,followers:180},
{id:8,name:"Dog Food Premium",price:45,cat:"pets",imgs:["https://picsum.photos/400/400?random=8","https://picsum.photos/400/400?random=18"],seller:"Pet Lover",rating:4.5,likes:60,followers:140},
];
let cart=[]; let currentCat='All'; let following=new Set(JSON.parse(localStorage.getItem('following')||'[]')); let liked=new Set();
let peer=null; let dataConns=[]; let liveLikes=0; let localStream=null;

function renderProducts(list){
let grid=document.getElementById('productGrid');
grid.innerHTML=list.map(p=>`
<div class="bg-white rounded-xl overflow-hidden shadow-sm" onclick="openDetail(${p.id})">
<div class="relative"><img src="${p.imgs[0]}" class="w-full h-40 object-cover"><button onclick="event.stopPropagation();likeProduct(${p.id})" class="absolute top-2 right-2 bg-white rounded-full w-7 h-7"><i class="fa fa-heart ${liked.has(p.id)?'text-red-500':''}"></i></button></div>
<div class="p-2"><p class="text-sm font-medium truncate">${p.name}</p><p class="font-bold">GH₵ ${p.price}</p><p class="text-xs text-gray-500">${p.seller} ⭐${p.rating}</p></div>
</div>`).join('');
document.getElementById('trendGrid').innerHTML=grid.innerHTML;
}
function filterCat(c){
currentCat=c; document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');
if(c==='All') renderProducts(products); else renderProducts(products.filter(p=>p.cat===c));
}
function filterProducts(){
let q=document.getElementById('searchInput').value.toLowerCase();
renderProducts(products.filter(p=>p.name.toLowerCase().includes(q)));
}
function openDetail(id){
let p=products.find(x=>x.id===id);
document.getElementById('detailSlider').innerHTML=p.imgs.map(i=>`<img src="${i}">`).join('');
document.getElementById('detailInfo').innerHTML=`
<h2 class="font-bold text-lg">${p.name}</h2><p class="text-red-500 font-bold text-xl">GH₵ ${p.price}</p>
<p class="text-sm mt-1">Seller: ${p.seller} <button onclick="followSeller('${p.seller}')" class="ml-2 bg-black text-white px-3 py-1 rounded-full text-xs">${following.has(p.seller)?'Following':'Follow'}</button></p>
<div class="flex gap-1 mt-2">${[1,2,3,4,5].map(s=>`<i class="fa fa-star ${s<=p.rating?'text-yellow-400':''}"></i>`).join('')} <span class="text-xs">(${p.likes})</span></div>
<div class="mt-3 flex gap-2"><button onclick="addToCart(${p.id})" class="flex-1 bg-[#ff0050] text-white py-3 rounded-full font-bold">Add to Cart</button><button onclick="buyNow(${p.id})" class="flex-1 bg-black text-white py-3 rounded-full font-bold">Buy Now</button></div>
<div class="mt-4"><h3 class="font-bold">Comments & Ratings</h3><div id="commentList" class="mt-2 space-y-2"></div><div class="flex gap-2 mt-2"><input id="commentInput" placeholder="Add comment & rate seller..." class="flex-1 border rounded-full px-3 py-2"><button onclick="addComment(${p.id})" class="bg-black text-white px-4 rounded-full">Post</button></div></div>
<div class="mt-4 flex gap-2"><button onclick="requestRefund()" class="flex-1 border py-2 rounded-full text-sm">Refund</button><button onclick="reportIssue()" class="flex-1 border py-2 rounded-full text-sm">Report Seller</button></div>
`;
showPage('detailPage');
}
function addToCart(id){let p=products.find(x=>x.id===id);cart.push(p);updateCart();}
function updateCart(){document.getElementById('cartCount').innerText=cart.length;document.getElementById('cartItems').innerHTML=cart.map((p,i)=>`<div class="bg-white p-2 rounded-xl flex gap-2 mb-2"><img src="${p.imgs[0]}" class="w-16 h-16 rounded"><div class="flex-1"><p class="text-sm">${p.name}</p><p class="font-bold">GH₵ ${p.price}</p></div><button onclick="cart.splice(${i},1);updateCart()" class="text-red-500"><i class="fa fa-trash"></i></button></div>`).join('')+`<p class="font-bold mt-2">Total: GH₵ ${cart.reduce((s,p)=>s+p.price,0)}</p>`;}
function likeProduct(id){if(liked.has(id)) liked.delete(id); else liked.add(id); renderProducts(currentCat==='All'?products:products.filter(p=>p.cat===currentCat));}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);if(id==='mePage') checkLogin();}
function login(){let name=document.getElementById('userName').value;let role=document.getElementById('userRole').value;let phone=document.getElementById('userPhone').value;if(!name)return alert('Enter name');localStorage.setItem('dw_user',JSON.stringify({name,role,phone}));Notification.requestPermission();alert('Logged in as '+role+' - Notifications ON 🔔');checkLogin();}
function checkLogin(){let u=JSON.parse(localStorage.getItem('dw_user')||'null');if(u){document.getElementById('loginBox').classList.add('hidden');document.getElementById('profileBox').classList.remove('hidden');document.getElementById('profileName').innerText=u.name;document.getElementById('profileRole').innerText=u.role;document.getElementById('followCount').innerText=following.size;}else{document.getElementById('loginBox').classList.remove('hidden');document.getElementById('profileBox').classList.add('hidden');}}
function logout(){localStorage.removeItem('dw_user');checkLogin();}
function followSeller(name){if(!name) name='Seller Official';if(following.has(name))following.delete(name);else{following.add(name);if(Notification.permission==='granted') new Notification('Following '+name+'! You will be notified when they go LIVE 🔴');}localStorage.setItem('following',JSON.stringify([...following]));document.getElementById('followBtn').innerText=following.has(name)?'Following ✓':'+ Follow';if(document.getElementById('followCount'))document.getElementById('followCount').innerText=following.size;}
function addComment(id){let txt=document.getElementById('commentInput').value;if(!txt)return;let div=document.getElementById('commentList');div.innerHTML+=`<div class="bg-gray-100 p-2 rounded-xl text-sm"><b>You:</b> ${txt} ⭐⭐⭐⭐⭐</div>`;document.getElementById('commentInput').value='';}
function getLocation(){navigator.geolocation.getCurrentPosition(pos=>{document.getElementById('userLocation').innerText=pos.coords.latitude.toFixed(3)+','+pos.coords.longitude.toFixed(3)+' - Accra';document.getElementById('liveLoc').innerText='Accra, GH (Live)';});}
function checkout(){if(cart.length===0)return alert('Cart empty');alert('Order placed! Seller will be notified. You will get phone notification when shipped.');cart=[];updateCart();}
function requestRefund(){let r=prompt('Reason for refund?');if(r){alert('Refund request sent! You will get notification within 24h. Order will be refunded if seller agrees.');}}
function reportIssue(){let r=prompt('Report issue between buyer & seller:');if(r){alert('Report sent to admin! We will resolve in 24h. You will be notified.');}}
function sendMsg(){let t=document.getElementById('msgInput').value;if(!t)return;document.getElementById('msgList').innerHTML+=`<div class="bg-[#ff0050] text-white p-2 rounded-xl self-end ml-10">You: ${t}</div>`;document.getElementById('msgInput').value='';setTimeout(()=>{document.getElementById('msgList').innerHTML+=`<div class="bg-white p-2 rounded-xl mr-10">Seller: Thanks! We will deliver soon 🚚</div>`},1000);}
function buyNow(id){addToCart(id);showPage('cartPage');}
function initPeer(){if(peer)return;peer=new Peer(null,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',id=>console.log(id));peer.on('connection',conn=>{dataConns.push(conn);conn.on('data',d=>{if(d.type==='comment'){document.getElementById('liveComments').innerHTML+=`<div style="background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:12px;margin:4px 0;"><b>Buyer:</b> ${d.text}</div>`;}else if(d.type==='like'){liveLikes=d.count;document.getElementById('likeCount').innerText=liveLikes;}});});peer.on('call',call=>{call.answer(localStream);});}
async function goLive(){
initPeer();let v=document.getElementById('localVideo');
try{localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});v.srcObject=localStream;}catch(e){alert('Camera error: need HTTPS and allow camera');return;}
showLiveChat(false);let id=peer.id;document.getElementById('liveRoomInput').value=id;document.getElementById('liveRoomInput').style.display='block';document.getElementById('liveRoomInput').type='text';
if(Notification.permission==='granted'){new Notification('🔴 You are LIVE! Followers notified');}localStorage.setItem('live_now',id);
let followers=[...following];if(followers.length>0 && Notification.permission==='granted'){new Notification('Followers will be notified you are LIVE now!');}
}
async function watchLive(){
initPeer();let roomId=document.getElementById('liveRoomInput').value.trim();if(!roomId){roomId=localStorage.getItem('live_now'); if(!roomId)return alert('Enter Live ID');}
let conn=peer.connect(roomId);conn.on('open',()=>{dataConns.push(conn);showLiveChat(true);let call=peer.call(roomId,localStream||new MediaStream());call.on('stream',s=>{document.getElementById('localVideo').srcObject=s;});});
}
function showLiveChat(isBuyer){
let inp=document.getElementById('liveRoomInput');if(!isBuyer&&inp)inp.style.display='none';
document.querySelectorAll('button').forEach(b=>{let t=b.innerText;if(t.includes('GO LIVE')||t.includes('WATCH')) b.style.display='none';});
let old=document.getElementById('liveChatBox');if(old)old.remove();let p=document.getElementById('localVideo').parentElement;p.style.position='relative';
let chat=document.createElement('div');chat.id='liveChatBox';chat.innerHTML=`<div id="liveComments" style="position:absolute;bottom:110px;left:10px;right:80px;max-height:180px;overflow-y:auto;color:white;font-size:14px;z-index:9999;"></div><div style="position:absolute;bottom:12px;left:10px;right:75px;display:flex;gap:6px;z-index:9999;"><input id="liveCommentInput" placeholder="Say something..." style="flex:1;padding:14px;border-radius:25px;border:none;outline:none;"><button onclick="sendLiveComment()" style="background:#ff0050;color:white;padding:12px 18px;border-radius:25px;border:none;font-weight:bold;">Send</button></div><div style="position:absolute;bottom:12px;right:10px;display:flex;flex-direction:column;align-items:center;z-index:9999;"><button onclick="sendLiveLike()" style="font-size:28px;background:rgba(0,0,0,0.6);border-radius:50%;width:56px;height:56px;border:none;">❤️</button><span id="likeCount" style="color:white;font-weight:bold;">0</span></div>`;
p.appendChild(chat);
}
function sendLiveComment(){let i=document.getElementById('liveCommentInput');let txt=i.value.trim();if(!txt)return;let c=document.getElementById('liveComments');c.innerHTML+=`<div style="background:rgba(255,0,80,0.85);padding:6px 10px;border-radius:12px;margin:4px 0;"><b>You:</b> ${txt}</div>`;i.value='';c.scrollTop=c.scrollHeight;dataConns.forEach(conn=>{try{conn.send({type:'comment',text:txt});}catch(e){}});}
function sendLiveLike(){liveLikes++;let lc=document.getElementById('likeCount');if(lc)lc.innerText=liveLikes;let c=document.getElementById('liveComments');c.innerHTML+=`<div>❤️ You liked!</div>`;dataConns.forEach(conn=>{try{conn.send({type:'like',count:liveLikes});}catch(e){}});}

renderProducts(products);checkLogin();getLocation();
if('Notification' in window) Notification.requestPermission();
</script>
</body>
</html>
