<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dornny Market - Ghana's Online Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
header{background:black;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header h1{font-size:20px}
header a{background:#00b050;color:white;padding:8px 15px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:14px}
.searchBox{padding:10px;background:white;display:flex;gap:8px}
.searchBox input{flex:1;padding:12px;border-radius:25px;border:1px solid #ddd;background:#f0f0f0}
.filterBar{display:flex;gap:8px;padding:10px;overflow-x:auto;background:white}
.filterBar button{padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:white;white-space:nowrap}
.filterBar button.active{background:black;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:15px;overflow:hidden;position:relative}
.slider{position:relative;width:100%;height:160px;background:#eee;overflow:hidden}
.slider img{width:100%;height:100%;object-fit:cover;display:none}
.slider img.active{display:block}
.dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.dots span{width:6px;height:6px;background:rgba(255,255,255,0.5);border-radius:50%}
.dots span.active{background:white}
.navBtn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);color:white;border:none;width:24px;height:24px;border-radius:50%;font-size:12px}
.prev{left:5px}.next{right:5px}
.info{padding:8px}
.info h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p{font-size:12px;color:#777}
.price{color:#00b050;font-weight:bold;font-size:16px}
.buyBtn{background:black;color:white;border:none;padding:8px;width:100%;border-radius:10px;margin-top:6px;font-weight:bold}
.noProduct{text-align:center;padding:40px;color:#888;grid-column:1/-1}
</style>
</head>
<body>
<header>
<h1>Dornny Market</h1>
<a href="sell.html">+ Sell</a>
</header>
<div class="searchBox">
<input id="search" placeholder="Search products..." oninput="render()">
</div>
<div class="filterBar">
<button class="active" onclick="setCat('All',this)">All</button>
<button onclick="setCat('Fashion',this)">Fashion</button>
<button onclick="setCat('Boys top',this)">Boys top</button>
<button onclick="setCat('Shoes',this)">Shoes</button>
<button onclick="setCat('Electronics',this)">Electronics</button>
</div>
<div id="grid" class="grid"></div>

<script>
let currentCat='All';
let slideIntervals={};

function setCat(cat,btn){
 currentCat=cat;
 document.querySelectorAll('.filterBar button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 render();
}

function getProducts(){
 let stored=JSON.parse(localStorage.getItem('dornnyProducts')||'[]');
 // default products if nothing uploaded
 if(stored.length===0){
   return [
     {id:1,name:"Demo Shoe",desc:"Nice shoe",price:"120",category:"Shoes",images:["https://via.placeholder.com/300?text=Shoe"]},
     {id:2,name:"Demo Shirt",desc:"Club top",price:"80",category:"Boys top",images:["https://via.placeholder.com/300?text=Shirt"]}
   ];
 }
 return stored;
}

function render(){
 const grid=document.getElementById('grid');
 const search=document.getElementById('search').value.toLowerCase();
 let products=getProducts();

 let filtered=products.filter(p=>{
   const matchSearch = p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search);
   const matchCat = currentCat==='All' || p.category===currentCat || p.desc===currentCat;
   return matchSearch && matchCat;
 });

 if(filtered.length===0){
   grid.innerHTML='<div class="noProduct">No products found<br><br><a href="sell.html" style="color:#00b050">Upload first product</a></div>';
   return;
 }

 grid.innerHTML=filtered.map(p=>{
   let imgs=p.images||[p.image||"https://via.placeholder.com/300"];
   let dots=imgs.length>1?`<div class="dots">${imgs.map((_,i)=>`<span class="${i===0?'active':''}" id="dot-${p.id}-${i}"></span>`).join('')}</div>`:'';
   let nav=imgs.length>1?`<button class="navBtn prev" onclick="slide(${p.id},-1)">‹</button><button class="navBtn next" onclick="slide(${p.id},1)">›</button>`:'';
   let sliderImgs=imgs.map((src,i)=>`<img src="${src}" class="${i===0?'active':''}" id="img-${p.id}-${i}">`).join('');
   return `
   <div class="card" data-id="${p.id}">
     <div class="slider" id="slider-${p.id}">
       ${sliderImgs}
       ${dots}
       ${nav}
     </div>
     <div class="info">
       <h3>${p.name}</h3>
       <p>${p.desc} • ${p.category}</p>
       <div class="price">GH₵ ${p.price}</div>
       <button class="buyBtn" onclick="alert('Contact seller for ${p.name} - GH₵ ${p.price}')">Buy</button>
     </div>
   </div>`;
 }).join('');

 // auto slide every 3 sec for products with multiple images
 filtered.forEach(p=>{
   let imgs=p.images||[p.image];
   if(imgs.length>1){
     if(slideIntervals[p.id]) clearInterval(slideIntervals[p.id]);
     let cur=0;
     slideIntervals[p.id]=setInterval(()=>{
       cur=(cur+1)%imgs.length;
       showSlide(p.id,cur,imgs.length);
     },3000);
   }
 });
}

let currentSlides={};
function showSlide(id,index,total){
 for(let i=0;i<total;i++){
   let img=document.getElementById(`img-${id}-${i}`);
   let dot=document.getElementById(`dot-${id}-${i}`);
   if(img) img.classList.remove('active');
   if(dot) dot.classList.remove('active');
 }
 let activeImg=document.getElementById(`img-${id}-${index}`);
 let activeDot=document.getElementById(`dot-${id}-${index}`);
 if(activeImg) activeImg.classList.add('active');
 if(activeDot) activeDot.classList.add('active');
 currentSlides[id]=index;
}
function slide(id,dir){
 let products=getProducts();
 let p=products.find(x=>x.id==id);
 if(!p) return;
 let total=(p.images||[p.image]).length;
 let cur=currentSlides[id]||0;
 cur=(cur+dir+total)%total;
 showSlide(id,cur,total);
}
render();
</script>
</body>
</html>
