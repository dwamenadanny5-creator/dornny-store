<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORNNY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#fff;padding-bottom:70px}.top{padding:10px;background:#fff;position:sticky;top:0;border-bottom:1px solid #eee;display:flex;gap:8px}.top input{flex:1;background:#f0f0f0;border:0;border-radius:20px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#ddd}.card{background:#fff}.card img{width:100%;height:170px;object-fit:cover;display:block}.card div{padding:6px;font-size:11px}.page{display:none;padding:8px}.page.on{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 0}.nav b{font-size:11px;color:#999}.nav b.on{color:#000}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99}.modal.on{display:flex}.box{background:#fff;width:300px;border-radius:12px;overflow:hidden}.box img{width:100%;height:240px;object-fit:cover}.btn{width:100%;padding:12px;border:0;border-radius:8px;font-weight:800;margin-top:8px}.y{background:gold}.bk{background:#111;color:#fff}</style></head><body><div class="top"><input id="q" placeholder="Search..." oninput="filter()"><button onclick="filter()" style="width:36px;border-radius:50%;background:#111;color:#fff;border:0">Go</button></div><div id="shop" class="page on"><div style="padding:8px;font-weight:800" id="tit">Loading items...</div><div class="grid" id="grid"></div></div><div id="category" class="page"><h3>Category</h3><br><button onclick="goCat('shoe')" style="padding:12px;margin:4px">Shoes</button><button onclick="goCat('jean')" style="padding:12px;margin:4px">Jeans</button><button onclick="goCat('hoodie')" style="padding:12px;margin:4px">Hoodies</button><button onclick="goCat('')" style="padding:12px;margin:4px;background:#111;color:gold">All 12</button></div><div id="trends" class="page"><h3>Trends</h3><div id="tlist"></div></div><div id="cart" class="page"><h3>Cart (<span id="cn">0</span>)</h3><div id="clist">Empty</div></div><div id="me" class="page"><h3>Me - DORNNY MARKET 0594221108</h3><br><button class="btn y" onclick="tab('shop')">Shop Now</button></div><div class="nav"><b id="n-shop" class="on" onclick="tab('shop')">Shop</b><b id="n-category" onclick="tab('category')">Category</b><b id="n-trends" onclick="tab('trends')">Trends</b><b id="n-cart" onclick="tab('cart')">Cart</b><b id="n-me" onclick="tab('me')">Me</b></div><div class="modal" id="mP"><div class="box"><img id="mi"><div style="padding:10px"><p id="mn"></p><p id="mp" style="font-weight:900"></p><button class="btn bk" onclick="addC()">ADD TO CART</button><button class="btn y" onclick="buyW()">BUY WHATSAPP</button><button class="btn" style="background:#eee" onclick="closeP()">Close</button></div></div></div><script>var items=[{id:1,n:"Gray Hoodie",p:180,i:"https://via.placeholder.com/400x400/888/fff?text=Hoodie"},{id:2,n:"White Sneakers",p:250,i:"https://via.placeholder.com/400x400/fff/000?text=Sneaker"},{id:3,n:"Black Sneakers",p:280,i:"https://via.placeholder.com/400x400/000/fff?text=Black+Shoe"},{id:4,n:"Blue Jeans",p:126,i:"https://via.placeholder.com/400x400/00f/fff?text=Jeans"},{id:5,n:"Leather Shoes",p:320,i:"https://via.placeholder.com/400x400/654321/fff?text=Leather"},{id:6,n:"Pink Joggers",p:120,i:"https://via.placeholder.com/400x400/f0f/000?text=Jogger"},{id:7,n:"Black Hoodie",p:200,i:"https://via.placeholder.com/400x400/111/fff?text=Black+Hoodie"},{id:8,n:"Baggy Jeans",p:140,i:"https://via.placeholder.com/400x400/00a/fff?text=Baggy"},{id:9,n:"Red Sneakers",p:260,i:"https://via.placeholder.com/400x400/f00/fff?text=Red+Shoe"},{id:10,n:"White Shirt",p:90,i:"https://via.placeholder.com/400x400/eee/000?text=Shirt"},{id:11,n:"Ripped Jeans",p:150,i:"https://via.placeholder.com/400x400/33f/fff?text=Ripped"},{id:12,n:"Brown Sandals",p:80,i:"https://via.placeholder.com/400x400/963/fff?text=Sandals"}];var cart=[];var cur=null;var grid=document.getElementById("grid");var tit=document.getElementById("tit");function draw(list){grid.innerHTML="";for(var j=0;j<list.length;j++){var it=list[j];var d=document.createElement("div");d.className="card";d.setAttribute("onclick","openP("+it.id+")");var img=document.createElement("img");img.src=it.i;var txt=document.createElement("div");txt.innerHTML=it.n+"<br><b>GH₵"+it.p+" FULL</b>";d.appendChild(img);d.appendChild(txt);grid.appendChild(d);}tit.innerText="All - "+list.length+" items";}function tab(n){var ps=document.querySelectorAll(".page");for(var i=0;i<ps.length;i++)ps[i].classList.remove("on");var bs=document.querySelectorAll(".nav b");for(var i=0;i<bs.length;i++)bs[i].classList.remove("on");document.getElementById(n).classList.add("on");document.getElementById("n-"+n).classList.add("on");}function goCat(c){tab("shop");if(c==""){draw(items);return;}var f=[];for(var i=0;i<items.length;i++){if(items[i].n.toLowerCase().indexOf(c)>=0)f.push(items[i]);}draw(f);}function filter(){var q=document.getElementById("q").value.toLowerCase();if(!q){draw(items);return;}var f=[];for(var i=0;i<items.length;i++){if(items[i].n.toLowerCase().indexOf(q)>=0)f.push(items[i]);}draw(f);}function openP(id){for(var i=0;i<items.length;i++)if(items[i].id==id)cur=items[i];document.getElementById("mi").src=cur.i;document.getElementById("mn").innerText=cur.n;document.getElementById("mp").innerText="GH₵"+cur.p;document.getElementById("mP").classList.add("on");}function closeP(){document.getElementById("mP").classList.remove("on");}function addC(){cart.push(cur);document.getElementById("cn").innerText=cart.length;var cl=document.getElementById("clist");cl.innerHTML="";var tot=0;for(var i=0;i<cart.length;i++){tot+=cart[i].p;cl.innerHTML+=cart[i].n+" - GH₵"+cart[i].p+"<br>";}cl.innerHTML+="<br><b>Total GH₵"+tot+"</b><br><button class=btn bk onclick=window.open('https://wa.me/233594221108?text=Order GH₵"+tot+"')>CHECKOUT</button>";closeP();tab("cart");}function buyW(){window.open("https://wa.me/233594221108?text=I want "+cur.n);}draw(items);var tl=document.getElementById("tlist");for(var i=0;i<items.length;i++){var x=items[i];tl.innerHTML+="<div style=padding:10px;border:1px solid #eee;margin:5px;border-radius:8px onclick=openP("+x.id+")>"+x.n+" - GH₵"+x.p+"</div>";}</script></body></html>
