<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live - Dornny</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-3">
<input id="title" placeholder="What are you selling? e.g Bags GH120" class="w-full p-3 rounded-xl bg-[#2a2a2a] text-white mb-3">
<div class="flex gap-2 mb-3">
<button id="startBtn" onclick="startLive()" class="bg-red-600 px-5 py-2.5 rounded-full font-bold">🔴 Start Live Camera</button>
<a href="./index.html" class="bg-[#2a2a2a] px-5 py-2.5 rounded-full">← Market</a>
</div>
<video id="video" autoplay muted playsinline class="w-full h-[60vh] bg-[#1a1a1a] rounded-2xl object-cover"></video>
<p id="status" class="text-center mt-3 text-gray-400">Tap Start Live Camera and ALLOW camera when asked</p>
<script>
async function startLive(){
  const status=document.getElementById('status');
  try{
    status.innerText='Requesting camera... please tap Allow';
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:true});
    document.getElementById('video').srcObject = stream;
    status.innerText='🔴 LIVE! You are live now - '+ (document.getElementById('title').value||'Selling');
    document.getElementById('startBtn').innerText='🔴 LIVE';
  }catch(e){
    alert('Camera blocked. Tap 🔒 lock icon at top -> Permissions -> Camera -> Allow, then refresh page. Error: '+e.message);
    status.innerText='Camera permission denied. Tap 🔒 icon top to allow.';
  }
}
</script>
</body>
</html>
