<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dornny LIVE 🔴</title>
<style>
body{margin:0;font-family:system-ui;background:#000;color:#fff}
.top{padding:10px;background:#111;display:flex;gap:6px;flex-wrap:wrap}
.top input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#222;color:#fff}
.btn{padding:10px 14px;border-radius:8px;border:0;font-weight:700}
.live{background:red;color:#fff}
.back{background:#333;color:#fff;text-decoration:none;padding:10px 14px;border-radius:8px}
#video{width:100%;height:60vh;background:#111;object-fit:cover}
#info{background:#111;padding:12px}
.buy{background:#00c853;color:#fff;width:100%;padding:14px;border-radius:10px;font-size:18px;font-weight:800;border:0;margin-top:10px}
</style>
</head>
<body>
<div class="top">
<input id="title" placeholder="What are you selling? e.g Bags GH120">
<button class="btn live" onclick="startLive()">🔴 Start Live Camera</button>
<a href="index.html" class="back">← Market</a>
</div>
<video id="video" autoplay playsinline muted></video>
<div id="info">
<div id="liveStatus">📷 Click Start Live to show your face & products</div>
<button class="btn buy" onclick="shareLive()">📤 Share Live Link on WhatsApp</button>
<button class="btn buy" style="background:#ff6f00" onclick="location.href='index.html'">🛒 Buyers Go To Market</button>
</div>
<script>
async function startLive(){
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
  document.getElementById('video').srcObject=s;
  document.getElementById('liveStatus').innerHTML='🔴 LIVE NOW - '+document.getElementById('title').value+'<br>Share link: '+location.href;
 }catch(e){ alert('Allow camera! Error: '+e.message); }
}
function shareLive(){
 const t=document.getElementById('title').value||'Dornny Live Sale';
 const url=location.href;
 const msg=encodeURIComponent('🔴 *'+t+'* LIVE NOW on Dornny Market! Watch me: '+url);
 window.open('https://wa.me/?text='+msg);
}
</script>
</body>
</html>
